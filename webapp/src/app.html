<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Aileron</title>
		<link rel="preconnect" href="https://use.typekit.net" crossorigin />
		<link rel="stylesheet" href="https://use.typekit.net/par8udz.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			// Page-background parallax. Shifts background-position-y at half the
			// scroll rate so the textured page bg appears to scroll at 50% the
			// speed of content. RAF-throttled; passive listener. The listener
			// attaches once and persists across SvelteKit SPA navigation.
			(function () {
				let ticking = false;
				const update = () => {
					document.body.style.backgroundPositionY = window.scrollY * 0.5 + 'px';
					ticking = false;
				};
				window.addEventListener('scroll', () => {
					if (!ticking) {
						ticking = true;
						requestAnimationFrame(update);
					}
				}, { passive: true });
				update();
			})();
		</script>
	</body>
</html>
