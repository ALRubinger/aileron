codecov:
  notify:
    after_n_builds: 5

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
        after_n_builds: 5
      ui:
        target: auto
        threshold: 5%
        flags:
          - ui
    patch:
      default:
        target: 80%
        threshold: 2%
        after_n_builds: 5

flags:
  unit:
    paths:
      - internal/
      - cmd/aileron/
      - cmd/aileron-mcp/
      - sdk/go/
    carryforward: false
  integration:
    paths:
      - internal/
      - cmd/aileron-mcp/
    carryforward: false
  ui:
    paths:
      - ui/src/
    carryforward: false
  ui-e2e:
    paths:
      - ui/src/
    carryforward: true

ignore:
  - "internal/api/gen/**"             # generated code (oapi-codegen) — DO NOT EDIT
  - "internal/sessions/sessionstest/**" # test-helper package; err-check branches only fire when SUT misbehaves
  - "internal/tools/**"               # release-prep dev tooling (shells out to docker); pure logic lives in & is tested by the packages it serves
  - "ui/**"                           # tracked separately via ui flag
  - "webapp/**"                       # webapp tests run via vitest; coverage not uploaded to codecov
  - "docs/**"                         # documentation and ADRs
  - "images/**"                       # container image definitions are validated by build smoke tests

comment:
  layout: "condensed_header, diff, flags, components"
  require_changes: true
