codecov:
  notify:
    after_n_builds: 2
    wait_for_ci: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%

flags:
  unit:
    paths:
      - core/
      - sdk/go/
    carryforward: false
  integration:
    paths:
      - core/
    carryforward: false

ignore:
  - "core/api/gen/**"   # generated code (oapi-codegen) — DO NOT EDIT
  - "ui/**"             # SvelteKit UI — needs its own test framework
  - "docs/**"           # documentation and ADRs

comment:
  layout: "condensed_header, diff, flags, components"
  require_changes: true
