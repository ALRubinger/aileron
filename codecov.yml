codecov:
  notify:
    after_n_builds: 2

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        after_n_builds: 2
    patch:
      default:
        target: 80%
        after_n_builds: 2

flags:
  unit:
    paths:
      - core/
      - sdk/go/
    carryforward: false
  integration:
    paths:
      - core/
    carryforward: false

ignore:
  - "core/api/gen/**"       # generated code (oapi-codegen) — DO NOT EDIT
  - "core/store/postgres/**" # requires live PostgreSQL — covered by integration tests
  - "ui/**"                  # SvelteKit UI — needs its own test framework
  - "docs/**"                # documentation and ADRs

comment:
  layout: "condensed_header, diff, flags, components"
  require_changes: true
