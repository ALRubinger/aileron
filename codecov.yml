codecov:
  notify:
    after_n_builds: 4

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
        after_n_builds: 4
      ui:
        target: auto
        threshold: 5%
        flags:
          - ui
    patch:
      default:
        target: 80%
        threshold: 2%
        after_n_builds: 4

flags:
  unit:
    paths:
      - core/
      - enclave/
      - cmd/aileron-enclave/
      - cmd/aileron-mcp/
      - sdk/go/
    carryforward: false
  integration:
    paths:
      - core/
      - enclave/
      - cmd/aileron-enclave/
      - cmd/aileron-mcp/
    carryforward: false
  ui:
    paths:
      - ui/src/
    carryforward: false
  ui-e2e:
    paths:
      - ui/src/
    carryforward: true

ignore:
  - "core/api/gen/**"       # generated code (oapi-codegen) — DO NOT EDIT
  - "ui/**"                  # tracked separately via ui flag
  - "docs/**"                # documentation and ADRs

comment:
  layout: "condensed_header, diff, flags, components"
  require_changes: true
