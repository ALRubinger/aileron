name: Sandbox Base Image

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sandbox-base.yml"
      - "images/sandbox-base/**"
      # The published image now bakes aileron-mcp (issue #957), so a change to
      # the binary's source must rebuild the image on PR. internal/** is broad
      # but correct: aileron-mcp links the internal module.
      - "cmd/aileron-mcp/**"
      - "internal/**"
      - "sdk/go/**"
      - "go.work"
      - "go.work.sum"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sandbox-base-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/alrubinger/aileron-sandbox-base

jobs:
  build:
    name: Build sandbox-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # Version stamped into the baked aileron-mcp and the
      # ai.aileron.mcp.version image label. Tag builds carry the release
      # version (v-prefix stripped to match version.Version); PR and dispatch
      # builds use "dev", consistent with the host CLI's default version.
      - name: Resolve build version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=git-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Aileron sandbox base
            org.opencontainers.image.description=Minimal sandbox substrate for Aileron-managed agent containers.

      - name: Log in to GitHub Container Registry
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # context is the repo root so the builder stage can compile aileron-mcp
      # from go.work + source; the baked recipe lives in Containerfile.published.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/sandbox-base/Containerfile.published
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AILERON_VERSION=${{ steps.ver.outputs.version }}
            AILERON_COMMIT=${{ github.sha }}

      # Single-arch local load so the next step can `docker run` the image.
      # The multi-arch build above cannot use `load: true`.
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/sandbox-base/Containerfile.published
          load: true
          tags: aileron-sandbox-base:smoke
          build-args: |
            AILERON_VERSION=${{ steps.ver.outputs.version }}
            AILERON_COMMIT=${{ github.sha }}

      # Image-fidelity smoke against the published (baked) image: the bash
      # substrate, the baked-MCP invariants (#957, the binary runs and the
      # version label is present), and the #959 invariants (no tools.txt or
      # tools profile banner survives, the proxy CA path is intact for
      # bootstrap). Earlier matrices exercised the #801 shell-mediation
      # surface that #952 fully removed.
      - name: Smoke test image
        run: |
          set -euo pipefail
          IMG=aileron-sandbox-base:smoke
          docker run --rm "$IMG" bash -c 'echo hi' | grep -q '^hi$'
          bash_path=$(docker run --rm "$IMG" which bash)
          if [ "$bash_path" != "/bin/bash" ]; then
            echo "expected which bash to resolve to /bin/bash, got $bash_path"
            exit 1
          fi
          docker run --rm "$IMG" sh -c '[ ! -d /etc/aileron/shell ]'

          # Baked aileron-mcp runs and reports a non-empty version.
          mcp_version=$(docker run --rm "$IMG" aileron-mcp --version)
          if [ -z "$mcp_version" ]; then
            echo "baked aileron-mcp --version returned empty"
            exit 1
          fi
          echo "baked aileron-mcp --version: $mcp_version"

          # The ai.aileron.mcp.version label is present (launcher detection key).
          label=$(docker inspect --format '{{ index .Config.Labels "ai.aileron.mcp.version" }}' "$IMG")
          if [ -z "$label" ]; then
            echo "ai.aileron.mcp.version label missing on smoke image"
            exit 1
          fi
          echo "ai.aileron.mcp.version label: $label"

          # #959: the tools.txt manifest and its profile banner are gone.
          docker run --rm "$IMG" sh -c '[ ! -e /etc/aileron/tools.txt ]'
          docker run --rm "$IMG" sh -c '[ ! -e /etc/profile.d/aileron-tools.sh ]'
          login_out=$(docker run --rm "$IMG" bash -lc 'true' 2>&1 || true)
          if printf '%s' "$login_out" | grep -qi 'tools manifest'; then
            echo "login shell still prints a stale tools manifest banner: $login_out"
            exit 1
          fi
          # The proxy CA path must survive the tools.txt removal: the
          # directory exists and the installer helper is present so a
          # bootstrap launch can write /etc/aileron/proxy/ca.pem.
          docker run --rm "$IMG" sh -c '[ -d /etc/aileron/proxy ]'
          docker run --rm "$IMG" sh -c '[ -x /usr/local/bin/aileron-install-proxy-ca ]'
          echo "sandbox-base smoke test passed"
