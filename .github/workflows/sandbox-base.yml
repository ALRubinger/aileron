name: Sandbox Base Image

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sandbox-base.yml"
      - "images/sandbox-base/**"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sandbox-base-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/alrubinger/aileron-sandbox-base

jobs:
  build:
    name: Build sandbox-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=git-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Aileron sandbox base
            org.opencontainers.image.description=Minimal sandbox substrate for Aileron-managed agent containers.

      - name: Log in to GitHub Container Registry
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: images/sandbox-base
          file: images/sandbox-base/Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Single-arch local load so the next step can `docker run` the image.
      # The multi-arch build above cannot use `load: true`.
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: images/sandbox-base
          file: images/sandbox-base/Containerfile
          load: true
          tags: aileron-sandbox-base:smoke

      # Proves the shell mediator works against the real Alpine BusyBox wget +
      # grep, not just the host shell exercised by the Go tests in
      # internal/sandbox/container. The exhaustive allow/deny/error matrix lives
      # there; this step is the image-fidelity gate (R7 / U3).
      - name: Smoke test shell mediator against a stub daemon
        run: |
          set -euo pipefail

          # Allow stub on 8099 (slice 5); deny stub on 8098 (slice 6). The
          # container reaches both over the shared host network. The deny stub
          # surfaces the slice-6 stable reason format ("matched deny pattern:
          # ^denied-cmd") and a matched_pattern field so the routed bash -c
          # path can assert the stderr text the user actually sees.
          cat > /tmp/stub_allow.py <<'PY'
          import http.server, socketserver, json
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  ln = int(self.headers.get('Content-Length', '0'))
                  self.rfile.read(ln)
                  body = json.dumps({"status": "decided", "decision": "allow",
                                     "audit_id": "smoke", "reason": "allow-only"}).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a):
                  pass
          with socketserver.TCPServer(("127.0.0.1", 8099), H) as s:
              s.serve_forever()
          PY
          cat > /tmp/stub_deny.py <<'PY'
          import http.server, socketserver, json
          DENY_PATTERN = "^denied-cmd"
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  ln = int(self.headers.get('Content-Length', '0'))
                  self.rfile.read(ln)
                  body = json.dumps({"status": "decided", "decision": "deny",
                                     "audit_id": "smoke-deny",
                                     "reason": f"matched deny pattern: {DENY_PATTERN}",
                                     "matched_pattern": DENY_PATTERN}).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a):
                  pass
          with socketserver.TCPServer(("127.0.0.1", 8098), H) as s:
              s.serve_forever()
          PY
          python3 /tmp/stub_allow.py &
          ALLOW_PID=$!
          python3 /tmp/stub_deny.py &
          DENY_PID=$!
          trap "kill $ALLOW_PID $DENY_PID 2>/dev/null || true" EXIT

          # Wait for both stubs to actually answer before running assertions, so
          # a slow or failed start surfaces here instead of as a confusing
          # unreachable-daemon error downstream.
          for port in 8099 8098; do
            ready=0
            for _ in $(seq 1 50); do
              if curl -sf -o /dev/null --max-time 1 -X POST "http://127.0.0.1:${port}/ready" --data '{}'; then
                ready=1
                break
              fi
              sleep 0.2
            done
            if [ "$ready" -ne 1 ]; then
              echo "stub daemon failed to start on port ${port}"
              exit 1
            fi
          done

          IMG=aileron-sandbox-base:smoke

          echo "== allow decision -> expect exit 0 =="
          docker run --rm --network host \
            -e AILERON_SANDBOX_SHELL_MEDIATION=1 \
            -e AILERON_API_URL=http://127.0.0.1:8099 \
            -e AILERON_TOKEN=smoke-token \
            -e AILERON_SESSION_ID=smoke-session \
            -e AILERON_REAL_SHELL=/bin/bash \
            "$IMG" aileron-shell-mediator intercept "echo hi"

          echo "== closed port -> expect fail closed (nonzero) =="
          if docker run --rm --network host \
            -e AILERON_SANDBOX_SHELL_MEDIATION=1 \
            -e AILERON_API_URL=http://127.0.0.1:9099 \
            -e AILERON_TOKEN=smoke-token \
            -e AILERON_SESSION_ID=smoke-session \
            -e AILERON_REAL_SHELL=/bin/bash \
            "$IMG" aileron-shell-mediator intercept "echo hi"; then
            echo "expected nonzero exit when the daemon is unreachable"
            exit 1
          fi

          echo "== mediation off -> expect passthrough (exit 0, no daemon call) =="
          docker run --rm --network host \
            -e AILERON_API_URL=http://127.0.0.1:9099 \
            -e AILERON_TOKEN=smoke-token \
            "$IMG" aileron-shell-mediator intercept "echo hi"

          # The cases above drive the mediator directly. The cases below prove
          # the routed path the live agent session actually uses: the wrapper
          # ahead of the real shell on PATH and the agent's non-interactive
          # `bash -c` model (U3).

          echo "== which bash resolves to the wrapper (R1) =="
          resolved=$(docker run --rm --network host "$IMG" sh -c 'command -v bash')
          echo "resolved=$resolved"
          if [ "$resolved" != "/usr/local/bin/bash" ]; then
            echo "expected bash to resolve to /usr/local/bin/bash, got '$resolved'"
            exit 1
          fi

          echo "== routed bash -c against allow stub -> exit 0 and command runs (R2/R3) =="
          out=$(docker run --rm --network host \
            -e AILERON_SANDBOX_SHELL_MEDIATION=1 \
            -e AILERON_API_URL=http://127.0.0.1:8099 \
            -e AILERON_TOKEN=smoke-token \
            -e AILERON_SESSION_ID=smoke-session \
            -e AILERON_REAL_SHELL=/bin/bash \
            "$IMG" bash -c 'echo routed-hi')
          echo "$out"
          if ! echo "$out" | grep -q routed-hi; then
            echo "routed non-interactive command did not run under the allow stub"
            exit 1
          fi

          echo "== routed bash -c with closed port -> command vetoed, fail closed (R3) =="
          # The trap installed via BASH_ENV must veto the command when the daemon
          # is unreachable. Slice 6 also halts the shell with a nonzero exit on
          # the fail-closed path (R7 + the chosen halt mechanism per ADR-0021),
          # so assert both: the side effect did not happen AND the bash process
          # exited nonzero AND the closed-port chain does not continue.
          vout=$(docker run --rm --network host \
            -e AILERON_SANDBOX_SHELL_MEDIATION=1 \
            -e AILERON_API_URL=http://127.0.0.1:9099 \
            -e AILERON_TOKEN=smoke-token \
            -e AILERON_SESSION_ID=smoke-session \
            -e AILERON_REAL_SHELL=/bin/bash \
            "$IMG" bash -c 'echo FIRST && echo SECOND' 2>/dev/null || true)
          if echo "$vout" | grep -q FIRST; then
            echo "routed FIRST ran despite an unreachable daemon (trap not installed or not vetoing)"
            exit 1
          fi
          if echo "$vout" | grep -q SECOND; then
            echo "routed chain did not halt after fail-closed (slice 6 R3 regression)"
            exit 1
          fi
          if docker run --rm --network host \
            -e AILERON_SANDBOX_SHELL_MEDIATION=1 \
            -e AILERON_API_URL=http://127.0.0.1:9099 \
            -e AILERON_TOKEN=smoke-token \
            -e AILERON_SESSION_ID=smoke-session \
            -e AILERON_REAL_SHELL=/bin/bash \
            "$IMG" bash -c 'echo should-not-print' 2>/dev/null; then
            echo "expected nonzero exit on fail-closed (slice 6 R7 regression)"
            exit 1
          fi

          # The remaining cases prove the slice-6 deny contract on the routed
          # path: deny halts the && / ; chain, the stable reason format reaches
          # stderr, and an interactive bash under a real pty keeps the soft-veto
          # contract (REPL stays alive, exit 0). The pty case is the gate the
          # no-TTY `docker run` shape would silently miss.

          echo "== routed bash -c against deny stub -> chain halted AND nonzero exit (R2/R3) =="
          dout=$(docker run --rm --network host \
            -e AILERON_SANDBOX_SHELL_MEDIATION=1 \
            -e AILERON_API_URL=http://127.0.0.1:8098 \
            -e AILERON_TOKEN=smoke-token \
            -e AILERON_SESSION_ID=smoke-session \
            -e AILERON_REAL_SHELL=/bin/bash \
            "$IMG" bash -c 'echo FIRST && echo SECOND' 2>&1 || true)
          if echo "$dout" | grep -q FIRST; then
            echo "deny did not veto FIRST: stdout/stderr=$dout"
            exit 1
          fi
          if echo "$dout" | grep -q SECOND; then
            echo "deny did not halt && chain: SECOND printed; stdout/stderr=$dout"
            exit 1
          fi
          if ! echo "$dout" | grep -q "\[Aileron\] denied:"; then
            echo "expected [Aileron] denied: on stderr under deny; got: $dout"
            exit 1
          fi
          if docker run --rm --network host \
            -e AILERON_SANDBOX_SHELL_MEDIATION=1 \
            -e AILERON_API_URL=http://127.0.0.1:8098 \
            -e AILERON_TOKEN=smoke-token \
            -e AILERON_SESSION_ID=smoke-session \
            -e AILERON_REAL_SHELL=/bin/bash \
            "$IMG" bash -c 'echo FIRST && echo SECOND' >/dev/null 2>&1; then
            echo "expected nonzero exit on deny (R2)"
            exit 1
          fi

          echo "== routed bash -c against deny stub -> stable reason text on stderr =="
          # KTD2 commits the deny reason format as "matched deny pattern: <src>".
          # Surface a verbatim assertion so a future slice that renames the
          # prefix breaks here and not in a downstream pattern-matcher.
          rout=$(docker run --rm --network host \
            -e AILERON_SANDBOX_SHELL_MEDIATION=1 \
            -e AILERON_API_URL=http://127.0.0.1:8098 \
            -e AILERON_TOKEN=smoke-token \
            -e AILERON_SESSION_ID=smoke-session \
            -e AILERON_REAL_SHELL=/bin/bash \
            "$IMG" bash -c 'true' 2>&1 || true)
          if ! echo "$rout" | grep -q "\[Aileron\] denied: matched deny pattern: \^denied-cmd"; then
            echo "deny stderr did not include the stable reason format; got: $rout"
            exit 1
          fi

          echo "== routed bash -c 'denied; second' against deny stub -> second does NOT print =="
          sout=$(docker run --rm --network host \
            -e AILERON_SANDBOX_SHELL_MEDIATION=1 \
            -e AILERON_API_URL=http://127.0.0.1:8098 \
            -e AILERON_TOKEN=smoke-token \
            -e AILERON_SESSION_ID=smoke-session \
            -e AILERON_REAL_SHELL=/bin/bash \
            "$IMG" bash -c 'echo FIRST; echo SECOND' 2>&1 || true)
          if echo "$sout" | grep -q SECOND; then
            echo "deny did not halt ; chain: SECOND printed; got: $sout"
            exit 1
          fi
          if docker run --rm --network host \
            -e AILERON_SANDBOX_SHELL_MEDIATION=1 \
            -e AILERON_API_URL=http://127.0.0.1:8098 \
            -e AILERON_TOKEN=smoke-token \
            -e AILERON_SESSION_ID=smoke-session \
            -e AILERON_REAL_SHELL=/bin/bash \
            "$IMG" bash -c 'echo FIRST; echo SECOND' >/dev/null 2>&1; then
            echo "expected nonzero exit on ; chain deny"
            exit 1
          fi

          echo "== routed bash -ic under a real pty against deny stub -> REPL alive, exit 0 (R8) =="
          # The pty allocation is the load-bearing detail: docker run -i alone
          # does NOT allocate a tty (and `-t` would fail on a runner with no
          # terminal). `script -qfc` allocates a real pty around the docker
          # invocation, which is what the bashrc's `[[ $- == *i* ]]` check
          # needs to see to fire the interactive soft-veto branch. Without
          # the pty, bash drops out of interactive mode for stdin handling,
          # masking the bug we want this step to catch.
          # `script` propagates the inner command's exit code on Ubuntu's
          # util-linux build, so a nonzero here means the REPL was killed.
          rm -f /tmp/should-not-exist
          set +e
          script -qfc \
            "docker run --rm --network host -e AILERON_SANDBOX_SHELL_MEDIATION=1 -e AILERON_API_URL=http://127.0.0.1:8098 -e AILERON_TOKEN=smoke-token -e AILERON_SESSION_ID=smoke-session -e AILERON_REAL_SHELL=/bin/bash -v /tmp:/host-tmp aileron-sandbox-base:smoke bash -ic 'touch /host-tmp/should-not-exist'" \
            /tmp/script-tty.log
          tty_exit=$?
          set -e
          ttyout=$(cat /tmp/script-tty.log)
          if [ -e /tmp/should-not-exist ]; then
            echo "interactive deny did not suppress side effect; tty output: $ttyout"
            rm -f /tmp/should-not-exist
            exit 1
          fi
          if [ "$tty_exit" -ne 0 ]; then
            echo "interactive deny killed the REPL: script exit=$tty_exit; tty output: $ttyout"
            exit 1
          fi
          if ! echo "$ttyout" | grep -q "\[Aileron\] denied:"; then
            echo "expected [Aileron] denied: on interactive stderr; tty output: $ttyout"
            exit 1
          fi

          echo "shell mediator smoke test passed"
