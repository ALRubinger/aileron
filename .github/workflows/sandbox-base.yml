name: Sandbox Base Image

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sandbox-base.yml"
      - "images/sandbox-base/**"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sandbox-base-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/alrubinger/aileron-sandbox-base

jobs:
  build:
    name: Build sandbox-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=git-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Aileron sandbox base
            org.opencontainers.image.description=Minimal sandbox substrate for Aileron-managed agent containers.

      - name: Log in to GitHub Container Registry
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: images/sandbox-base
          file: images/sandbox-base/Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Single-arch local load so the next step can `docker run` the image.
      # The multi-arch build above cannot use `load: true`.
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: images/sandbox-base
          file: images/sandbox-base/Containerfile
          load: true
          tags: aileron-sandbox-base:smoke

      # Minimal image-fidelity smoke. Earlier matrices exercised the #801
      # shell-mediation surface that #952 fully removed; the only image
      # invariant remaining is "bash runs in the published image and
      # resolves to the Alpine default at /bin/bash".
      - name: Smoke test image
        run: |
          set -euo pipefail
          IMG=aileron-sandbox-base:smoke
          docker run --rm "$IMG" bash -c 'echo hi' | grep -q '^hi$'
          bash_path=$(docker run --rm "$IMG" which bash)
          if [ "$bash_path" != "/bin/bash" ]; then
            echo "expected which bash to resolve to /bin/bash, got $bash_path"
            exit 1
          fi
          docker run --rm "$IMG" sh -c '[ ! -d /etc/aileron/shell ]'
          echo "sandbox-base smoke test passed"
