name: Sandbox Base Image

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sandbox-base.yml"
      - "images/sandbox-base/**"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sandbox-base-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/alrubinger/aileron-sandbox-base

jobs:
  build:
    name: Build sandbox-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=git-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Aileron sandbox base
            org.opencontainers.image.description=Minimal sandbox substrate for Aileron-managed agent containers.

      - name: Log in to GitHub Container Registry
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: images/sandbox-base
          file: images/sandbox-base/Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Single-arch local load so the next step can `docker run` the image.
      # The multi-arch build above cannot use `load: true`.
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: images/sandbox-base
          file: images/sandbox-base/Containerfile
          load: true
          tags: aileron-sandbox-base:smoke

      # Proves the shell mediator works against the real Alpine BusyBox wget +
      # grep, not just the host shell exercised by the Go tests in
      # internal/sandbox/container. The exhaustive allow/deny/error matrix lives
      # there; this step is the image-fidelity gate (R7 / U3).
      - name: Smoke test shell mediator against a stub daemon
        run: |
          set -euo pipefail

          # Allow-only stub daemon on the host; the container reaches it over
          # the shared host network.
          cat > /tmp/stub.py <<'PY'
          import http.server, socketserver, json
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  ln = int(self.headers.get('Content-Length', '0'))
                  self.rfile.read(ln)
                  body = json.dumps({"status": "decided", "decision": "allow",
                                     "audit_id": "smoke", "reason": "allow-only"}).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a):
                  pass
          with socketserver.TCPServer(("127.0.0.1", 8099), H) as s:
              s.serve_forever()
          PY
          python3 /tmp/stub.py &
          STUB_PID=$!
          trap "kill $STUB_PID 2>/dev/null || true" EXIT
          sleep 1

          IMG=aileron-sandbox-base:smoke

          echo "== allow decision -> expect exit 0 =="
          docker run --rm --network host \
            -e AILERON_SANDBOX_SHELL_MEDIATION=1 \
            -e AILERON_API_URL=http://127.0.0.1:8099 \
            -e AILERON_TOKEN=smoke-token \
            -e AILERON_SESSION_ID=smoke-session \
            -e AILERON_REAL_SHELL=/bin/bash \
            "$IMG" aileron-shell-mediator intercept "echo hi"

          echo "== closed port -> expect fail closed (nonzero) =="
          if docker run --rm --network host \
            -e AILERON_SANDBOX_SHELL_MEDIATION=1 \
            -e AILERON_API_URL=http://127.0.0.1:9099 \
            -e AILERON_TOKEN=smoke-token \
            -e AILERON_SESSION_ID=smoke-session \
            -e AILERON_REAL_SHELL=/bin/bash \
            "$IMG" aileron-shell-mediator intercept "echo hi"; then
            echo "expected nonzero exit when the daemon is unreachable"
            exit 1
          fi

          echo "== mediation off -> expect passthrough (exit 0, no daemon call) =="
          docker run --rm --network host \
            -e AILERON_API_URL=http://127.0.0.1:9099 \
            -e AILERON_TOKEN=smoke-token \
            "$IMG" aileron-shell-mediator intercept "echo hi"

          echo "shell mediator smoke test passed"
