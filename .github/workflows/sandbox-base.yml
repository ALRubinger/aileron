name: Sandbox Base Image

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sandbox-base.yml"
      - "images/sandbox-base/**"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sandbox-base-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/alrubinger/aileron-sandbox-base

jobs:
  build:
    name: Build sandbox-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=git-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Aileron sandbox base
            org.opencontainers.image.description=Minimal sandbox substrate for Aileron-managed agent containers.

      - name: Log in to GitHub Container Registry
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: images/sandbox-base
          file: images/sandbox-base/Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Single-arch local load so the next step can `docker run` the image.
      # The multi-arch build above cannot use `load: true`.
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: images/sandbox-base
          file: images/sandbox-base/Containerfile
          load: true
          tags: aileron-sandbox-base:smoke

      # Proves the shell mediator works against the real Alpine BusyBox wget +
      # grep, not just the host shell exercised by the Go tests in
      # internal/sandbox/container. The exhaustive allow/deny/error matrix lives
      # there; this step is the image-fidelity gate (R7 / U3).
      - name: Smoke test shell mediator against a stub daemon
        run: |
          set -euo pipefail

          # Allow-only stub daemon on the host; the container reaches it over
          # the shared host network.
          cat > /tmp/stub.py <<'PY'
          import http.server, socketserver, json
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  ln = int(self.headers.get('Content-Length', '0'))
                  self.rfile.read(ln)
                  body = json.dumps({"status": "decided", "decision": "allow",
                                     "audit_id": "smoke", "reason": "allow-only"}).encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a):
                  pass
          with socketserver.TCPServer(("127.0.0.1", 8099), H) as s:
              s.serve_forever()
          PY
          python3 /tmp/stub.py &
          STUB_PID=$!
          trap "kill $STUB_PID 2>/dev/null || true" EXIT

          # Wait for the stub to actually answer before running assertions, so a
          # slow or failed start surfaces here instead of as a confusing
          # unreachable-daemon error in the allow test.
          ready=0
          for _ in $(seq 1 50); do
            if curl -sf -o /dev/null --max-time 1 -X POST http://127.0.0.1:8099/ready --data '{}'; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [ "$ready" -ne 1 ]; then
            echo "stub daemon failed to start on port 8099"
            exit 1
          fi

          IMG=aileron-sandbox-base:smoke

          echo "== allow decision -> expect exit 0 =="
          docker run --rm --network host \
            -e AILERON_SANDBOX_SHELL_MEDIATION=1 \
            -e AILERON_API_URL=http://127.0.0.1:8099 \
            -e AILERON_TOKEN=smoke-token \
            -e AILERON_SESSION_ID=smoke-session \
            -e AILERON_REAL_SHELL=/bin/bash \
            "$IMG" aileron-shell-mediator intercept "echo hi"

          echo "== closed port -> expect fail closed (nonzero) =="
          if docker run --rm --network host \
            -e AILERON_SANDBOX_SHELL_MEDIATION=1 \
            -e AILERON_API_URL=http://127.0.0.1:9099 \
            -e AILERON_TOKEN=smoke-token \
            -e AILERON_SESSION_ID=smoke-session \
            -e AILERON_REAL_SHELL=/bin/bash \
            "$IMG" aileron-shell-mediator intercept "echo hi"; then
            echo "expected nonzero exit when the daemon is unreachable"
            exit 1
          fi

          echo "== mediation off -> expect passthrough (exit 0, no daemon call) =="
          docker run --rm --network host \
            -e AILERON_API_URL=http://127.0.0.1:9099 \
            -e AILERON_TOKEN=smoke-token \
            "$IMG" aileron-shell-mediator intercept "echo hi"

          # The cases above drive the mediator directly. The cases below prove
          # the routed path the live agent session actually uses: the wrapper
          # ahead of the real shell on PATH and the agent's non-interactive
          # `bash -c` model (U3).

          echo "== which bash resolves to the wrapper (R1) =="
          resolved=$(docker run --rm --network host "$IMG" sh -c 'command -v bash')
          echo "resolved=$resolved"
          if [ "$resolved" != "/usr/local/bin/bash" ]; then
            echo "expected bash to resolve to /usr/local/bin/bash, got '$resolved'"
            exit 1
          fi

          echo "== routed bash -c against allow stub -> exit 0 and command runs (R2/R3) =="
          out=$(docker run --rm --network host \
            -e AILERON_SANDBOX_SHELL_MEDIATION=1 \
            -e AILERON_API_URL=http://127.0.0.1:8099 \
            -e AILERON_TOKEN=smoke-token \
            -e AILERON_SESSION_ID=smoke-session \
            -e AILERON_REAL_SHELL=/bin/bash \
            "$IMG" bash -c 'echo routed-hi')
          echo "$out"
          if ! echo "$out" | grep -q routed-hi; then
            echo "routed non-interactive command did not run under the allow stub"
            exit 1
          fi

          echo "== routed bash -c with closed port -> command vetoed, fail closed (R3) =="
          # The trap installed via BASH_ENV must veto the command when the daemon
          # is unreachable. The extdebug veto suppresses the command rather than
          # failing the shell, so assert on the suppressed side effect (the echo
          # not printing), not on the exit code.
          vout=$(docker run --rm --network host \
            -e AILERON_SANDBOX_SHELL_MEDIATION=1 \
            -e AILERON_API_URL=http://127.0.0.1:9099 \
            -e AILERON_TOKEN=smoke-token \
            -e AILERON_SESSION_ID=smoke-session \
            -e AILERON_REAL_SHELL=/bin/bash \
            "$IMG" bash -c 'echo should-not-print' 2>/dev/null || true)
          if echo "$vout" | grep -q should-not-print; then
            echo "routed command ran despite an unreachable daemon (trap not installed or not vetoing)"
            exit 1
          fi

          echo "shell mediator smoke test passed"
