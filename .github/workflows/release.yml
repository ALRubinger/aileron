name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # cosign keyless signing via OIDC

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: |
            internal/go.mod
            cmd/aileron-mcp/go.mod
            sdk/go/go.mod

      - uses: pnpm/action-setup@v5
        with:
          version: 11.0.9

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build webapp for embed
        # aileron-server embeds internal/app/webapp_dist/ via go:embed. The dir
        # is gitignored except .gitkeep, so a fresh checkout has no assets — a
        # released binary built without this step would serve webappNotBuiltStub.
        run: task build:webapp

      - name: Build spawn-forwarder WASM for embed
        # cmd/aileron embeds internal/sandbox/forwarder/embedded/spawn-forwarder.wasm
        # via go:embed (per ADR-0002's spawn-primitive section). The dir is
        # gitignored except .gitkeep — same pattern as webapp_dist — so a fresh
        # checkout has no WASM. A released binary built without this step would
        # have an empty forwarder.WASM, and the action executor would refuse to
        # load any connector that declares connector.forwarder.
        run: task build:forwarder

      - name: Install cosign
        # Pinned to v4.1.2 (the latest v4.x at time of pinning). The
        # repo doesn't publish a moving `v4` major-version tag — only
        # specific patch tags within v4.x and a moving `v3`. Bump the
        # pin when newer v4.x or v5 tags ship.
        uses: sigstore/cosign-installer@v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with contents:write on ALRubinger/homebrew-aileron, used
          # by goreleaser's brews step to commit Formula/aileron.rb.
          # GITHUB_TOKEN scopes to this repo only and can't write
          # across repos. Configure as a repo secret before tagging
          # the first release.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Trigger docs site rebuild
        # The docs site's `$lib/data/release.ts` fetches the latest
        # release tag from GitHub at build time, so install URLs and
        # version text in getting-started reflect whatever's current.
        # Railway only auto-rebuilds on push-to-main; a release tag
        # alone doesn't move main, so the docs would otherwise stay
        # frozen at the previous release until the next code push.
        #
        # Hits Railway's GraphQL deploymentCreate mutation directly.
        # Inlined here (rather than a separate workflow on `release:
        # published`) because events triggered by GITHUB_TOKEN don't
        # cascade into other workflow runs — goreleaser publishes the
        # release using GITHUB_TOKEN, so a `release: published` listener
        # would never fire.
        #
        # The serviceId and environmentId are project-scoped UUIDs from
        # Railway dashboard → project → service → Settings (or the
        # auto-generated example in dashboard's deploy-via-API helper).
        # They're identifiers, not credentials — fine to commit.
        if: success()
        run: |
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "RAILWAY_TOKEN not configured; skipping docs rebuild"
            exit 0
          fi
          curl -fsSL -X POST https://api.railway.app/graphql \
            -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation { deploymentCreate(input: {serviceId: \"f8f317e4-02d1-4e41-9375-d570214702f4\", environmentId: \"64bbbfb8-a7ce-4caf-96cb-df94e1c7356e\"}) { id } }"
            }'
          echo "Triggered Railway docs rebuild"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
