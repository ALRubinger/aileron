name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: |
            internal/go.mod
            cmd/aileron/go.mod
            cmd/aileron-mcp/go.mod
            sdk/go/go.mod
            test/integration/go.mod
            test/system/lib/go.sum

      - name: Verify generated code
        working-directory: internal
        run: |
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen --config api/oapi-codegen.yaml api/openapi.yaml
          git diff --exit-code api/gen/

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Go vet
        run: task vet:go

      - name: Svelte check
        working-directory: ui
        run: pnpm check

  test:
    # Sharded Linux Go unit tests. The single-shot equivalent is
    # `task test:go:ci`; CI splits it into two matrix shards because
    # internal/sandbox/... accounts for ~44% of total Go test wall
    # time. Two parallel shards cut Unit Tests wall from ~5m → ~2m30s.
    # Both shards upload coverage under the `unit` flag; Codecov
    # merges by file.
    name: Unit Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [sandbox, rest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: |
            internal/go.mod
            cmd/aileron/go.mod
            cmd/aileron-mcp/go.mod
            sdk/go/go.mod
            test/integration/go.mod
            test/system/lib/go.sum

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run Go tests
        run: task test:go:ci:${{ matrix.shard }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ALRubinger/aileron
          flags: unit

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test-macos:
    # Targeted macOS job: exercises the platform-specific spawn
    # sandbox added in #721. The darwin-tagged code in
    # internal/sandbox/spawn_sandbox_darwin.go generates the SBPL
    # profile and shells out to /usr/bin/sandbox-exec, which only
    # exists on macOS. The full test suite still runs on
    # ubuntu-latest above; this job adds CI coverage for the
    # //go:build darwin files that ubuntu-latest skips entirely.
    #
    # Scope is intentionally narrow to internal/sandbox/...: the
    # darwin-tagged surface lives there, and broadening would
    # double Codecov upload time without catching anything the
    # ubuntu job doesn't already see.
    name: Unit Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: internal/go.mod

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run platform-specific sandbox tests
        shell: bash
        run: |
          set -e
          # launch/hostimport carries the darwin-tagged Keychain shell-out
          # (keychain_darwin.go) for `aileron auth <agent> --import-from-host`
          # (#986). It only compiles and runs on macOS, so it joins the
          # sandbox package in this job's glob to get real CI coverage.
          (cd internal && go test -race -coverprofile=coverage-darwin-internal.txt ./sandbox/... ./launch/hostimport/...)

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ALRubinger/aileron
          files: internal/coverage-darwin-internal.txt
          # Merge with the Linux unit-test flag so codecov reports a
          # single, combined "unit" coverage; macOS uploads add the
          # *_darwin.go files that Linux runs cannot measure.
          flags: unit

  test-windows:
    # Targeted Windows job: exercises the platform-specific lock and
    # process-detach primitives added for Windows support (#574) —
    # discovery (LockFileEx, GetFileInformationByHandle) and spawn
    # (DETACHED_PROCESS|CREATE_NEW_PROCESS_GROUP). The full test suite
    # still runs on ubuntu-latest above.
    #
    # Scope is intentionally narrow: cmd/aileron's existing tests have
    # POSIX-isms (HOME vs USERPROFILE, exec.LookPath without `.exe`,
    # chmod 0o000) that long predate this PR. Tracked in #577 — running
    # them here would mask the real signal from the new code paths.
    name: Unit Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: |
            internal/go.mod
            cmd/aileron/go.mod

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run platform-specific tests
        shell: bash
        run: |
          set -e
          # -v surfaces individual test names so a failure shows which
          # test broke. Without it, `go test` only reports `FAIL pkg`
          # at the package level when no test prints anything, which
          # hides syscall-level hangs that don't produce stdout.
          # launch/hostimport's file_other.go is the Windows credential-file
          # read for `aileron auth <agent> --import-from-host` (#986). The
          # file-mode test runs here so %USERPROFILE% path resolution is
          # verified on a real Windows runner.
          (cd internal && go test -v -race -coverprofile=coverage-windows-internal.txt ./daemon/discovery/... ./daemon/spawn/... ./sandbox/... ./launch/hostimport/...)
          (cd cmd/aileron && go test -race -coverprofile=coverage-windows-aileron.txt .)

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ALRubinger/aileron
          files: internal/coverage-windows-internal.txt,cmd/aileron/coverage-windows-aileron.txt
          # Merge with the Linux unit-test flag so codecov reports a
          # single, combined "unit" coverage; Windows uploads add the
          # *_windows.go files that Linux runs cannot measure.
          flags: unit

  release-smoke-windows:
    # Windows release smoke for the Scoop distribution path (#1094). We
    # cannot exercise real Windows from the dev environment, so this job
    # is the safety net: it validates the GoReleaser config (including the
    # scoops block), builds the Windows artifacts, and confirms the binary
    # runs natively.
    #
    # The Scoop manifest (aileron.json) is written only by GoReleaser's
    # publish pipe, which --snapshot disables, so a snapshot never emits
    # dist/scoop/aileron.json. `goreleaser check` is therefore what
    # validates the scoops block on a PR; the snapshot build then proves
    # the windows/amd64 zip is produced and the binary executes.
    name: Windows Release Smoke
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          # Matches the three binaries GoReleaser builds (./internal/server,
          # ./cmd/aileron, ./cmd/aileron-mcp).
          cache-dependency-path: |
            internal/go.mod
            cmd/aileron/go.mod
            cmd/aileron-mcp/go.mod

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install GoReleaser
        # `task release:*` invokes a bare `goreleaser` binary; nothing else
        # in this job provisions it, so install it explicitly here (the same
        # action release.yml uses, in install-only mode).
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true

      - name: Validate GoReleaser config
        run: task release:check

      - name: Build snapshot artifacts
        # --skip=sign: cosign keyless signing needs OIDC this PR job does not
        # provision. Signing is exercised by the real release workflow, not
        # this smoke. aileron-server embeds internal/app/webapp_dist/, which
        # ships a .gitkeep stub, so the snapshot compiles without a webapp
        # build step.
        run: task release:snapshot -- --skip=sign

      - name: Verify the Windows binary runs natively
        shell: bash
        run: |
          set -e
          exe=$(find dist -name 'aileron.exe' -path '*windows_amd64*' | head -n1)
          if [ -z "$exe" ]; then
            echo "aileron.exe not found in dist:"
            ls -R dist
            exit 1
          fi
          echo "Running: $exe version"
          "$exe" version

  test-ui:
    name: UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      # Pinned to match the Playwright version resolved in ui/pnpm-lock.yaml
      # (currently 1.61.0). The image bakes Chromium + its system deps, so no
      # `playwright install --with-deps` / apt-get is needed. JOINT BUMP: when
      # ui/pnpm-lock.yaml's Playwright pin changes, bump this tag in lockstep
      # (and the matching tag in the test-webapp job) so the baked browser
      # stays compatible with the installed @playwright/test.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Run unit and component tests
        working-directory: ui
        run: pnpm test

      - name: Build for E2E (with coverage instrumentation)
        working-directory: ui
        run: E2E_COVERAGE=1 pnpm build

      - name: Run E2E tests
        working-directory: ui
        run: pnpm test:e2e

      # Anti-silent-skip guard: a Playwright run that executes zero tests
      # (config drift, glob mismatch, an offline browser image that makes
      # every spec self-skip) still exits 0. Fail the job unless the JUnit
      # report records at least one executed testcase, so "green" always
      # means "tests actually ran".
      - name: Assert E2E tests executed (anti-silent-skip)
        working-directory: ui
        run: |
          report="test-results/junit-playwright.xml"
          if [ ! -f "$report" ]; then
            echo "::error::Playwright JUnit report $report not found; E2E tests did not produce results" >&2
            exit 1
          fi
          # Count <testcase> elements: each one is an executed test. grep -o
          # counts occurrences (not lines), so multiple testcases on one line
          # are each counted.
          cases="$(grep -o '<testcase' "$report" | wc -l | tr -d ' ')"
          echo "Playwright executed $cases test(s)"
          if [ "$cases" -eq 0 ]; then
            echo "::error::Playwright executed 0 tests; refusing to pass on a silent skip" >&2
            exit 1
          fi

      - name: Generate E2E coverage report
        if: ${{ !cancelled() }}
        working-directory: ui
        run: npx nyc report --reporter=lcov --temp-dir=.nyc_output --report-dir=coverage-e2e

      - name: Prefix lcov paths with ui/
        if: ${{ !cancelled() }}
        working-directory: ui
        run: |
          sed -i 's|^SF:|SF:ui/|' coverage/lcov.info
          if [ -f coverage-e2e/lcov.info ]; then
            sed -i 's|^SF:|SF:ui/|' coverage-e2e/lcov.info
          fi

      - name: Upload UI coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ALRubinger/aileron
          files: ui/coverage/lcov.info
          flags: ui

      - name: Upload UI E2E coverage to Codecov
        if: ${{ !cancelled() && hashFiles('ui/coverage-e2e/lcov.info') }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ALRubinger/aileron
          files: ui/coverage-e2e/lcov.info
          flags: ui-e2e

      - name: Upload UI test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ui/test-results/junit-vitest.xml,ui/test-results/junit-playwright.xml

  test-webapp:
    name: Webapp Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      # Pinned to match the Playwright version resolved in webapp/pnpm-lock.yaml
      # (currently 1.61.0). The image bakes Chromium + its system deps, so no
      # `playwright install --with-deps` / apt-get is needed. JOINT BUMP: when
      # webapp/pnpm-lock.yaml's Playwright pin changes, bump this tag in lockstep
      # (and the matching tag in the test-ui job) so the baked browser
      # stays compatible with the installed @playwright/test.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: webapp
        run: pnpm install --frozen-lockfile

      - name: Run unit and component tests
        working-directory: webapp
        run: pnpm test

      - name: Generate design tokens
        run: node design/build/generate-tokens.mjs

      - name: Build for E2E
        working-directory: webapp
        run: pnpm build

      - name: Run E2E tests (mocked)
        working-directory: webapp
        run: pnpm test:e2e

      # Anti-silent-skip guard: a Playwright run that executes zero tests
      # (config drift, glob mismatch, an offline browser image that makes
      # every spec self-skip) still exits 0. Fail the job unless the JUnit
      # report records at least one executed testcase, so "green" always
      # means "tests actually ran".
      - name: Assert E2E tests executed (anti-silent-skip)
        working-directory: webapp
        run: |
          report="test-results/junit-playwright.xml"
          if [ ! -f "$report" ]; then
            echo "::error::Playwright JUnit report $report not found; E2E tests did not produce results" >&2
            exit 1
          fi
          # Count <testcase> elements: each one is an executed test. grep -o
          # counts occurrences (not lines), so multiple testcases on one line
          # are each counted.
          cases="$(grep -o '<testcase' "$report" | wc -l | tr -d ' ')"
          echo "Playwright executed $cases test(s)"
          if [ "$cases" -eq 0 ]; then
            echo "::error::Playwright executed 0 tests; refusing to pass on a silent skip" >&2
            exit 1
          fi

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: webapp-playwright-report
          path: webapp/playwright-report/
          retention-days: 14

      - name: Upload webapp test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: webapp/test-results/junit-vitest.xml,webapp/test-results/junit-playwright.xml

  test-webapp-integration:
    name: Webapp Integration E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: |
            internal/go.mod
            cmd/aileron/go.mod

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build daemon and CLI
        run: |
          task build:server
          task build:cli

      - name: Install webapp dependencies
        working-directory: webapp
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webapp-${{ hashFiles('webapp/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        working-directory: webapp
        # #1218: bound the apt acquire path so a stalled or unreachable apt
        # mirror fails fast instead of hanging unbounded. The apt config is the
        # real fail-fast lever: `Acquire::http::Timeout` aborts any single
        # connection that stalls for 30s, and `Acquire::Retries` retries it a
        # few times before giving up. A stalled/unreachable mirror can no
        # longer hang the install indefinitely; apt itself bounds every
        # acquire. The retry loop wraps the whole install (apt-get internal to
        # `--with-deps` *and* the browser download) for transient failures;
        # before each retry it heals any half-applied dpkg state with
        # `dpkg --configure -a` + `apt-get -f install` so a retry can succeed
        # rather than dying on a stale dpkg lock. `timeout --kill-after` is a
        # belt-and-suspenders ceiling that escalates SIGTERM->SIGKILL.
        run: |
          sudo tee /etc/apt/apt.conf.d/99aileron-ci-timeouts >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          for attempt in 1 2 3; do
            if timeout --kill-after=30 900 pnpm exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Playwright install attempt ${attempt} failed; healing dpkg state and retrying" >&2
            # `timeout` only signals the direct child; an apt-get spawned by
            # `--with-deps` can be orphaned and keep holding the dpkg lock.
            # Reap any lingering apt/dpkg, then repair half-applied state so
            # the next attempt does not die on a stale lock.
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock || true
            sudo dpkg --configure -a || true
            sudo apt-get -f install -y || true
            sleep $((attempt * 15))
          done
          echo "Playwright install failed after 3 attempts" >&2
          exit 1

      - name: Run integration E2E (real daemon + seed fixture)
        run: webapp/scripts/run-integration-e2e.sh

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: webapp-integration-playwright-report
          path: webapp/playwright-report/
          retention-days: 14

      - name: Upload integration test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: webapp/test-results/junit-playwright-integration.xml

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build docs image
        # GHA layer cache for the docs image. The same pattern was
        # tried for the integration jobs but did not produce a wall-
        # time win there: `load: true` + multi-stage Go builds add
        # ~90s of image-load overhead that swamps the cache savings,
        # and those jobs aren't on the critical path anyway.
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docs/Dockerfile
          tags: aileron-docs
          load: true
          cache-from: type=gha,scope=docs
          cache-to: type=gha,mode=max,scope=docs

      - name: Start docs container
        run: docker run -d --name docs -p 3001:3000 aileron-docs

      - name: Verify docs respond
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3001; then
              echo "Docs site healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Docs site did not respond"
          docker logs docs
          exit 1

      - name: Tear down
        if: always()
        run: docker rm -f docs

  integration-go:
    name: Integration Tests (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Create coverage directory for server-side coverage collection
        run: mkdir -p gocoverdir && chmod 777 gocoverdir

      - name: Start full stack with coverage-instrumented server
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.coverage.yml up -d --build --wait
        timeout-minutes: 5
        env:
          AILERON_DATABASE_URL: postgres://aileron:aileron@postgres:5432/aileron?sslmode=disable
          AILERON_JWT_SIGNING_KEY: ci-test-signing-key-not-for-production
          AILERON_AUTO_VERIFY_EMAIL: "true"
          AILERON_SYSTEM_VAULT_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

      - name: Wait for healthy server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/v1/health; then
              echo ""
              echo "Server healthy"
              exit 0
            fi
            sleep 3
          done
          echo "Server did not become healthy"
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.coverage.yml logs
          exit 1

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: |
            internal/go.mod
            sdk/go/go.mod
            test/integration/go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run Go integration tests
        run: gotestsum --junitfile junit-integration.xml -- -tags=integration -race -coverprofile=coverage-store.txt -coverpkg=./internal/store/postgres/... ./test/integration/... ./internal/store/postgres/...
        env:
          AILERON_API_URL: http://localhost:8080
          AILERON_UI_BASE_URL: http://localhost:3000

      - name: Run AuthSpec bind-mount writability integration test (#988)
        # The ubuntu runner has rootful Docker, where the host operator's
        # UID owns the transient AuthSpec dir but the container runs as the
        # image's non-root agent user — the exact environment where the
        # writable bind mount fails with EPERM without the chown-to-agent-
        # UID fix. The test self-skips on non-Linux / no-Docker hosts, so
        # this is the acceptance environment. Additive step so a failure is
        # attributable to this specific contract.
        run: go test -tags=integration_sandbox -run TestAuthSpecBindMountWritable ./launch/...
        working-directory: internal
        env:
          AILERON_SANDBOX_BASE_CONTEXT: ${{ github.workspace }}/images/sandbox-base

      - name: Run workspace uid-remap integration test (#1461)
        # The ubuntu runner has rootful Docker, where the host operator's UID
        # owns the workspace bind mount but the container runs as the image's
        # non-root agent user — the exact DAC mismatch that blocks the
        # writability probe (exit 3) and that the aileron-remap-agent-uid
        # entrypoint fixes by remapping the agent uid to the workspace owner.
        # The test self-skips on non-Linux / no-Docker hosts, so this is the
        # acceptance environment. Additive step so a failure is attributable to
        # this specific contract.
        run: go test -v -tags=integration_sandbox -run TestWorkspaceUIDRemap ./launch/...
        working-directory: internal
        env:
          AILERON_SANDBOX_BASE_CONTEXT: ${{ github.workspace }}/images/sandbox-base

      - name: Run in-container credential read + capture round-trip test (#1025)
        # Closes the ADR-0025 verification gap that was previously covered only
        # by a manual smoke-check: renders a Claude-shaped AuthSpec, launches a
        # real container, asserts the agent READS the credential at its
        # ContainerPath, and asserts an in-container rotation round-trips to the
        # vault on clean exit (with a clean-exit-without-rotation negative case
        # proving the freshness gate holds). The ubuntu runner has rootful
        # Docker, so this exercises the Linux chown-to-agent-UID path the
        # launcher uses in production. FAIL-FAST: requires Docker, no self-skip.
        # Additive step so a failure is attributable to this specific contract.
        run: go test -tags=integration_sandbox -run TestAuthSpecInContainerCredentialReadCapture ./launch/...
        working-directory: internal
        env:
          AILERON_SANDBOX_BASE_CONTEXT: ${{ github.workspace }}/images/sandbox-base

      - name: Run sandbox MCP integration tests (#962 — Linux automated column)
        # Exercises the aileron-mcp <-> daemon round-trip behind the sandbox
        # MCP parity work (#953, ADR-0024) over BOTH transports: the host
        # subprocess (Docker-free) and a real container (docker run against
        # debian:bookworm-slim with the cross-built linux aileron-mcp bind-
        # mounted read-only, reaching the in-process daemon via
        # host.docker.internal). Asserts tools/list exposes draft_email and
        # the contractual audit-event chain. The ubuntu runner has Docker, so
        # the container variants run here; they self-skip only if Docker or
        # the linux cross-build is unavailable. Per-agent MCP registration is
        # covered separately by TestSandboxMCPRegistration_Matrix in the unit
        # suite. Additive step so a failure is attributable to this contract.
        run: go test -tags=integration_sandbox -race -run TestSandboxMCP ./app/...
        working-directory: internal

      - name: Run in-container step-egress e2e (#1769/#1829)
        # Proves in-container step egress end to end against a real
        # `docker run`. (1) #1769: amazon/aws-cli reaches an in-process
        # sigv4-resign forward proxy through host.docker.internal (--add-host
        # host-gateway), trusting a mounted session CA via AWS_CA_BUNDLE, and
        # the proxy re-signs with the vault secret — a cryptographically valid
        # SigV4 reaches the fake upstream with NO credential bytes in the
        # container image/env/mounts/args, plus a single
        # sandbox.proxy.binding_injected audit event. (2) #1829:
        # curlimages/curl egressing under a daemon-minted STEP-SCOPED proxy
        # credential reaches its declared sealed host and is refused 403 at
        # CONNECT for an undeclared one, with the trust_denied audit event.
        # Docker is available on the ubuntu runner; the container images are
        # pulled at run time (no host `aws`/`curl` needed). Additive step so a
        # failure is attributable to this specific contract.
        run: go test -tags=integration_sandbox -race -run 'TestSandboxProxyToolContainerIntegration|TestSandboxProxyToolStepScopeContainerIntegration' ./app/...
        working-directory: internal

      - name: Run launch->gateway->Anthropic-probe regression guard (#1699)
        # Composed regression for the launch -> gateway -> Anthropic-probe seam
        # PR #1698 repaired (#1696). Renders the REAL api-key AuthSpec the
        # launcher uses (agents.NewClaude(APIKey).AuthSpec() Render +
        # RenderContent -> ANTHROPIC_API_KEY + the key-aware .claude.json
        # onboarding doc), stands up the real daemon mux order (scoped /api/
        # proxy before the webapp catch-all) against a SPEC-COMPLIANT stub
        # Anthropic upstream (401 without x-api-key, 200 + org body with it),
        # then points ANTHROPIC_BASE_URL at the daemon and issues Claude Code's
        # real GET /api/oauth/profile probe with the rendered key — asserting an
        # authenticated 200 + org object. Closes the two named weaknesses of the
        # handler-level guard: a bare echo upstream with no auth semantics, and a
        # literal key that never starts from the rendered launch env. Pure
        # in-process (no Docker, no subprocess), so it never self-skips. Fails
        # before #1698, passes after. Additive step so a failure is attributable
        # to this specific contract.
        run: go test -tags=integration_sandbox -race -run TestLaunchAnthropicProbe ./app/...
        working-directory: internal

      - name: Run auth github route-drift guard (#1157)
        # Guards against silent drift between the CLI's HARDCODED vault path
        # in cmd/aileron/auth_github.go ("/vault/user/github/credentials") and
        # the daemon's spec-registered route ("/v1/vault/user/{service}/
        # credentials"). The build-tagged test stands up the real daemon
        # handler over a MemVault, points runAuthGitHub at it with a stubbed
        # device flow, and asserts the PUT resolves to the real handler (exit
        # 0 / "Stored user/github") rather than 404/405. It is in-process with
        # no external prereqs, so it never self-skips. Build-tagged
        # (`integration`) so it stays out of the default unit suite; this
        # dedicated step is the only place it runs. Additive step so a failure
        # is attributable to this specific contract.
        run: go test -tags=integration -race -run TestRunAuthGitHub_PUTReachesRealDaemonRoute .
        working-directory: cmd/aileron

      # The composed-tools boot-guard (#1863) and the cross-arch multi-arch e2e
      # (#2038) run under the `integration_sandbox_multiarch` tag in the dedicated
      # `integration-multiarch` job below, which provisions the docker-container
      # buildx builder, the QEMU binfmt emulators, a local registry, and the
      # @devcontainers/cli the real linux/amd64+linux/arm64 build needs. This base
      # job intentionally does not run them.

      - name: Stop server to flush coverage data
        if: ${{ !cancelled() }}
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.coverage.yml stop server

      - name: Convert server coverage to text format
        if: ${{ !cancelled() }}
        run: |
          go tool covdata textfmt -i=gocoverdir -o=coverage-integration-raw.txt
          # Strip generated code — see unit test step for rationale (Codecov ignore vs internal/).
          grep -v '/api/gen/' coverage-integration-raw.txt > coverage-integration.txt
          rm coverage-integration-raw.txt

      - name: Upload integration coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ALRubinger/aileron
          files: coverage-integration.txt,coverage-store.txt
          flags: integration

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit-integration.xml

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.coverage.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.coverage.yml down -v

  integration-publish:
    name: Integration Tests (Skill Publish)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Start a local OCI registry
        run: |
          docker run -d -p 5000:5000 --restart=always --name registry registry:2
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/v2/; then echo "registry up"; exit 0; fi
            sleep 1
          done
          echo "registry did not come up"; exit 1

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: internal/go.mod

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the skill-publish e2e (composed + foreign-base, real registry)
        run: task test:go:publish-e2e
        env:
          AILERON_TEST_REGISTRY: localhost:5000

      - name: Upload e2e coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ALRubinger/aileron
          files: internal/coverage-publish-e2e.txt
          flags: integration

      - name: Registry logs on failure
        if: failure()
        run: docker logs registry || true

  integration-multiarch:
    name: Integration Tests (Multi-Arch)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # A docker-container buildx builder is required for a REAL multi-platform
      # build (`docker buildx build --platform linux/amd64,linux/arm64`); the
      # default docker driver cannot emit a manifest list. This provisions and
      # selects that builder.
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      # Register the QEMU emulators so the non-native arch (arm64 on an amd64
      # runner) actually builds under emulation. Without this the arm64 leg of
      # the multi-arch build fails with an exec-format error.
      - name: Register QEMU/binfmt emulators
        run: docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Start a local OCI registry
        run: |
          docker run -d -p 5000:5000 --restart=always --name registry registry:2
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/v2/; then echo "registry up"; exit 0; fi
            sleep 1
          done
          echo "registry did not come up"; exit 1

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: internal/go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # The composer routes environment tools through Aileron's Builder, which
      # invokes `npx --yes @devcontainers/cli@<pinned>`. Pin to the same version
      # the Go source pins (container.DevcontainerCLIVersion) for parity with the
      # other Feature jobs.
      - name: Install @devcontainers/cli
        run: npm install -g @devcontainers/cli@0.87.0

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      # The multi-arch Flight Plan freeze -> publish -> launch e2e (#2038): a real
      # buildx+QEMU linux/amd64+linux/arm64 freeze, a real manifest-list push to
      # the local registry, and a real host-arch pull+verify. This runs HOST-NATIVE
      # (amd64), NOT under QEMU: the freeze shells out to native amd64 host tooling
      # (@devcontainers/cli via node, docker, buildx), which an arm64-emulated
      # process cannot exec (missing arm64 ELF interpreter). The buildx builder +
      # binfmt/QEMU registered above are still required — they emulate the arm64 leg
      # of the multi-arch BUILD — but the test process stays native so it can drive
      # that build. The test asserts the composed pin carries BOTH linux/amd64 and
      # linux/arm64 config digests (the multi-arch BUILD proof), that the manifest
      # list publishes both children, and that the host consumer selects+verifies
      # its own (amd64) child plus fails closed on a tampered config.
      #
      # The genuinely-FOREIGN consumer selection (an arm64 host picking the arm64
      # child, failing closed on an unbuilt arch) is covered deterministically by
      # the freeze/ociremote hostGOARCH seam unit tests, which drive any arch
      # without emulation. A full foreign-arch consumer BOOT needs real arm64
      # hardware and is a documented limitation, not a silent skip.
      #
      # KNOWN GAP (documented, not a silent skip): the pre-existing host-arch boot
      # guard TestFlightPlanComposedToolsBootGuard shares this build tag but is NOT
      # run here. It boots a real container that expects a live host daemon
      # (AILERON_API_URL/AILERON_TOKEN); provisioning that daemon + a minted token
      # + in-container networking is a separate lift with no established CI
      # pattern. It stays runnable via `task test:integration:multiarch` where a
      # daemon is available; wiring it into CI is a follow-up.
      - name: Run multi-arch e2e (host-native, #2038)
        working-directory: cmd/aileron
        env:
          AILERON_TEST_REGISTRY: localhost:5000
          AILERON_SANDBOX_BASE_CONTEXT: ${{ github.workspace }}/images/sandbox-base
          AILERON_SANDBOX_FEATURES_CONTEXT: ${{ github.workspace }}/images/sandbox-features
        run: gotestsum --junitfile junit-multiarch.xml -- -tags=integration_sandbox_multiarch -run 'TestFlightPlanCrossArchMultiArchE2E' .

      # Anti-silent-skip guard (mirrors test-ui/test-webapp): a green result must
      # mean the emulated test actually ran. A missing report or zero executed
      # <testcase> elements fails the job rather than passing on a silent skip.
      - name: Assert multi-arch e2e executed (anti-silent-skip)
        working-directory: cmd/aileron
        run: |
          report="junit-multiarch.xml"
          if [ ! -f "$report" ]; then
            echo "::error::gotestsum JUnit report $report not found; the multi-arch e2e did not produce results" >&2
            exit 1
          fi
          cases="$(grep -o '<testcase' "$report" | wc -l | tr -d ' ')"
          skipped="$(grep -o '<skipped' "$report" | wc -l | tr -d ' ')"
          echo "multi-arch e2e executed $cases test(s), $skipped skipped"
          # The e2e uses t.Fatalf (never t.Skip), so a skipped testcase is itself a
          # regression: a run that skipped every case must not pass as "green".
          if [ "$cases" -eq 0 ] || [ "$cases" -eq "$skipped" ]; then
            echo "::error::multi-arch e2e ran 0 non-skipped tests; refusing to pass on a silent skip" >&2
            exit 1
          fi

      - name: Registry logs on failure
        if: failure()
        run: docker logs registry || true

  integration-sandbox-features:
    name: Integration Tests (Sandbox Features)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: |
            internal/go.mod
            test/integration/go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # The repo source never calls npm directly; installing the
      # @devcontainers/cli here in the CI shell is the toolchain the fail-fast
      # Feature build tests drive: #1082's direct-CLI test execs `devcontainer`,
      # and #1083's composition test routes through Aileron's Builder, which
      # invokes `npx --yes @devcontainers/cli@<pinned>`. Pin to the same version
      # the Go source pins (container.DevcontainerCLIVersion) so both paths use
      # one reproducible CLI. The tests FAIL (no self-skip) if the CLI, Node,
      # Docker, or the base image is absent.
      - name: Install @devcontainers/cli
        run: npm install -g @devcontainers/cli@0.87.0

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Builds the aileron-sandbox-base image from images/sandbox-base (the
      # test's Builder uses the AILERON_SANDBOX_BASE_CONTEXT the task target
      # sets), then: (#1082) composes each agent Feature directly with
      # @devcontainers/cli and asserts `command -v claude` / `command -v codex`,
      # and (#1083) composes the Codex Feature plus a second Feature through
      # Aileron's composition.Discover -> Builder.Build path and asserts both
      # tools resolve on PATH; and (#1857) composes the aws-cli + gh Features
      # and asserts the composed image's devcontainer.metadata label parses into
      # both credential conventions (sigv4-resign + bearer) via the production
      # read path. The ubuntu runner has Docker; this is the fail-fast
      # acceptance environment.
      - name: Build sandbox Features and verify CLIs on PATH (#1082, #1083, #1857)
        run: task test:integration:sandbox-features

  integration-sandbox-managed:
    # The #1530 acceptance gate: a real `devcontainer build` driven through the
    # Aileron-MANAGED toolchain (the Builder is wired with the real provisioner,
    # so Node + @devcontainers/cli are fetched + verified + cached by Aileron, not
    # taken from the host's npx). Docker is the host build prerequisite and the
    # managed Node fetch needs network/registry access (https://nodejs.org). Host
    # Node/npx is NOT required by the toolchain under test; setup-node is here only
    # so the Go module cache and Task install behave like the other jobs.
    name: Integration Tests (Sandbox Managed)
    # Linux (ubuntu-latest) is the only leg run: it is the fail-fast acceptance
    # environment with first-class Docker.
    #
    # KNOWN GAP — macOS/Windows managed-build verification is NOT run in CI:
    # GitHub-hosted macOS runners ship no Docker engine and Windows runners
    # default to Windows containers, so a real Linux-base `devcontainer build`
    # cannot pass there. They were previously run as `continue-on-error`
    # (non-blocking) legs, but a guaranteed-fail job is pure noise: perpetual red
    # checks, wasted CI minutes on doomed builds, and a false-stall trigger for
    # the autonomous merge gate (it counts non-required legs as blocking — see
    # ALRubinger/craftwork-skills#65). So we do not run what cannot pass. macOS/
    # Windows users are covered by the host-`npx` escape hatch documented in
    # docs/.../sandbox-agent-images.md; managed-build verification on those
    # platforms is pending Docker-capable (self-hosted) runners, at which point
    # they can be re-added to this matrix. This is a documented gap, not a silent
    # skip.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            required: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: |
            internal/go.mod
            test/integration/go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Pin the CLI to the version the Go source pins
      # (container.DevcontainerCLIVersion) for parity with the host-npx Features
      # job, even though the managed toolchain provisions its own pinned CLI: a
      # mismatch here would be a confusing signal. The managed build under test
      # does not consult this global install.
      - name: Install @devcontainers/cli
        run: npm install -g @devcontainers/cli@0.87.0

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Builds the aileron-sandbox-base image from images/sandbox-base (the task
      # target sets AILERON_SANDBOX_BASE_CONTEXT), then composes the Claude
      # Feature through Aileron's composition.Discover -> Builder.Build path with
      # the managed provisioner wired and asserts `command -v claude`. The Linux
      # runner has Docker and network access for the managed Node fetch; this is
      # the fail-fast acceptance environment. The test FAILS (no self-skip) if
      # Docker, the base image, or the managed Node/CLI is unavailable.
      - name: Build sandbox Feature via managed toolchain and verify CLI on PATH (#1530)
        run: task test:integration:sandbox-managed

  integration-e2e:
    name: Integration Tests (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Start full stack
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait
        timeout-minutes: 5
        env:
          AILERON_DATABASE_URL: postgres://aileron:aileron@postgres:5432/aileron?sslmode=disable
          AILERON_JWT_SIGNING_KEY: ci-test-signing-key-not-for-production
          AILERON_AUTO_VERIFY_EMAIL: "true"
          AILERON_SYSTEM_VAULT_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

      - name: Wait for healthy server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/v1/health; then
              echo ""
              echo "Server healthy"
              exit 0
            fi
            sleep 3
          done
          echo "Server did not become healthy"
          docker compose -f deploy/docker-compose.yml logs
          exit 1

      - name: Wait for healthy UI
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000; then
              echo "UI healthy"
              exit 0
            fi
            sleep 2
          done
          echo "UI did not become healthy"
          exit 1

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-ui-${{ hashFiles('ui/pnpm-lock.yaml') }}

      - name: Install Playwright dependencies
        working-directory: ui
        # #1218: bound the apt acquire path so a stalled or unreachable apt
        # mirror fails fast instead of hanging unbounded. The apt config is the
        # real fail-fast lever: `Acquire::http::Timeout` aborts any single
        # connection that stalls for 30s, and `Acquire::Retries` retries it a
        # few times before giving up. A stalled/unreachable mirror can no
        # longer hang the install indefinitely; apt itself bounds every
        # acquire. The retry loop wraps the whole install (apt-get internal to
        # `--with-deps` *and* the browser download) for transient failures;
        # before each retry it heals any half-applied dpkg state with
        # `dpkg --configure -a` + `apt-get -f install` so a retry can succeed
        # rather than dying on a stale dpkg lock. `timeout --kill-after` is a
        # belt-and-suspenders ceiling that escalates SIGTERM->SIGKILL.
        run: |
          pnpm install --frozen-lockfile
          sudo tee /etc/apt/apt.conf.d/99aileron-ci-timeouts >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          for attempt in 1 2 3; do
            if timeout --kill-after=30 900 pnpm exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Playwright install attempt ${attempt} failed; healing dpkg state and retrying" >&2
            # `timeout` only signals the direct child; an apt-get spawned by
            # `--with-deps` can be orphaned and keep holding the dpkg lock.
            # Reap any lingering apt/dpkg, then repair half-applied state so
            # the next attempt does not die on a stale lock.
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock || true
            sudo dpkg --configure -a || true
            sudo apt-get -f install -y || true
            sleep $((attempt * 15))
          done
          echo "Playwright install failed after 3 attempts" >&2
          exit 1

      - name: Run Playwright integration E2E tests
        working-directory: ui
        run: pnpm test:e2e:integration
        env:
          AILERON_API_URL: http://localhost:8080
          AILERON_UI_BASE_URL: http://localhost:3000

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ui/test-results/junit-playwright-integration.xml

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
