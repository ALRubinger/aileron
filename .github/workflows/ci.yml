name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Verify Generated Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: |
            core/go.mod
            enclave/go.mod
            cmd/aileron-enclave/go.mod
            cmd/aileron-mcp/go.mod
            sdk/go/go.mod
            test/integration/go.mod

      - name: Run code generation
        working-directory: core
        run: go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen --config api/oapi-codegen.yaml api/openapi.yaml

      - name: Verify no diff
        run: git diff --exit-code core/api/gen/

  lint:
    name: Lint
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: |
            core/go.mod
            sdk/go/go.mod
            test/integration/go.mod

      - uses: pnpm/action-setup@v5
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Go vet
        run: go vet ./core/... ./enclave/... ./cmd/aileron-enclave/... ./cmd/aileron-mcp/... ./sdk/go/...

      - name: Svelte check
        working-directory: ui
        run: pnpm check

  test:
    name: Unit Tests
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: |
            core/go.mod
            sdk/go/go.mod
            test/integration/go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run Go tests
        run: gotestsum --junitfile junit.xml -- -race -coverprofile=coverage.txt ./core/... ./enclave/... ./cmd/aileron-enclave/... ./cmd/aileron-mcp/... ./sdk/go/...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ALRubinger/aileron
          flags: unit

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test-ui:
    name: UI Tests
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Run unit and component tests
        working-directory: ui
        run: pnpm test

      - name: Build for E2E
        working-directory: ui
        run: pnpm build

      - name: Install Playwright browsers
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ui
        run: pnpm test:e2e

      - name: Prefix lcov paths with ui/
        if: ${{ !cancelled() }}
        working-directory: ui
        run: sed -i 's|^SF:|SF:ui/|' coverage/lcov.info

      - name: Upload UI coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ALRubinger/aileron
          files: ui/coverage/lcov.info
          flags: ui

      - name: Upload UI test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ui/test-results/junit-vitest.xml,ui/test-results/junit-playwright.xml

  build:
    name: Build Docker Images
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: core/server/Dockerfile
          push: false
          load: true
          tags: aileron-server:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build UI image
        uses: docker/build-push-action@v7
        with:
          context: ./ui
          file: ui/Dockerfile
          push: false
          load: true
          tags: aileron-ui:${{ github.sha }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

      - name: Build docs image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docs/Dockerfile
          push: false
          load: true
          tags: aileron-docs:${{ github.sha }}
          cache-from: type=gha,scope=docs
          cache-to: type=gha,mode=max,scope=docs

  integration:
    name: Integration Tests
    needs: [build, lint, test, test-ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create coverage directory for server-side coverage collection
        run: mkdir -p gocoverdir && chmod 777 gocoverdir

      - name: Start full stack with coverage-instrumented server
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.coverage.yml up -d --build --wait
        timeout-minutes: 5
        env:
          AILERON_DATABASE_URL: postgres://aileron:aileron@postgres:5432/aileron?sslmode=disable
          AILERON_JWT_SIGNING_KEY: ci-test-signing-key-not-for-production
          AILERON_AUTO_VERIFY_EMAIL: "true"
          AILERON_SYSTEM_VAULT_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

      - name: Wait for healthy server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/v1/health; then
              echo ""
              echo "Server healthy"
              exit 0
            fi
            sleep 3
          done
          echo "Server did not become healthy"
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.coverage.yml logs
          exit 1

      - name: Wait for healthy UI
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000; then
              echo "UI healthy"
              exit 0
            fi
            sleep 2
          done
          echo "UI did not become healthy"
          exit 1

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: |
            core/go.mod
            sdk/go/go.mod
            test/integration/go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run integration tests
        run: gotestsum --junitfile junit-integration.xml -- -tags=integration -race -coverprofile=coverage-store.txt -coverpkg=./core/store/postgres/... ./test/integration/... ./core/store/postgres/...
        env:
          AILERON_API_URL: http://localhost:8080
          AILERON_UI_URL: http://localhost:3000

      - name: Stop server to flush coverage data
        if: ${{ !cancelled() }}
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.coverage.yml stop server

      - name: Convert server coverage to text format
        if: ${{ !cancelled() }}
        run: go tool covdata textfmt -i=gocoverdir -o=coverage-integration.txt

      - name: Upload integration coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ALRubinger/aileron
          files: coverage-integration.txt,coverage-store.txt
          flags: integration

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit-integration.xml

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.coverage.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.coverage.yml down -v
