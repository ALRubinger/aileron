version: 2

builds:
  - id: aileron-server
    binary: aileron-server
    main: ./internal/server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/ALRubinger/aileron/internal/version.Version={{.Version}}
      - -X github.com/ALRubinger/aileron/internal/version.Commit={{.Commit}}

  - id: aileron-mcp
    binary: aileron-mcp
    main: ./cmd/aileron-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/ALRubinger/aileron/internal/version.Version={{.Version}}
      - -X github.com/ALRubinger/aileron/internal/version.Commit={{.Commit}}

  - id: aileron
    binary: aileron
    main: ./cmd/aileron
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/ALRubinger/aileron/internal/version.Version={{.Version}}
      - -X github.com/ALRubinger/aileron/internal/version.Commit={{.Commit}}

  - id: aileron-sh
    binary: aileron-sh
    main: ./cmd/aileron-sh
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  # One bundled archive per platform contains all four binaries
  # (aileron, aileron-server, aileron-mcp, aileron-sh) versioned
  # together. Matches the Linux nfpm package shape and the Homebrew
  # formula install. Windows archives omit aileron-sh (POSIX-only).
  - id: aileron
    ids:
      - aileron
      - aileron-server
      - aileron-mcp
      - aileron-sh
    # Windows archives omit aileron-sh (POSIX-only) — fewer binaries
    # than linux/darwin. Goreleaser flags this as a confusion risk by
    # default; explicit acknowledgement here.
    allow_different_binary_count: true
    name_template: "aileron_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  # Homebrew cask auto-published to the homebrew-aileron tap on each
  # release. After release, users install with:
  #   brew tap ALRubinger/aileron
  #   brew install aileron
  #
  # Uses goreleaser's homebrew_casks (the brews field is deprecated as
  # of v2; casks are the modern path for pre-compiled binaries).
  #
  # The tap is a separate GitHub repo (homebrew-aileron); goreleaser
  # commits the cask there using HOMEBREW_TAP_GITHUB_TOKEN — a PAT
  # with contents:write scope on the tap repo, set as a secret in this
  # repo. Default GITHUB_TOKEN can't write across repos.
  - name: aileron
    ids:
      - aileron # the bundled archive id above (all four binaries)
    repository:
      owner: ALRubinger
      name: homebrew-aileron
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://withaileron.ai
    description: Local LLM gateway for AI agents to take consequential action without holding credentials
    license: Apache-2.0
    # All four binaries from the bundled archive land on PATH.
    binaries:
      - aileron
      - aileron-server
      - aileron-mcp
      - aileron-sh
    # macOS Gatekeeper blocks first-run of unsigned/non-notarized
    # binaries with "Apple could not verify ... is free of malware."
    # Until we set up Apple Developer ID notarization (needs $99/yr
    # enrollment + macOS runner + notarytool), strip the quarantine
    # xattr at install time. The user already trusted the cask by
    # `brew install`-ing it; getting hit by Gatekeeper after that is
    # bad UX and the cosign signature is the real trust signal.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", staged_path]
          end

nfpms:
  # Linux distro packages: .deb (Debian/Ubuntu), .rpm (RHEL/Fedora),
  # .apk (Alpine). One bundled "aileron" package per format/arch
  # contains the CLI, daemon, MCP server, and POSIX shell shim — all
  # four binaries are versioned together.
  #
  # Install paths follow each distro's bin convention (/usr/bin). After
  # install, `aileron version` works without further setup.
  - id: aileron
    package_name: aileron
    ids:
      - aileron
      - aileron-server
      - aileron-mcp
      - aileron-sh
    formats:
      - deb
      - rpm
      - apk
    vendor: Aileron
    homepage: https://withaileron.ai
    maintainer: Andrew Lee Rubinger <alr@alrubinger.com>
    description: |-
      Local LLM gateway giving AI agents the ability to take consequential
      action on a user's behalf without ever holding their credentials in
      the agent's process. Ships the CLI (aileron), daemon (aileron-server),
      MCP server (aileron-mcp), and POSIX shell shim (aileron-sh).
    license: Apache-2.0
    bindir: /usr/bin

signs:
  # Cosign keyless signing via GitHub Actions OIDC. Each artifact (archives,
  # checksums.txt, source) is signed; the bundle file pairs the signature with
  # the Fulcio cert + Rekor log entry, so users verify with one command.
  #
  # Verify (replace ${ARTIFACT} with e.g. aileron_0.0.1_darwin_arm64.tar.gz):
  #   cosign verify-blob \
  #     --bundle ${ARTIFACT}.sigstore.json \
  #     --certificate-identity-regexp 'https://github.com/ALRubinger/aileron/.github/workflows/release.yml@.*' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
  #     ${ARTIFACT}
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: all
    output: true

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Other
      order: 999

release:
  github:
    owner: ALRubinger
    name: aileron
  prerelease: auto
  name_template: "v{{.Version}}"
