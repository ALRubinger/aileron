version: 2

builds:
  - id: aileron-server
    binary: aileron-server
    main: ./internal/server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/ALRubinger/aileron/internal/version.Version={{.Version}}
      - -X github.com/ALRubinger/aileron/internal/version.Commit={{.Commit}}

  - id: aileron-mcp
    binary: aileron-mcp
    main: ./cmd/aileron-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/ALRubinger/aileron/internal/version.Version={{.Version}}
      - -X github.com/ALRubinger/aileron/internal/version.Commit={{.Commit}}

  - id: aileron
    binary: aileron
    main: ./cmd/aileron
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/ALRubinger/aileron/internal/version.Version={{.Version}}
      - -X github.com/ALRubinger/aileron/internal/version.Commit={{.Commit}}

archives:
  # One bundled archive per platform contains all three binaries
  # (aileron, aileron-server, aileron-mcp) versioned together. Matches
  # the Linux nfpm package shape and the Homebrew formula install.
  - id: aileron
    ids:
      - aileron
      - aileron-server
      - aileron-mcp
    name_template: "aileron_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  # Homebrew cask auto-published to the homebrew-aileron tap on each
  # release. After release, users install with:
  #   brew tap ALRubinger/aileron
  #   brew install aileron
  #
  # Uses goreleaser's homebrew_casks (the brews field is deprecated as
  # of v2; casks are the modern path for pre-compiled binaries).
  #
  # The tap is a separate GitHub repo (homebrew-aileron); goreleaser
  # commits the cask there using HOMEBREW_TAP_GITHUB_TOKEN — a PAT
  # with contents:write scope on the tap repo, set as a secret in this
  # repo. Default GITHUB_TOKEN can't write across repos.
  - name: aileron
    # Prerelease tags (a hyphen in the version, e.g. v0.0.5-cr-1) exist to
    # smoke-test the publish pipeline; they must not move the stable tap. `auto`
    # skips the tap commit whenever release.prerelease resolves true.
    skip_upload: "auto"
    ids:
      - aileron # the bundled archive id above (all four binaries)
    repository:
      owner: ALRubinger
      name: homebrew-aileron
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://withaileron.ai
    description: Local LLM gateway for AI agents to take consequential action without holding credentials
    license: Apache-2.0
    # All three binaries from the bundled archive land on PATH.
    binaries:
      - aileron
      - aileron-server
      - aileron-mcp
    # macOS Gatekeeper blocks first-run of unsigned/non-notarized
    # binaries with "Apple could not verify ... is free of malware."
    # Until we set up Apple Developer ID notarization (needs $99/yr
    # enrollment + macOS runner + notarytool), strip the quarantine
    # xattr at install time. The user already trusted the cask by
    # `brew install`-ing it; getting hit by Gatekeeper after that is
    # bad UX and the cosign signature is the real trust signal.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", staged_path]
          end

scoops:
  # Scoop manifest auto-published to the scoop-aileron bucket on each
  # release, giving Windows users a one-line install. After release:
  #   scoop bucket add aileron https://github.com/ALRubinger/scoop-aileron
  #   scoop install aileron
  #
  # The bucket is a separate GitHub repo (scoop-aileron); goreleaser
  # commits the manifest (aileron.json) there using
  # SCOOP_BUCKET_GITHUB_TOKEN — a PAT with contents:write scope on the
  # bucket repo, set as a secret in this repo. Default GITHUB_TOKEN
  # can't write across repos.
  #
  # The manifest references the bundled "aileron" archive id (the
  # windows zip), so all three binaries (aileron, aileron-server,
  # aileron-mcp) land on PATH. amd64-only falls out of the build matrix:
  # windows/arm64 is ignored, so the only windows archive is the amd64
  # zip and the manifest's architecture map carries just the 64bit entry.
  - name: aileron
    # Prerelease tags (a hyphen in the version, e.g. v0.0.5-cr-1) exist to
    # smoke-test the publish pipeline; they must not move the stable bucket.
    # `auto` skips the manifest commit whenever release.prerelease resolves true.
    skip_upload: "auto"
    ids:
      - aileron # the bundled archive id above (all three binaries)
    repository:
      owner: ALRubinger
      name: scoop-aileron
      branch: main
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    homepage: https://withaileron.ai
    description: Local LLM gateway for AI agents to take consequential action without holding credentials
    license: Apache-2.0

nfpms:
  # Linux distro packages: .deb (Debian/Ubuntu), .rpm (RHEL/Fedora),
  # .apk (Alpine). One bundled "aileron" package per format/arch
  # contains the CLI, daemon, and MCP server — all three binaries are
  # versioned together.
  #
  # Install paths follow each distro's bin convention (/usr/bin). After
  # install, `aileron version` works without further setup.
  - id: aileron
    package_name: aileron
    ids:
      - aileron
      - aileron-server
      - aileron-mcp
    formats:
      - deb
      - rpm
      - apk
    vendor: Aileron
    homepage: https://withaileron.ai
    maintainer: Andrew Lee Rubinger <alr@alrubinger.com>
    description: |-
      Local LLM gateway giving AI agents the ability to take consequential
      action on a user's behalf without ever holding their credentials in
      the agent's process. Ships the CLI (aileron), daemon (aileron-server),
      and MCP server (aileron-mcp).
    license: Apache-2.0
    bindir: /usr/bin

signs:
  # Cosign keyless signing via GitHub Actions OIDC. Each artifact (archives,
  # checksums.txt, source) is signed; the bundle file pairs the signature with
  # the Fulcio cert + Rekor log entry, so users verify with one command.
  #
  # Verify (replace ${ARTIFACT} with e.g. aileron_0.0.1_darwin_arm64.tar.gz):
  #   cosign verify-blob \
  #     --bundle ${ARTIFACT}.sigstore.json \
  #     --certificate-identity-regexp 'https://github.com/ALRubinger/aileron/.github/workflows/release.yml@.*' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
  #     ${ARTIFACT}
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: all
    output: true

changelog:
  sort: asc
  # Scope-class `[^)]+` is broader than the previous `[[:word:]]+`
  # (which excluded hyphens and so dropped scopes like
  # `feat(connector-install):` into Other). Conventional Commits is
  # permissive about scope characters; the regex should be too.
  #
  # Order is load-bearing: the first matching group wins. Breaking
  # Changes is at the top so `feat!:` / `fix!:` land there rather than
  # in Features / Bug Fixes, which use overlapping regex.
  groups:
    - title: 'Breaking Changes ⚠️'
      regexp: '^.*?(feat|fix)(\([^)]+\))??!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\([^)]+\))??!?:.+$'
      order: 1
    - title: Bug Fixes
      regexp: '^.*?fix(\([^)]+\))??!?:.+$'
      order: 2
    - title: Performance
      regexp: '^.*?perf(\([^)]+\))??!?:.+$'
      order: 3
    - title: Documentation
      regexp: '^.*?docs(\([^)]+\))??!?:.+$'
      order: 4
    - title: Other
      order: 999
  filters:
    # Hide commit types that contribute no signal to a user-facing
    # changelog. Conventional Commits keeps these in git history; the
    # release notes call out what the user gets, not how the sausage
    # got made. `fix(deps)` / `chore(deps)` / `build(deps)` are
    # Renovate-style bumps; they'd otherwise dominate Bug Fixes and
    # Other.
    exclude:
      - '^.*?chore(\([^)]+\))??!?:.+$'
      - '^.*?style(\([^)]+\))??!?:.+$'
      - '^.*?test(\([^)]+\))??!?:.+$'
      - '^.*?refactor(\([^)]+\))??!?:.+$'
      - '^.*?build(\([^)]+\))??!?:.+$'
      - '^.*?ci(\([^)]+\))??!?:.+$'
      - '^.*?revert(\([^)]+\))??!?:.+$'
      - '^.*?(fix|chore|build)\(deps\)!?:.+$'

release:
  github:
    owner: ALRubinger
    name: aileron
  prerelease: auto
  name_template: "v{{.Version}}"
