version: 2

builds:
  - id: aileron-server
    binary: aileron-server
    main: ./internal/server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/ALRubinger/aileron/internal/version.Version={{.Version}}
      - -X github.com/ALRubinger/aileron/internal/version.Commit={{.Commit}}

  - id: aileron-mcp
    binary: aileron-mcp
    main: ./cmd/aileron-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/ALRubinger/aileron/internal/version.Version={{.Version}}
      - -X github.com/ALRubinger/aileron/internal/version.Commit={{.Commit}}

  - id: aileron
    binary: aileron
    main: ./cmd/aileron
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/ALRubinger/aileron/internal/version.Version={{.Version}}
      - -X github.com/ALRubinger/aileron/internal/version.Commit={{.Commit}}

  - id: aileron-sh
    binary: aileron-sh
    main: ./cmd/aileron-sh
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: aileron
    ids:
      - aileron
    name_template: "aileron_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: aileron-sh
    ids:
      - aileron-sh
    name_template: "aileron-sh_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  - id: aileron-server
    ids:
      - aileron-server
    name_template: "aileron-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: aileron-mcp
    ids:
      - aileron-mcp
    name_template: "aileron-mcp_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

nfpms:
  # Linux distro packages: .deb (Debian/Ubuntu), .rpm (RHEL/Fedora),
  # .apk (Alpine). One bundled "aileron" package per format/arch
  # contains the CLI, daemon, MCP server, and POSIX shell shim — all
  # four binaries are versioned together.
  #
  # Install paths follow each distro's bin convention (/usr/bin). After
  # install, `aileron version` works without further setup.
  - id: aileron
    package_name: aileron
    ids:
      - aileron
      - aileron-server
      - aileron-mcp
      - aileron-sh
    formats:
      - deb
      - rpm
      - apk
    vendor: Aileron
    homepage: https://withaileron.ai
    maintainer: Andrew Lee Rubinger <alr@alrubinger.com>
    description: |-
      Local LLM gateway giving AI agents the ability to take consequential
      action on a user's behalf without ever holding their credentials in
      the agent's process. Ships the CLI (aileron), daemon (aileron-server),
      MCP server (aileron-mcp), and POSIX shell shim (aileron-sh).
    license: Apache-2.0
    bindir: /usr/bin

signs:
  # Cosign keyless signing via GitHub Actions OIDC. Each artifact (archives,
  # checksums.txt, source) is signed; the bundle file pairs the signature with
  # the Fulcio cert + Rekor log entry, so users verify with one command.
  #
  # Verify (replace ${ARTIFACT} with e.g. aileron_0.0.1_darwin_arm64.tar.gz):
  #   cosign verify-blob \
  #     --bundle ${ARTIFACT}.sigstore.json \
  #     --certificate-identity-regexp 'https://github.com/ALRubinger/aileron/.github/workflows/release.yml@.*' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
  #     ${ARTIFACT}
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: all
    output: true

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Other
      order: 999

release:
  github:
    owner: ALRubinger
    name: aileron
  prerelease: auto
  name_template: "v{{.Version}}"
