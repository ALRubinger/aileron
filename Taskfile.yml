version: "3"

vars:
  COMPOSE_FILE: deploy/docker-compose.yml
  # Single source of truth for Go test/vet package set, shared by local
  # (test:go, vet:go) and CI (test:go:ci) targets.
  GO_TEST_PACKAGES: ./internal/... ./cmd/aileron/... ./cmd/aileron-mcp/... ./sdk/go/...

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: One-time local setup after clone (activates committed git hooks)
    cmds:
      # Point git at the committed hooks so they survive re-clone and are shared
      # across all worktrees. The pre-commit hook refuses commits in the primary
      # checkout, keeping the default branch a pure fast-forward mirror of origin.
      - git config core.hooksPath .githooks
      - 'echo "git hooks activated (core.hooksPath=.githooks)"'

  generate:
    desc: Run all code generators
    cmds:
      - task: generate:api
      - task: generate:tokens

  generate:api:
    desc: Generate Go types and server interface from OpenAPI spec
    dir: internal
    cmds:
      - go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen --config api/oapi-codegen.yaml api/openapi.yaml
    sources:
      - api/openapi.yaml
      - api/oapi-codegen.yaml
    generates:
      - api/gen/server.gen.go

  generate:tokens:
    desc: Generate design token CSS for docs and webapp
    cmds:
      - node design/build/generate-tokens.mjs
    sources:
      - design/tokens.json
      - design/build/generate-tokens.mjs
    generates:
      - design/build/output/tokens.generated.css
      - docs/src/styles/tokens.generated.css
      - webapp/src/tokens.generated.css

  generate:agent-digests:
    desc: >-
      Regenerate the sandbox image digest lockfile at release prep. Resolves each
      published per-agent image's immutable digest from the registry and writes
      internal/sandbox/composition/agent-images.lock.json so a release pins a
      fixed image by @sha256 instead of the floating `latest` tag (#1233). Run
      AFTER the release's images are published, BEFORE tagging the binary.
      Requires docker buildx + registry read access. Override the resolved tag
      with TAG=<tag> (default: latest).
    dir: internal
    vars:
      TAG: '{{.TAG | default "latest"}}'
    cmds:
      - go run ./tools/agentdigests -tag {{.TAG}} -out sandbox/composition/agent-images.lock.json

  generate:tools-lock:
    desc: >-
      Regenerate the managed-toolchain lockfile that pins Node.js for reproducible
      sandbox devcontainer builds (#1525). Resolves the per-platform sha256 of
      each supported Node distribution archive from Node's published
      SHASUMS256.txt and writes internal/sandbox/container/tools.lock.json so a
      build verifies a fetched archive against the pin and rejects a tampered or
      drifted distribution. Run when bumping the pinned Node version. Pass the
      version with VERSION=<x.y.z> (default: the version already in the lock).
      Requires network read access to nodejs.org.
    dir: internal
    vars:
      VERSION: '{{.VERSION | default "22.14.0"}}'
    cmds:
      - go run ./tools/toolslock -version {{.VERSION}} -out sandbox/container/tools.lock.json

  build:
    desc: Build everything (containers, server, MCP, CLI, webapp, docs)
    cmds:
      - task: build:docker
      - task: build:webapp
      - task: build:server
      - task: build:mcp
      - task: build:cli
      - task: build:docs

  build:docker:
    desc: Build all Docker containers
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} build

  build:server:
    desc: Build the Go server binary locally (embeds webapp/build via internal/app/webapp_dist)
    deps:
      - build:webapp
    vars:
      VERSION: dev
      COMMIT:
        sh: git rev-parse --short HEAD
    cmds:
      - go build -ldflags "-X github.com/ALRubinger/aileron/internal/version.Version={{.VERSION}} -X github.com/ALRubinger/aileron/internal/version.Commit={{.COMMIT}}" -o build/aileron-server ./internal/server

  build:mcp:
    desc: Build the Aileron MCP server binary locally (plus a Linux variant on macOS/Windows hosts so `aileron launch --sandbox=docker` can bind-mount it into the container)
    vars:
      VERSION: dev
      COMMIT:
        sh: git rev-parse --short HEAD
      HOST_GOOS:
        sh: go env GOOS
      HOST_GOARCH:
        sh: go env GOARCH
    cmds:
      - go build -ldflags "-X github.com/ALRubinger/aileron/internal/version.Version={{.VERSION}} -X github.com/ALRubinger/aileron/internal/version.Commit={{.COMMIT}}" -o build/aileron-mcp ./cmd/aileron-mcp
      # Sandbox launch bind-mounts aileron-mcp into a Linux container. On
      # non-Linux hosts the host-arch Mach-O / PE binary above fails with
      # exec format error; this second build produces a sibling the
      # launcher's resolveSandboxMCPBinary prefers for the sandbox path.
      - |
        if [ "{{.HOST_GOOS}}" != "linux" ]; then
          GOOS=linux GOARCH={{.HOST_GOARCH}} go build -ldflags "-X github.com/ALRubinger/aileron/internal/version.Version={{.VERSION}} -X github.com/ALRubinger/aileron/internal/version.Commit={{.COMMIT}}" -o build/aileron-mcp-linux-{{.HOST_GOARCH}} ./cmd/aileron-mcp
        fi

  build:cli:
    desc: Build the aileron CLI binary locally
    vars:
      VERSION: dev
      COMMIT:
        sh: git rev-parse --short HEAD
    cmds:
      - go build -ldflags "-X github.com/ALRubinger/aileron/internal/version.Version={{.VERSION}} -X github.com/ALRubinger/aileron/internal/version.Commit={{.COMMIT}}" -o build/aileron ./cmd/aileron

  build:webapp:
    desc: Install webapp dependencies, build static output, copy into internal/app/webapp_dist for Go embed
    deps: [generate:tokens]
    dir: webapp
    cmds:
      - pnpm install
      - pnpm run build
      # Replace the embed dir with the fresh build output. Everything
      # under webapp_dist/ is gitignored except `.gitkeep`, which we
      # restore after the copy so the embed pattern still matches the
      # tracked file and `git status` stays clean.
      - rm -rf ../internal/app/webapp_dist
      - cp -r build ../internal/app/webapp_dist
      - touch ../internal/app/webapp_dist/.gitkeep

  build:ui:
    desc: (Frozen) Install ui dependencies and build. The cloud-tier UI; not embedded into the daemon. New work belongs in webapp/.
    dir: ui
    cmds:
      - pnpm install
      - pnpm run build

  build:docs:
    desc: Install docs dependencies and build
    deps: [generate:tokens]
    dir: docs
    cmds:
      - pnpm install
      - mkdir -p public
      - cp ../internal/api/openapi.yaml public/openapi.yaml
      - pnpm run build

  mcp:setup:
    desc: Build and register the Aileron MCP server with Claude Code
    cmds:
      - task: build:mcp
      - claude mcp add --scope project aileron -e AILERON_URL=http://localhost:8080 -- ./build/aileron-mcp

  up:
    desc: Start all services via Docker Compose
    cmds:
      - test -f deploy/.env || cp deploy/.env.example deploy/.env
      - docker compose -f {{.COMPOSE_FILE}} up {{.CLI_ARGS}}

  down:
    desc: Stop all services
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down {{.CLI_ARGS}}

  clean:
    desc: Stop services and remove volumes
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down -v --remove-orphans
      - rm -rf build
      - rm -rf webapp/.svelte-kit webapp/build webapp/node_modules
      - rm -rf ui/.svelte-kit ui/build ui/node_modules
      - rm -rf docs/.astro docs/dist docs/node_modules
      - rm -f docs/public/openapi.yaml
      # Reset the embed dir to just the committed `.gitkeep` so a
      # subsequent `go build` still succeeds without running
      # `task build:webapp`. The handler's `webappNotBuiltStub`
      # fallback covers the page render.
      - rm -rf internal/app/webapp_dist
      - mkdir -p internal/app/webapp_dist
      - touch internal/app/webapp_dist/.gitkeep

  logs:
    desc: Tail service logs
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs -f {{.CLI_ARGS}}

  ps:
    desc: Show running services
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} ps

  dev:webapp:
    desc: Run the local webapp dev server. Iterate without rebuilding the daemon — `aileron launch` still serves the embedded build, but the dev server at localhost:5173 hot-reloads on edits.
    deps: [generate:tokens]
    dir: webapp
    cmds:
      - pnpm dev

  dev:ui:
    desc: (Frozen) Run the cloud-tier UI dev server. The local webapp lives in webapp/; use `dev:webapp` instead unless you're working on the (currently dormant) cloud-hosted UI.
    dir: ui
    cmds:
      - pnpm dev

  dev:docs:
    desc: Run the docs dev server locally
    deps: [generate:tokens]
    dir: docs
    cmds:
      - mkdir -p public
      - cp ../internal/api/openapi.yaml public/openapi.yaml
      - pnpm dev

  lint:
    desc: Run linters
    cmds:
      - task: lint:go
      - task: lint:webapp
      - task: lint:ui
      - task: lint:docs

  lint:go:
    desc: Vet Go code
    cmds:
      - go vet ./internal/... ./cmd/aileron/... ./cmd/aileron-mcp/...

  lint:webapp:
    desc: Check the local webapp for type errors
    dir: webapp
    cmds:
      - pnpm check

  lint:ui:
    desc: (Frozen) Check the cloud-tier UI for type errors. Local webapp is `lint:webapp`.
    dir: ui
    cmds:
      - pnpm check

  lint:docs:
    desc: Check the docs site for type errors
    dir: docs
    cmds:
      - pnpm check

  test:
    desc: Run all tests
    cmds:
      - task: test:go
      - task: test:webapp
      - task: test:ui
      - task: test:docs

  test:webapp:
    desc: Run local webapp unit tests (Vitest)
    dir: webapp
    cmds:
      - pnpm install
      - pnpm test

  test:webapp:e2e:
    desc: Run mocked-API Playwright E2E tests against the local webapp
    deps:
      - build:webapp
    dir: webapp
    cmds:
      - pnpm install
      - pnpm exec playwright install --with-deps chromium
      - pnpm test:e2e

  test:webapp:e2e:integration:
    desc: Run Playwright E2E tests against a real daemon seeded with pending approvals
    deps:
      - build:server
      - build:cli
    cmds:
      - cd webapp && pnpm install
      - cd webapp && pnpm exec playwright install --with-deps chromium
      - webapp/scripts/run-integration-e2e.sh

  test:ui:
    desc: (Frozen) Run cloud-tier UI unit tests. Local webapp tests live in `test:webapp`.
    dir: ui
    cmds:
      - pnpm install
      - pnpm test

  test:docs:
    desc: Run docs unit tests (rehype plugins, etc.)
    dir: docs
    cmds:
      - pnpm install
      - pnpm test

  test:go:
    desc: Run Go tests
    cmds:
      - go test {{.GO_TEST_PACKAGES}}

  test:go:cover:
    desc: Run Go tests with coverage; print summary excluding generated and test-helper code
    cmds:
      - go test -coverprofile=coverage-raw.txt {{.GO_TEST_PACKAGES}}
      - grep -v -E '/(api/gen|sessions/sessionstest|tools)/' coverage-raw.txt > coverage.txt
      - rm coverage-raw.txt
      - go tool cover -func=coverage.txt | tail -1

  test:go:ci:
    desc: Run Go tests with race, coverage, and JUnit output (single-shot; local equivalent of the CI shards combined)
    cmds:
      - gotestsum --junitfile junit.xml -- -race -coverprofile=coverage-raw.txt {{.GO_TEST_PACKAGES}}
      # Strip generated code (oapi-codegen), test-helper packages
      # (e.g. sessions/sessionstest), and release-prep dev tooling
      # (internal/tools, which shells out to docker) from the coverage
      # profile. Test helpers' err-check branches only fire when the SUT
      # misbehaves and dev tools are not production code; measuring either
      # as production code is a category mismatch. Belt-and-suspenders
      # alongside codecov.yml's ignore directive so local `go tool cover`
      # summaries agree with Codecov reports.
      - grep -v -E '/(api/gen|sessions/sessionstest|tools)/' coverage-raw.txt > coverage.txt
      - rm coverage-raw.txt

  test:go:ci:sandbox:
    # Sandbox shard of the CI Go test suite. Paired with
    # test:go:ci:rest; together they cover the same package set as
    # test:go:ci. Split because internal/sandbox/... accounts for ~44%
    # of total Go test wall time, so isolating it gives a roughly
    # balanced 2-shard matrix.
    desc: Run CI Go tests for the internal/sandbox/... shard
    cmds:
      - gotestsum --junitfile junit.xml -- -race -coverprofile=coverage-raw.txt ./internal/sandbox/...
      - grep -v -E '/(api/gen|sessions/sessionstest|tools)/' coverage-raw.txt > coverage.txt
      - rm coverage-raw.txt

  test:go:ci:rest:
    # Non-sandbox shard. Computes the package list at runtime as
    # "everything in GO_TEST_PACKAGES minus internal/sandbox/...";
    # using `go list | grep` keeps the source-of-truth in
    # GO_TEST_PACKAGES so newly added packages flow into the right
    # shard automatically.
    desc: Run CI Go tests for everything except internal/sandbox/...
    cmds:
      - |
        set -euo pipefail
        pkgs=$(go list {{.GO_TEST_PACKAGES}} | grep -vE '/sandbox(/|$)' | tr '\n' ' ')
        gotestsum --junitfile junit.xml -- -race -coverprofile=coverage-raw.txt $pkgs
      - grep -v -E '/(api/gen|sessions/sessionstest|tools)/' coverage-raw.txt > coverage.txt
      - rm coverage-raw.txt

  vet:go:
    desc: Run go vet over all Go packages
    cmds:
      - go vet {{.GO_TEST_PACKAGES}}

  test:integration:
    desc: Run integration tests against running services
    cmds:
      - go test -tags=integration -race ./test/integration/... ./internal/store/postgres/...
    env:
      AILERON_API_URL: http://localhost:8080
      AILERON_UI_BASE_URL: http://localhost:3000

  test:integration:sandbox:
    desc: Run the sandbox MCP parity integration test (in-process daemon + aileron-mcp host subprocess; see internal/app/sandbox_mcp_test.go for the contract)
    cmds:
      - go test -tags=integration_sandbox -race -run TestSandboxMCP ./internal/app/...

  test:integration:sandbox-proxy-clients:
    desc: "Run the real-client sandbox-proxy subprocess integration tests: curl (credential injection + proxied audit) and aws (SigV4 re-sign end-to-end + seal). In-process daemon + intercepting CONNECT/TLS proxy + fake HTTPS upstream; the CLIs run as host subprocesses. Fail-fast — requires `curl` AND `aws` on PATH (no self-skip)."
    cmds:
      - go test -tags=integration_sandbox -race -run 'TestSandboxProxyCurlIntegration|TestSandboxProxyAWSSigV4Integration' ./internal/app/...

  test:integration:auth-github-route:
    desc: "Run the auth github route-drift guard (#1157): stands up the real daemon handler over a MemVault and asserts the CLI's hardcoded vault path still resolves to the spec-registered route. In-process, no external prereqs (no self-skip)."
    dir: cmd/aileron
    cmds:
      - go test -tags=integration -race -run TestRunAuthGitHub_PUTReachesRealDaemonRoute .

  test:integration:authspec-bindmount:
    desc: "Run the AuthSpec bind-mount writability integration test on a Linux Docker host (#988); self-skips on non-Linux or when no Docker runtime is on PATH"
    dir: internal
    cmds:
      - go test -tags=integration_sandbox -run TestAuthSpecBindMountWritable ./launch/...
    env:
      AILERON_SANDBOX_BASE_CONTEXT:
        sh: cd "{{.ROOT_DIR}}/images/sandbox-base" && pwd

  test:integration:workspace-uid-remap:
    desc: "Run the workspace uid-remap integration test on a Linux Docker host (#1461): proves the agent uid mismatch blocks the writability probe and that the aileron-remap-agent-uid entrypoint fixes it; self-skips on non-Linux or when no Docker runtime is on PATH"
    dir: internal
    cmds:
      - go test -v -tags=integration_sandbox -run TestWorkspaceUIDRemap ./launch/...
    env:
      AILERON_SANDBOX_BASE_CONTEXT:
        sh: cd "{{.ROOT_DIR}}/images/sandbox-base" && pwd

  test:integration:authspec-container-read:
    desc: "Run the in-container credential read + capture round-trip integration test (#1025): renders a Claude-shaped AuthSpec, launches a real container, asserts the agent reads the credential at ContainerPath and that an in-container rotation round-trips to the vault on clean exit. Fail-fast — requires Docker (no self-skip)."
    dir: internal
    cmds:
      - go test -tags=integration_sandbox -run TestAuthSpecInContainerCredentialReadCapture ./launch/...
    env:
      AILERON_SANDBOX_BASE_CONTEXT:
        sh: cd "{{.ROOT_DIR}}/images/sandbox-base" && pwd

  test:integration:sandbox-features:
    desc: "Build the per-agent sandbox Features (claude/codex) and assert each agent CLI is on PATH in the composed image: directly via @devcontainers/cli (#1082) and through Aileron's own composition.Discover -> Builder.Build path with a second Feature (#1083); fail-fast — requires Docker + Node + @devcontainers/cli (no self-skip). Excludes the managed-toolchain build (TestSandboxFeaturesManaged*), which has its own target/job."
    dir: internal
    cmds:
      - go test -tags=integration_sandbox -run 'TestSandboxFeatures$|TestSandboxFeaturesComposeViaAileron$|TestGHFeatureComposesViaAileron$' ./launch/...
    env:
      AILERON_SANDBOX_BASE_CONTEXT:
        sh: cd "{{.ROOT_DIR}}/images/sandbox-base" && pwd
      AILERON_SANDBOX_FEATURES_CONTEXT:
        sh: cd "{{.ROOT_DIR}}/images/sandbox-features" && pwd

  test:integration:sandbox-managed:
    desc: "Build a sandbox Feature (claude) through Aileron's composition.Discover -> Builder.Build path with the MANAGED toolchain wired (real provisioner: fetch + verify + cache Node and the pinned @devcontainers/cli), then assert the agent CLI is on PATH — the #1530 acceptance gate; fail-fast — requires Docker plus network/registry access for the managed Node fetch (no self-skip). Host Node/npx is NOT required."
    dir: internal
    cmds:
      - go test -tags=integration_sandbox -run TestSandboxFeaturesManaged ./launch/...
    env:
      AILERON_SANDBOX_BASE_CONTEXT:
        sh: cd "{{.ROOT_DIR}}/images/sandbox-base" && pwd
      AILERON_SANDBOX_FEATURES_CONTEXT:
        sh: cd "{{.ROOT_DIR}}/images/sandbox-features" && pwd

  test:integration:sandbox-agent-image:
    desc: "Smoke-test a published per-agent sandbox image (claude/codex): assert the agent CLI is on PATH and Builder.Validate succeeds (launchability), against the image ref in AILERON_SANDBOX_AGENT_IMAGE (#1086); fail-fast — requires Docker and the env set (no self-skip)"
    dir: internal
    cmds:
      - go test -tags=integration_sandbox -run TestSandboxAgentImageSmoke ./launch/...

  build:launch:
    desc: >-
      Build the binaries `aileron launch --sandbox=docker` needs: the CLI
      (build/aileron) plus the MCP server. On non-Linux hosts build:mcp also
      emits build/aileron-mcp-linux-<arch>, the sibling the launcher
      bind-mounts into the Linux sandbox. Reusable build seam for the
      system-test scenarios so each one tests a freshly built launch path.
    deps:
      - build:cli
      - build:mcp

  _test:system:precond:docker:
    internal: true
    desc: >-
      Fail-fast precondition: the Docker daemon must be reachable. Shared by
      the smoke target (no agent) and the agent scenarios. On miss, exits
      non-zero with the exact remediation — never a silent skip.
    cmds:
      - |
        if ! docker info >/dev/null 2>&1; then
          echo "Docker daemon is not reachable. Start Docker Desktop / dockerd, then re-run: task {{.TARGET | default "test:system:smoke"}}" >&2
          exit 1
        fi

  _test:system:precond:
    internal: true
    desc: >-
      Fail-fast preconditions for an agent system-test scenario: Docker must be
      reachable AND the agent's credential must be resolvable. Pass
      AGENT=codex|claude. For codex the host-side auth file the launcher's
      AuthSpec mounts must exist. For claude the credential is vault-backed
      (agents/claude/oauth), so the gate passes when EITHER the host file
      exists OR the vault/daemon holds the entry. On a missing credential,
      exits non-zero naming the remediation — never a silent skip.
    vars:
      AGENT: '{{.AGENT}}'
    cmds:
      - task: _test:system:precond:docker
        vars:
          TARGET: 'test:system:launch:{{.AGENT}}'
      - |
        case "{{.AGENT}}" in
          codex)
            authfile="$HOME/.codex/auth.json"
            logincmd="codex login"
            if [ ! -f "$authfile" ]; then
              echo "Missing codex auth file: $authfile. Authenticate first with: $logincmd" >&2
              exit 1
            fi
            ;;
          claude)
            # Claude's credential is vault-backed (agents/claude/oauth): the
            # launcher's AuthSpec renders it into the sandbox at run time, so
            # the host file may be absent on a machine where the credential
            # lives only in the vault. Accept EITHER source.
            authfile="$HOME/.claude/.credentials.json"
            logincmd="claude /login"
            if [ -f "$authfile" ]; then
              :
            elif aileron vault list --scope agent 2>/dev/null | grep -qx "agents/claude/oauth"; then
              :
            else
              echo "Missing claude credential: neither host file $authfile nor a vault entry (agents/claude/oauth) is present. Authenticate first with: $logincmd" >&2
              exit 1
            fi
            ;;
          *)
            echo "Unknown AGENT '{{.AGENT}}' (expected codex or claude)" >&2
            exit 1
            ;;
        esac

  _test:system:cleanup:
    internal: true
    desc: >-
      Teardown for a system-test scenario, invoked via `defer:` so it runs even
      when an earlier assertion fails. Removes the sandbox container
      aileron-sbx-<SESSION> (tolerating "no such container") and the scenario's
      temp WORKSPACE dir, guarded so an unset/empty path never `rm -rf /`.
    vars:
      SESSION: '{{.SESSION}}'
      WORKSPACE: '{{.WORKSPACE}}'
    cmds:
      - |
        if [ -n "{{.SESSION}}" ]; then
          docker rm -f "aileron-sbx-{{.SESSION}}" >/dev/null 2>&1 || true
        fi
        case "{{.WORKSPACE}}" in
          ""|/) ;;
          *) rm -rf "{{.WORKSPACE}}" ;;
        esac

  test:system:
    desc: >-
      Run the `aileron launch` system-test scenarios (run-by-hand, not wired
      into CI — v1). Runs the harness smoke self-test and the shared
      scenario-library contract tests, then the per-agent scenarios codex
      (#1476) and claude (#1477) end to end. Requires a reachable Docker daemon
      and, per scenario, host-side agent auth — each scenario fail-fasts with
      the exact remediation if its auth is missing, never a silent skip. To run
      a single agent without the other, invoke its leaf directly
      (e.g. `task test:system:launch:claude`).
    cmds:
      - task: test:system:lib
      - task: test:system:smoke
      - task: test:system:launch:codex
      - task: test:system:launch:claude

  test:system:lib:
    desc: >-
      Contract tests for the shared system-test scenario library
      (test/system/lib/assert.sh + probes.sh) used by the codex (#1476) and
      claude (#1477) scenarios. Pure POSIX shell with a stubbed `docker`, so
      it needs no Docker daemon and no `aileron launch` — safe to run in CI
      and unattended. Validates the assert helpers and discover_container's
      match-count arbitration against their contracts.
    cmds:
      - sh "{{.ROOT_DIR}}/test/system/lib/assert_test.sh"
      - sh "{{.ROOT_DIR}}/test/system/lib/probes_test.sh"
      - sh "{{.ROOT_DIR}}/test/system/lib/taskenv_test.sh"

  test:system:smoke:
    desc: >-
      Harness self-test (no `aileron launch`, no agent, no LLM tokens): proves
      the system-test mechanics end to end — build fires, the Docker
      precondition gates, and `defer` cleanup runs even when an inner step
      fails. Builds aileron, checks Docker, creates a temp workspace + sentinel,
      then deliberately fails an inner step inside a subshell; the deferred
      cleanup removes the workspace, and the target verifies it is gone (so the
      target itself exits 0). Requires a reachable Docker daemon.
    deps:
      - build:launch
    vars:
      SESSION: smoke-test
      # Pure-template temp path: go-task exposes env vars (TMPDIR/TEMP/TMP) as
      # template vars, so this resolves a writable dir on Windows (TEMP/TMP set)
      # and Unix (TMPDIR or /tmp) without `mktemp`, whose bundled-coreutils form
      # can't resolve /tmp under go-task's embedded shell on Windows. `unixEpoch`
      # + `randInt` replace `date +%s` and `$$` (no shell binary on PATH needed).
      WORKSPACE: '{{.TMPDIR | default .TEMP | default .TMP | default "/tmp"}}/aileron-smoke-{{now | unixEpoch}}-{{randInt 10000 99999}}'
    cmds:
      - task: _test:system:precond:docker
        vars:
          TARGET: test:system:smoke
      - defer: { task: _test:system:cleanup, vars: { SESSION: '{{.SESSION}}', WORKSPACE: '{{.WORKSPACE}}' } }
      # The template no longer creates the dir the way `mktemp -d` did; create it
      # explicitly (mkdir is bundled in Task's coreutils, works cross-platform).
      - mkdir -p "{{.WORKSPACE}}"
      - |
        set -u
        # Prove build:launch produced the launch binary.
        test -f build/aileron || { echo "build:launch did not produce build/aileron" >&2; exit 1; }
        # Seed a sentinel the deferred cleanup must remove.
        touch "{{.WORKSPACE}}/sentinel"
        test -f "{{.WORKSPACE}}/sentinel" || { echo "failed to seed sentinel" >&2; exit 1; }
        # Deliberately fail an inner step in a subshell to prove `defer` still
        # fires; absorb the non-zero so the outer target can assert cleanup ran
        # and still return 0.
        ( echo "smoke: simulating a scenario assertion failure" >&2; exit 1 ) || true
      - |
        set -u
        # Run the SAME teardown logic the deferred _test:system:cleanup runs,
        # inline, so we can assert removal within this run (a `defer` fires only
        # after the target returns, so its effect is not observable here). The
        # registered `defer` then re-runs this idempotently as the genuine
        # belt-and-suspenders teardown on exit. This mirrors _test:system:cleanup
        # exactly; keep the two in sync.
        if [ -n "{{.SESSION}}" ]; then
          docker rm -f "aileron-sbx-{{.SESSION}}" >/dev/null 2>&1 || true
        fi
        case "{{.WORKSPACE}}" in
          ""|/) ;;
          *) rm -rf "{{.WORKSPACE}}" ;;
        esac
        if [ -e "{{.WORKSPACE}}" ]; then
          echo "cleanup did not remove workspace {{.WORKSPACE}}" >&2
          exit 1
        fi
        echo "smoke: harness OK — build fired, Docker precondition passed, cleanup removed the workspace"

  test:system:launch:codex:
    desc: >-
      System-test scenario for the codex agent under `aileron launch` (#1476).
      Wires the reusable build seam (build:launch), fail-fast preconditions
      (_test:system:precond AGENT=codex), and `defer` cleanup (#1475), then runs
      test/system/codex.sh: it drives `aileron launch codex -- exec "…"` once
      (never `docker run` directly), runs the shared R8 wiring-invariant probes
      against the live container, asserts R7a arg-forwarding, the R9 sentinel,
      and the R10 audit round-trip. STATIC GATE — a live run needs a real codex
      login and LLM tokens, so it is run BY HAND on a real host; the headless
      path validates wiring with `task --dry test:system:launch:codex`, which
      compiles the target without executing the scenario. See test/system/README.md.
    deps:
      - build:launch
    vars:
      # Pure-template, no shell binary on PATH needed: `unixEpoch` + `randInt`
      # replace `date +%s` and `$$` so SESSION/WORKSPACE resolve under go-task's
      # embedded shell on Windows (no `date`, no usable `mktemp`). go-task exposes
      # env vars (TMPDIR/TEMP/TMP) as template vars for a writable temp root.
      SESSION: 'codex-{{now | unixEpoch}}-{{randInt 10000 99999}}'
      WORKSPACE: '{{.TMPDIR | default .TEMP | default .TMP | default "/tmp"}}/aileron-codex-{{now | unixEpoch}}-{{randInt 10000 99999}}'
    # Task-scoped env: go-task only honors `env:` at the task level, not on an
    # individual `cmds:` entry (a command-level `env:` is silently ignored), so
    # the scenario script must receive AILERON_BIN et al. from here. Keeping it
    # task-scoped also exports the vars to the `defer`/precond cmds uniformly.
    env:
      AILERON_BIN: '{{.ROOT_DIR}}/build/aileron'
      AILERON_SYSTEST_LIB: '{{.ROOT_DIR}}/test/system/lib'
      WORKSPACE: '{{.WORKSPACE}}'
      AILERON_STATE_DIR:
        sh: echo "${AILERON_STATE_DIR:-$HOME/.aileron}"
    cmds:
      # Register cleanup FIRST so a failed precondition (Docker down or codex
      # auth absent) still removes the WORKSPACE — a `defer` only registers once
      # its line is reached.
      - defer: { task: _test:system:cleanup, vars: { SESSION: '{{.SESSION}}', WORKSPACE: '{{.WORKSPACE}}' } }
      # The WORKSPACE template no longer creates the dir the way `mktemp -d` did;
      # create it explicitly (mkdir is bundled in Task's coreutils, cross-platform)
      # before the scenario `cd`s into it and writes its sentinel.
      - mkdir -p "{{.WORKSPACE}}"
      - task: _test:system:precond
        vars:
          AGENT: codex
      - cmd: sh "{{.ROOT_DIR}}/test/system/codex.sh"

  test:system:launch:claude:
    desc: >-
      System-test scenario for the claude agent under `aileron launch` (#1477).
      Wires the reusable build seam (build:launch), fail-fast preconditions
