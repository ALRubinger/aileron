services:

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aileron
      POSTGRES_PASSWORD: aileron
      POSTGRES_DB: aileron
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aileron"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ..
      dockerfile: internal/server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AILERON_BIND: "0.0.0.0:8080"
      AILERON_DATABASE_URL: "postgres://aileron:aileron@postgres:5432/aileron?sslmode=disable"
      AILERON_JWT_SIGNING_KEY: "${AILERON_JWT_SIGNING_KEY}"
      AILERON_AUTO_VERIFY_EMAIL: "${AILERON_AUTO_VERIFY_EMAIL:-false}"
      GOOGLE_SIGNIN_CLIENT_ID: "${GOOGLE_SIGNIN_CLIENT_ID:-}"
      GOOGLE_SIGNIN_CLIENT_SECRET: "${GOOGLE_SIGNIN_CLIENT_SECRET:-}"
      GOOGLE_CONNECTOR_CLIENT_ID: "${GOOGLE_CONNECTOR_CLIENT_ID:-}"
      GOOGLE_CONNECTOR_CLIENT_SECRET: "${GOOGLE_CONNECTOR_CLIENT_SECRET:-}"
      GITHUB_SIGNIN_CLIENT_ID: "${GITHUB_SIGNIN_CLIENT_ID:-}"
      GITHUB_SIGNIN_CLIENT_SECRET: "${GITHUB_SIGNIN_CLIENT_SECRET:-}"
      GITHUB_CONNECTOR_CLIENT_ID: "${GITHUB_CONNECTOR_CLIENT_ID:-}"
      GITHUB_CONNECTOR_CLIENT_SECRET: "${GITHUB_CONNECTOR_CLIENT_SECRET:-}"
      AILERON_OAUTH_CALLBACK_BASE_URL: "${AILERON_OAUTH_CALLBACK_BASE_URL:-}"
      AILERON_TRUSTED_ORIGINS: "${AILERON_TRUSTED_ORIGINS:-}"
      AILERON_SYSTEM_VAULT_KEY: "${AILERON_SYSTEM_VAULT_KEY:-}"
    ports:
      - "8080:8080"

  ui:
    build:
      context: ../ui
      dockerfile: Dockerfile
      args:
        PUBLIC_POSTHOG_KEY: "${PUBLIC_POSTHOG_KEY:-}"
        PUBLIC_POSTHOG_HOST: "${PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}"
    restart: unless-stopped
    depends_on:
      - server
    environment:
      AILERON_API_URL: "http://server:8080"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
