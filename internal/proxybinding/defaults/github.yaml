# Built-in binding descriptor for GitHub (github.com, api.github.com).
#
# GitHub is the second proving profile for the credential-sealing
# substrate, after Linear. It used to be special-cased as Go code
# (proxybinding.GitHubHostBindings). It now ships as a trusted default
# expressed purely as data, flowing the same generic loader into the
# binding table that every community profile uses, with zero per-CLI
# proxy code.
#
# This file lives in the embedded defaults/ layer, the trusted built-in
# tier of the built-in -> user config convention. A user descriptor can
# override either host (built-in < user precedence), so GitHub is a
# normal default layer, not privileged Go.
#
# The agent in the sandbox never holds a GitHub secret. The daemon
# resolves user/github from the vault and injects the credential at the
# TLS forward-proxy boundary, per the matched binding's scheme. With no
# user/github entry a binding still matches but resolution fails closed
# (no header, no secret).
#
# Two hosts, two schemes, two emit mechanisms:
#
#   - github.com -> basic, mechanism A. git-over-HTTPS sends
#     "Authorization: Basic base64(x-access-token:<token>)", the
#     documented convention for authenticating git with a GitHub token.
#     git issues an unauthenticated request (its no-op credential helper
#     supplies empty credentials), so the proxy injects unconditionally
#     with no sentinel needed.
#   - api.github.com -> bearer, mechanism B. `gh`/REST sends
#     "Authorization: Bearer <token>". `gh` short-circuits locally
#     without a token, so the launcher plants a non-secret sentinel as
#     GH_TOKEN; the proxy swaps the sentinel for the real credential at
#     egress and leaves a foreign token untouched. The sentinel value is
#     non-secret: presenting it upstream authenticates nothing, so it is
#     safe to commit here.
#
# Only the two exact apexes are sealed (no wildcard). A request to any
# other *.github.com host (raw.githubusercontent.com is a different apex)
# falls through to passthrough rather than being injected with a
# credential it was not scoped for.
version: v1
bindings:
  - host: github.com
    credential_ref: user/github
    scheme: basic
    emit_mechanism: A
    username: x-access-token
  - host: api.github.com
    credential_ref: user/github
    scheme: bearer
    emit_mechanism: B
    sentinel:
      value: ghp_AILERONSENTINELAAAAAAAAAAAAAAAAAAAAA
      env: GH_TOKEN
