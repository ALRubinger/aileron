
openapi: 3.1.0
info:
  title: Agentic Control Plane API
  version: 0.2.0
  summary: Policy, approval, execution, and audit APIs for governed agent actions
  description: |
    v0.2 extends the base control-plane lifecycle with richer, domain-specific schemas for:
      - Git and pull request actions
      - Deploy and cloud actions
      - Email and calendar actions
      - Payment and procurement actions

    Core lifecycle:
      intent -> policy decision -> approval (optional) -> execution grant -> execution -> trace

servers:
  - url: https://api.withaileron.ai
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Enterprises
  - name: Users
  - name: Intents
  - name: Approvals
  - name: Policies
  - name: Connectors
  - name: Actions
  - name: Bindings
    description: |
      Capability bindings: per-user mappings from a connector's declared
      `[capabilities.credential]` to a concrete vault entry that holds the
      bytes. Per ADR-0006, bindings are explicit (no silent matching),
      named `<kind>/<service>/<identity>`, and drive the credential the
      runtime injects into outbound requests at execution time. v1 supports
      `api_key` source values; OAuth source lands in #388.
  - name: Executions
  - name: Funding Sources
  - name: Credentials
  - name: Traces
  - name: Analytics
  - name: Connected Accounts
  - name: TEE
  - name: Health
  - name: Gateway
    description: |
      Dual-protocol LLM gateway. Aileron speaks both OpenAI Chat Completions
      and Anthropic Messages, augmenting the agent's tool catalog with the
      user's installed actions, intercepting tool calls for those actions,
      executing them deterministically, and injecting the synthesized
      result back into the response stream. Behavior is ratified by
      ADR-0008 (intent matching).

paths:
  /v1/health:
    get:
      tags: [Health]
      summary: Get service health
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/status:
    get:
      tags: [Health]
      summary: Get runtime status (version, listen address, action / connector / binding counts, vault state)
      description: |
        Read-only snapshot of the running daemon's state, ratified by
        ADR-0004's "operational primitives" line. Surfaced through the
        `aileron status` CLI and as the in-band `/aileron status`
        agent slash-command per ADR-0009. Safe to call frequently —
        no side effects, no vault unlock, no lookups outside the
        process's in-memory state.

        Distinct from `GET /v1/health` (which is a liveness probe).
        `/v1/status` is the operator's "what's installed and working"
        snapshot.
      operationId: getStatus
      security: []
      responses:
        "200":
          description: Runtime status snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /auth/{provider}/login:
    get:
      tags: [Auth]
      summary: Initiate OAuth login
      description: Redirects the user to the specified auth provider's consent screen.
      operationId: authLogin
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            examples: [google, github]
      responses:
        "307":
          description: Redirect to auth provider
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/{provider}/callback:
    get:
      tags: [Auth]
      summary: OAuth callback
      description: |
        Handles the OAuth callback from the auth provider. Exchanges the
        authorization code for user identity, creates or looks up the user
        and enterprise, issues session tokens, and redirects to the UI.
      operationId: authCallback
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "307":
          description: Redirect to UI with session cookies set
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/signup:
    post:
      tags: [Auth]
      summary: Sign up with email and password
      description: |
        Creates a new account with email and password. The account starts in
        pending_verification status. A 6-digit verification code is sent to
        the email address and must be submitted via /auth/verify-email before
        the account can be used.
      operationId: authSignup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created, verification code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email address
      description: |
        Submits the 6-digit verification code sent to the user's email.
        On success, the account status changes from pending_verification to active.
      operationId: authVerifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified, account activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyEmailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      description: Authenticates with email and password and returns an access token.
      operationId: authEmailLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailLoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: Exchanges a refresh token for a new access token. The refresh token is rotated.
      operationId: authRefresh
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: Deletes the session and clears authentication cookies.
      operationId: authLogout
      security: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"

  /v1/enterprises/me:
    get:
      tags: [Enterprises]
      summary: Get current enterprise
      description: Returns the enterprise for the authenticated user.
      operationId: getCurrentEnterprise
      responses:
        "200":
          description: Current enterprise
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enterprise"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      tags: [Enterprises]
      summary: Update current enterprise
      description: Updates the authenticated user's enterprise. Requires owner or admin role.
      operationId: updateCurrentEnterprise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEnterpriseRequest"
      responses:
        "200":
          description: Enterprise updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enterprise"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/users/me:
    get:
      tags: [Users]
      summary: Get current user
      description: Returns the authenticated user's profile.
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      tags: [Users]
      summary: Update current user
      description: Updates the authenticated user's profile.
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/users/me/auth-providers/{provider}:
    delete:
      tags: [Users]
      summary: Disconnect an auth provider
      description: |
        Removes an OAuth identity provider link from the current user's account.
        Cannot disconnect the last auth method — the user must have another
        connected provider or a password set.
      operationId: disconnectAuthProvider
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
          description: Provider name to disconnect (e.g. google, github)
      responses:
        "204":
          description: Provider disconnected
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/users/me/passphrase:
    post:
      tags: [Users]
      summary: Set or rotate vault passphrase
      description: |
        Stores the client-provided salt and KEK verification blob. The client
        derives the KEK locally using Argon2id, encrypts a known verification
        constant, and sends only the salt and encrypted blob — the passphrase
        and KEK never leave the browser. On subsequent calls, the existing key
        material is rotated (callers must re-encrypt vault secrets separately).
      operationId: setPassphrase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPassphraseRequest"
      responses:
        "200":
          description: Passphrase set successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassphraseSaltResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/users/me/passphrase/verification:
    get:
      tags: [Users]
      summary: Get KEK verification blob
      description: |
        Returns the encrypted verification blob for client-side passphrase
        verification. The client derives the KEK locally from the passphrase
        and salt, then decrypts this blob to check correctness. The server
        never sees the passphrase or KEK.
      operationId: getPassphraseVerification
      responses:
        "200":
          description: Verification blob
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassphraseVerificationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/users/me/passphrase/salt:
    get:
      tags: [Users]
      summary: Get passphrase salt
      description: |
        Returns the Argon2id salt for the current user's passphrase, allowing
        client-side KEK derivation. Also indicates whether the user has set a
        passphrase.
      operationId: getPassphraseSalt
      responses:
        "200":
          description: Salt and passphrase status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassphraseSaltResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/users/me/passphrase/unlock:
    post:
      tags: [Users]
      summary: Unlock vault with passphrase-derived KEK
      description: |
        The client derives the KEK locally from the passphrase and stored salt
        using Argon2id, then sends the 32-byte KEK to the server over HTTPS.
        The server verifies it against the stored verification blob, and on
        success caches the KEK in memory for the session TTL. Tokens can only
        be encrypted or decrypted while the vault is unlocked.
      operationId: unlockVault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockVaultRequest"
      responses:
        "200":
          description: Vault unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/users/me/passphrase/lock:
    post:
      tags: [Users]
      summary: Lock vault and clear cached KEK
      description: |
        Clears the user's cached KEK from server memory. Connected account
        operations will return 423 until the vault is unlocked again.
      operationId: lockVault
      responses:
        "200":
          description: Vault locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/users/me/vault/status:
    get:
      tags: [Users]
      summary: Get vault lock status
      description: |
        Returns whether the vault is locked or unlocked, the session expiry
        time, and whether the user has set a passphrase.
      operationId: getVaultStatus
      responses:
        "200":
          description: Vault status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/intents:
    post:
      tags: [Intents]
      summary: Submit a new action intent
      operationId: createIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIntentRequest"
            examples:
              gitPullRequest:
                summary: Create a pull request
                value:
                  idempotency_key: "23d6f3ab-7ef9-433e-bd2e-0c6af4bb1001"
                  agent_id: "agt_codex_repo_alpha"
                  workspace_id: "ws_engineering"
                  action:
                    type: "git.pull_request.create"
                    summary: "Open PR from feature branch to main"
                    justification: "Ship checkout bug fix"
                    target:
                      kind: "repository"
                      id: "repo_checkout"
                      display_name: "github.com/acme/checkout"
                    domain:
                      git:
                        provider: "github"
                        repository: "acme/checkout"
                        branch: "fix/checkout-tax-rounding"
                        base_branch: "main"
                        commit_shas:
                          - "abc1234"
                        files_changed:
                          - "src/tax.ts"
                          - "tests/tax.test.ts"
                        pr_title: "Fix tax rounding on checkout"
                        pr_body: "This PR fixes checkout tax rounding and adds regression tests."
                        labels: ["bugfix", "checkout"]
                  context:
                    environment: "production"
                    source_platform: "codex"
              paymentPurchase:
                summary: Purchase SaaS subscription
                value:
                  idempotency_key: "89967c5b-0340-4781-aa0c-8cde2ef41002"
                  agent_id: "agt_procurement_ops"
                  workspace_id: "ws_finops"
                  action:
                    type: "payment.charge"
                    summary: "Purchase annual Figma license"
                    justification: "Renew expiring seat for jane@company.com"
                    target:
                      kind: "vendor"
                      id: "vendor_figma"
                      display_name: "Figma"
                    domain:
                      payment:
                        vendor_name: "Figma"
                        amount:
                          amount: 18000
                          currency: "USD"
                        merchant_category: "software"
                        budget_code: "design-software"
                        funding_source_id: "fs_team_software"
                        payment_instrument_preference: "virtual_card"
                        line_items:
                          - description: "Figma Pro Annual"
                            quantity: 1
                            unit_amount:
                              amount: 18000
                              currency: "USD"
                        beneficiary:
                          email: "jane@company.com"
                  context:
                    environment: "production"
                    source_platform: "openclaw"
      responses:
        "201":
          description: Intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

    get:
      tags: [Intents]
      summary: List intents
      operationId: listIntents
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: workspace_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/IntentStatus"
        - name: action_type
          in: query
          schema:
            type: string
        - name: agent_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated intents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/intents/{intent_id}:
    get:
      tags: [Intents]
      summary: Get an intent
      operationId: getIntent
      parameters:
        - $ref: "#/components/parameters/IntentId"
      responses:
        "200":
          description: Intent details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/intents/{intent_id}/evidence:
    post:
      tags: [Intents]
      summary: Attach evidence to an intent
      operationId: appendIntentEvidence
      parameters:
        - $ref: "#/components/parameters/IntentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendEvidenceRequest"
      responses:
        "200":
          description: Evidence appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/action-approvals:
    get:
      tags: [Approvals]
      summary: List pending action-level approval requests
      description: |
        Returns the queue of pending approvals minted by the runtime
        when an action whose manifest declares `[approval] required = true`
        is invoked. Distinct from the rich governance flow under
        `/v1/approvals` (intents, multi-approver workflows, execution
        grants) — this surface is the runtime-blocking shape: each
        entry corresponds to one held-open `POST /v1/actions/{name}/run`
        response waiting for a single yes/no decision.

        v0.x is in-memory and per-process; the queue resets on server
        restart. Persistent backing parallels the audit-log persistence
        work (#412).
      operationId: listActionApprovals
      responses:
        "200":
          description: Pending action-approval queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionApprovalListResponse"

  /v1/action-approvals/watch:
    get:
      tags: [Approvals]
      summary: Stream action-level approval queue events (Server-Sent Events)
      description: |
        Server-Sent Events stream of action-approval queue state. The
        webapp's `/approvals` page subscribes here so the pending list
        updates live without polling.

        On connect the server emits a single `snapshot` event with the
        current pending queue, then one event per state change:

        - `event: snapshot` — `{ items: [PendingActionApproval, ...] }`
          (the same shape `GET /v1/action-approvals` returns).
        - `event: pending` — one `PendingActionApproval` payload, fired
          when the runtime registers a new approval.
        - `event: resolved` — one `ResolvedActionApproval` payload,
          fired when `POST /v1/action-approvals/{id}/decide` resolves
          an entry. The webapp uses this to drop the matching card.

        A SSE comment line (`: heartbeat\n\n`) is sent every 30 seconds
        to keep the connection alive across idle proxies. The stream
        ends when the client disconnects or the server shuts down.

        Per-subscriber buffer is finite (32 events); a slow consumer
        drops events past the buffer. Clients should resync via
        `GET /v1/action-approvals` on reconnect to recover from any
        gap.
      operationId: watchActionApprovals
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Sequence of SSE events. Each event is `event: <type>\ndata: <json>\n\n`.
                  See description for the per-type payload shapes.
        "503":
          description: The action-approval queue is not configured on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/action-approvals/{approval_id}/decide:
    post:
      tags: [Approvals]
      summary: Approve or deny a pending action-level approval
      description: |
        Resolves a pending action-level approval. The runtime's
        held-open `POST /v1/actions/{name}/run` response unblocks on
        the next tick; on `approved = true` the action proceeds and
        returns its normal result, on `approved = false` it returns
        an `approval_denied` failure envelope per ADR-0010 with the
        supplied reason.
      operationId: decideActionApproval
      parameters:
        - name: approval_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionApprovalDecision"
      responses:
        "200":
          description: Decision recorded
        "404":
          description: Approval id is unknown or already resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/approvals:
    get:
      tags: [Approvals]
      summary: List approval requests
      operationId: listApprovals
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
        - name: assignee
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Approval queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/approvals/{approval_id}:
    get:
      tags: [Approvals]
      summary: Get an approval request
      operationId: getApproval
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      responses:
        "200":
          description: Approval details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/approvals/{approval_id}/approve:
    post:
      tags: [Approvals]
      summary: Approve an action
      operationId: approveRequest
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRequest"
      responses:
        "200":
          description: Approval recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/approvals/{approval_id}/deny:
    post:
      tags: [Approvals]
      summary: Deny an action
      operationId: denyRequest
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: true
        content:
          application/json:
