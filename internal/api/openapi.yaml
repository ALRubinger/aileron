  /v1/tee/session:
    post:
      tags: [TEE]
      summary: Establish TEE session and transmit KEK
      description: |
        Accepts the client's ephemeral ECDH public key and an encrypted KEK
        blob. The server forwards both to the enclave as an opaque pass-through
        — it cannot derive the shared secret or decrypt the KEK. The enclave
        performs the ECDH key exchange, decrypts the KEK, and stores it in
        hardware-isolated memory. Auto-escrows active credentials on success.
      operationId: establishTeeSession
      requestBody:
        required: true
