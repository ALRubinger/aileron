          items:
            $ref: "#/components/schemas/PolicyCondition"
        effect:
          type: string
          enum: [allow, deny, require_approval, allow_with_modification]
        approval_requirement:
          $ref: "#/components/schemas/ApprovalRequirement"
        modifications_template:
          type: object
          additionalProperties: true
        priority:
          type: integer
          default: 100

    Policy:
      type: object
      required: [policy_id, name, workspace_id, status, version, rules]
      properties:
        policy_id:
          type: string
        workspace_id:
          type: string
        name:
          type: string
        description:
          type: string
        environment:
          type: string
        status:
          $ref: "#/components/schemas/PolicyStatus"
        version:
          type: integer
        rules:
          type: array
          items:
            $ref: "#/components/schemas/PolicyRule"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreatePolicyRequest:
      type: object
      required: [workspace_id, name, rules]
      properties:
        workspace_id:
          type: string
        name:
          type: string
        description:
          type: string
        environment:
          type: string
        status:
          $ref: "#/components/schemas/PolicyStatus"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/PolicyRule"

    UpdatePolicyRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/PolicyStatus"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/PolicyRule"

    PolicyListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Policy"
        pagination:
          $ref: "#/components/schemas/Pagination"

    PolicySimulationRequest:
      type: object
      required: [workspace_id, action]
      properties:
        workspace_id:
          type: string
        action:
          $ref: "#/components/schemas/ActionIntent"
        context:
          $ref: "#/components/schemas/IntentContext"

    PolicySimulationResponse:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: "#/components/schemas/Decision"

    ConnectorAuth:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [oauth2, api_key_ref, service_account_ref, webhook_secret_ref, custom]
        reference_id:
          type: string
        scopes:
          type: array
          items:
            type: string

    Connector:
      type: object
      required: [connector_id, workspace_id, type, name, status]
      properties:
        connector_id:
          type: string
        workspace_id:
          type: string
        type:
          $ref: "#/components/schemas/ConnectorType"
        name:
          type: string
        provider:
          type: string
        status:
          type: string
          enum: [active, disabled, error]
        environment:
          type: string
        auth:
          $ref: "#/components/schemas/ConnectorAuth"
        policy_ids:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true

    CreateConnectorRequest:
      type: object
      required: [workspace_id, type, name, auth]
      properties:
        workspace_id:
          type: string
        type:
          $ref: "#/components/schemas/ConnectorType"
        name:
          type: string
        provider:
          type: string
        environment:
          type: string
        auth:
          $ref: "#/components/schemas/ConnectorAuth"
        metadata:
          type: object
          additionalProperties: true

    UpdateConnectorRequest:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        auth:
          $ref: "#/components/schemas/ConnectorAuth"
        metadata:
          type: object
          additionalProperties: true

    ConnectorListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Connector"
        pagination:
          $ref: "#/components/schemas/Pagination"

    SyncRequest:
      type: object
      properties:
        auto_install:
          type: boolean
          default: true
          description: |
            Auto-approve install consent for missing connectors. v1
            has no consent prompt — install is unconditional — so this
            flag is accepted as a no-op for forward compatibility with
            the planned consent flow. Maps to the CLI's `--yes` flag.

    SyncResponse:
      type: object
      required: [actions_seen, required, installed, already_installed, install_failures, unbound]
      properties:
        actions_seen:
          type: integer
          description: Count of action manifests in `~/.aileron/actions/` walked this run.
        required:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorRef"
          description: |
            Deduplicated set of (FQN, version) connector references
            collected across every action's `[[requires.connectors]]`.
        installed:
          type: array
          items:
            $ref: "#/components/schemas/InstalledConnector"
          description: |
            Connectors actually installed by this sweep — i.e. those
            absent from the cstore at the start of the run.
        already_installed:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorRef"
          description: |
            Connectors that were already present in the cstore (no
            install necessary). The idempotent path.
        install_failures:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorInstallFailure"
          description: |
            Connectors whose install pipeline failed (resolver,
            fetcher, verifier, hash mismatch, etc.). Sweep continues
            past per-connector failures.
        unbound:
          type: array
          items:
            $ref: "#/components/schemas/UnboundCapability"
          description: |
            Capabilities (`[capabilities.credential]` blocks) declared
            by installed connectors for which no binding exists.
            Sorted by `connector_fqn` then `kind` for deterministic
            output. Operators bind these manually with
            `aileron binding setup <FQN>`.

    ConnectorRef:
      type: object
      required: [fqn, version]
      properties:
        fqn:
          type: string
          description: Fully-qualified URI per ADR-0002.
        version:
          type: string
          description: Strict SemVer.

    ConnectorInstallFailure:
      type: object
      required: [fqn, version, error]
      properties:
        fqn:
          type: string
        version:
          type: string
        error:
          type: string
          description: Human-readable error from the install pipeline.

    ConnectorsCheckResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorCheckResult"
          description: |
            One entry per installed (FQN, version) pair. Order matches
            the cstore index's deterministic sort (ascending canonical
            key); operators rendering this should not assume a
            different order.

    ConnectorCheckResult:
      type: object
      required: [fqn, current_version, update_available]
      properties:
        fqn:
          type: string
          description: Canonical FQN of the installed connector (per ADR-0002).
        current_version:
          type: string
          description: Currently installed SemVer.
        update_available:
          type: boolean
          description: |
            True when `latest_version` is strictly newer than `current_version`
            under SemVer 2.0 ordering. False when this connector is up to date,
            and false when `error` is present (we couldn't tell).
        latest_version:
          type: string
          description: |
            Latest available version after applying the prerelease filter.
            Omitted when `error` is present or when no released versions
            were found at the source.
        available_versions:
          type: array
          items:
            type: string
          description: |
            Versions strictly newer than `current_version`, sorted descending.
            Omitted when `error` is present. Excludes pre-releases unless
            the request set `include_prerelease=true`.
        error:
          type: string
          description: |
            Per-connector check error (network failure, source removed,
            unknown scheme, scheme not yet implemented). When present,
            `latest_version` and `available_versions` may be omitted —
            the check failed for this connector but did not abort the
            sweep.

    InstallConnectorRequest:
      type: object
      required: [fqn, version]
      properties:
        fqn:
          type: string
          description: |
            Fully-qualified URI per ADR-0002 (e.g. `github://aileron/slack`).
            Scheme must be one of `github`, `gitlab`, `hub` in v1.
        version:
          type: string
          description: Strict SemVer (e.g. `1.2.0`). No ranges, no `latest`.
        expected_hash:
          type: string
          description: |
            Optional canonical hash (`sha256:<hex>`) the install must match.
            When supplied (typical when the install is driven by an action
            file's `[[requires.connectors]] hash`), a computed hash that
            does not match aborts the install with `hash_mismatch` and
            nothing is written to the store. When omitted (typical for
            first install), the pipeline records whatever hash the bytes
            produce.

    InstalledConnector:
      type: object
      required: [fqn, version, hash, entry_dir]
      properties:
        fqn:
          type: string
        version:
          type: string
        hash:
          type: string
          description: Canonical `sha256:<hex>` of the installed bytes.
        entry_dir:
          type: string
          description: Absolute path of the store entry on disk.
        already_installed:
          type: boolean
          description: |
            True when the install was a no-op because an entry with the
            matching hash already existed (offline reinstall path per
            ADR-0004).

    InstallActionRequest:
      type: object
      required: [fqn, version]
      properties:
        fqn:
          type: string
          description: |
            Fully-qualified URI of the action template per ADR-0002 / ADR-0003
            (e.g. `github://ALRubinger/aileron-connector-github/actions/list-recent-prs`).
            Subpath references are supported for actions published alongside
            their connector.
        version:
          type: string
          description: Strict SemVer (e.g. `0.1.0`).
        force:
          type: boolean
          default: false
          description: |
            When true, overwrite an existing action with the same name.
            When false (default), refuse with `409 Conflict` if an action
            of the same name already exists.
        auto_install_connectors:
          type: boolean
          default: false
          description: |
            When true, the server transparently installs any
            `[[requires.connectors]]` whose pinned hash is not already in
            the local content-addressed store, using the connector's
            declared version and hash from the action manifest. Each
            implicit install runs the full connector pipeline (resolve →
            fetch → verify signature → match `expected_hash`) and any
            failure aborts the action install with the connector's
            structured error.

            When false (default), missing connector deps abort the
            install with a `422` carrying `error.code = connectors_missing`
            and `error.details[]` listing each missing connector's
            `name`, `version`, and `hash` so the CLI can prompt the user
            for confirmation before retrying with the flag set.

    InstalledAction:
      type: object
      required: [name, fqn, version, source, path]
      properties:
        name:
          type: string
          description: Bare local handle of the installed action (the action manifest's `name`).
        fqn:
          type: string
          description: FQN the action was installed from.
        version:
          type: string
        source:
          type: string
          description: Provenance URI recorded on the installed manifest's `source` field.
        path:
          type: string
          description: Absolute path of the installed action file on disk.
        already_installed:
          type: boolean
          description: |
            True when the action was already present and the install was a no-op
            (the file on disk matched the bytes that would have been written).
        unbound_capabilities:
          type: array
          description: |
            Credential capabilities the action's connectors declare that
            do not yet have a binding in the user's vault. The CLI uses
            this list to prompt the user to drop into `aileron binding
            setup` immediately after install — the user stays in the CLI
            and avoids hitting `binding_required` later.
          items:
            $ref: "#/components/schemas/UnboundCapability"

    UnboundCapability:
      type: object
      required: [connector_fqn, kind]
      properties:
        connector_fqn:
          type: string
          description: FQN of the connector that needs a binding.
        kind:
          type: string
          description: Declared credential kind (`api_key`, `oauth2`).
        scope:
          type: string
          description: Human-readable scope description from the connector manifest.

    MissingConnector:
      type: object
      required: [name, version, hash]
      description: |
        One entry in the `error.details[]` array returned with the
        `connectors_missing` failure on `POST /v1/actions/install`. Names
        a connector dependency the action pins via
        `[[requires.connectors]]` whose `hash` is not present in the
        local content-addressed store. The CLI uses this to display the
        resolved FQN, version, and hash to the user before prompting for
        an implicit install.
      properties:
        name:
          type: string
          description: Connector FQN per ADR-0002.
        version:
          type: string
          description: Strict SemVer pinned by the action manifest.
        hash:
          type: string
          description: Canonical `sha256:<hex>` pinned by the action manifest.

    Action:
      type: object
      description: |
        A user-installed action manifest. Per ADR-0001 and ADR-0003, an
        action is a single Markdown file with TOML frontmatter; the parsed
        frontmatter populates this object's structured fields and the
        Markdown content following the closing `+++` populates `body`.
      required:
        - name
        - version
        - source
        - requires
        - match
        - execute
      properties:
        name:
          type: string
          description: Bare local handle for the action (e.g. "ship-update").
        version:
          type: string
          description: Strict SemVer of the action manifest.
        source:
          type: string
          description: |
            Fully-qualified URI of the template the action was installed from
            (e.g. "hub://aileron/ship-update@1.0.0"). Provenance only — not
            consulted at runtime.
        requires:
          $ref: "#/components/schemas/ActionRequires"
        match:
          $ref: "#/components/schemas/ActionMatch"
        inputs:
          type: array
          description: |
            Declared call-time arguments. Per ADR-0003, inputs map directly
            to the JSON Schema `parameters` object the LLM sees when
            Aileron exposes the action as a tool.
          items:
            $ref: "#/components/schemas/ActionInput"
        execute:
          type: array
          items:
            $ref: "#/components/schemas/ActionExecuteStep"
        approval:
          $ref: "#/components/schemas/ActionApprovalPolicy"
        body:
          type: string
          description: |
            Markdown content following the closing `+++` delimiter. The first
            paragraph (or a designated section) is surfaced to the LLM as the
            function description when the action is exposed as a tool.
        path:
          type: string
          description: Absolute path of the source file on disk.

    ActionApprovalPolicy:
      type: object
      description: |
        Approval gating for an action. When `required` is true, the runtime
        holds the action-run HTTP response open while it queues an approval
        request to the orchestrator; the response unblocks only when the user
        approves (action runs normally) or denies (returns an
        `approval_denied` failure envelope). The agent surfaces the approval
        URL to the user via tool descriptions templated by `aileron-mcp`.
      properties:
        required:
          type: boolean
          description: |
            When true, `POST /v1/actions/{name}/run` blocks on user approval
            before executing. Default false.

    PendingActionApproval:
      type: object
      required: [id, action_name, requested_at]
      description: |
        One pending action-level approval request. Surfaced to the
        webapp / CLI for user decision. The runtime is blocked on the
        corresponding action-run HTTP response and will resume the
        moment a decision is posted to `/v1/action-approvals/{id}/decide`.
      properties:
        id:
          type: string
          description: Opaque server-minted identifier for this request.
        action_name:
          type: string
          description: Manifest name of the gated action (e.g. "send-email").
        connector_fqn:
          type: string
          description: |
            Connector FQN the action's first execute step targets, surfaced
            so the user can see which integration would actually run.
        args:
          type: object
          additionalProperties: true
          description: |
            Call-time arguments the agent passed in. Surfaced verbatim so
            the user reviews exactly what would be sent.
        session_id:
          type: string
          description: |
            Launch session that initiated the request, when one is in
            scope; empty for daemon-direct callers.
        requested_at:
          type: string
          format: date-time
          description: When the queue minted this request.

    ActionApprovalListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PendingActionApproval"

    ActionApprovalDecision:
      type: object
      required: [approved]
      properties:
        approved:
          type: boolean
          description: True to allow the action to run; false to deny.
        reason:
          type: string
          description: |
            Optional commentary from the user. Surfaced to the agent in
            the deny path so it can recover gracefully (e.g. "wrong
            recipient — I'll redraft").

    ResolvedActionApproval:
      type: object
      required: [id, approved, decided_at]
      description: |
        Payload of the `resolved` event on `GET /v1/action-approvals/watch`.
        Carries the user's verdict so the webapp can drop the matching
        pending card without re-fetching the list.
      properties:
        id:
          type: string
          description: ID of the pending approval the decision resolved.
        approved:
          type: boolean
        reason:
          type: string
          description: Empty for the approve path; user-supplied commentary on deny.
        decided_at:
          type: string
          format: date-time

    ActionRequires:
      type: object
      properties:
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/ActionRequiresConnector"

    ActionRequiresConnector:
      type: object
      required: [name, version, hash, capabilities]
      properties:
        name:
          type: string
          description: Connector FQN per ADR-0002 (e.g. "github://aileron/slack").
        version:
          type: string
          description: Pinned SemVer of the connector.
        hash:
          type: string
          description: Content hash of the connector binary plus its manifest.
        capabilities:
          type: array
          items:
            type: string
          description: |
            The action's declared subset of operations on the connector. Per
            ADR-0003, calls outside this subset are denied at the action
            boundary even when the connector permits the operation.

    ActionMatch:
      type: object
      required: [intent]
      properties:
        intent:
          type: string
          description: Canonical phrase the runtime matches against agent intent.

    ActionInput:
      type: object
      required: [name, type, description]
      properties:
        name:
          type: string
          description: Argument identifier matching `^[a-z][a-z0-9_]*$`.
        type:
          type: string
          enum: [string, integer, number, boolean]
          description: JSON Schema primitive type.
        required:
          type: boolean
          description: |
            Defaults to true when omitted. Set false to mark the argument
            as optional in the LLM-facing parameter schema.
        description:
          type: string
          description: |
            Field-level prose surfaced to the LLM in the
            `parameters.properties[name].description` slot.

    ActionExecuteStep:
      type: object
      required: [id, connector, op]
      properties:
        id:
          type: string
        connector:
          type: string
        op:
          type: string
        idempotent:
          type: boolean
        inputs:
          type: object
          additionalProperties: true

    ActionLoadError:
      type: object
      description: |
        A structured error describing a single file in the actions directory
        that failed to parse or validate, per ADR-0010. Loading is
        non-fatal — files that load successfully appear in `items`; failed
        files appear here so callers can surface a precise message.
      required: [class, message, file]
      properties:
        class:
          type: string
          description: Canonical failure class (e.g. parse_error, validation_error).
        message:
          type: string
        file:
          type: string
          description: Absolute path of the offending file.
        line:
          type: integer
          description: Line within the file where the error was detected; 0 when unknown.
        boundary:
          type: string
          description: Which layer produced the error (always "action" for load failures).

    ActionListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Action"
        load_errors:
          type: array
          items:
            $ref: "#/components/schemas/ActionLoadError"

    ActionRunRequest:
      type: object
      description: |
        Arguments for synchronously executing an installed action. The
        `args` map is passed to the action's executor after validation
        against the action's declared `inputs`.
      properties:
        args:
          type: object
          additionalProperties: true
          description: Per-call arguments matching the action's declared inputs.

    ActionRunResponse:
      type: object
      description: |
        Successful result from synchronously executing an action.
        Action-side failures are returned as a 4xx/5xx FailureEnvelope
        instead of this shape, so a 200 response always carries a
        successful payload.
      required: [audit_id]
      properties:
        audit_id:
          type: string
          description: |
            Audit log ID for this execution per ADR-0010. Always present
            so callers can cross-reference into the audit log.
        result:
          type: string
          description: |
            Action output payload — the same Content the LLM observes
            as a tool result when the action runs through the gateway's
            intercept path. Typically a JSON document; may be plain
            prose for actions whose output is naturally a sentence.

    Binding:
      type: object
      description: |
        A capability binding mapping a connector's declared credential
        capability to a concrete vault entry, per ADR-0006. The same
        `name` string is the vault path the runtime resolves at
        credential-mediation time.
      required: [name, kind, service, identity, connector_fqn, created_at]
      properties:
        name:
          type: string
          description: Full binding name in `<kind>/<service>/<identity>` form.
        kind:
          type: string
          description: Credential kind (e.g. `api_key`, `oauth2`). Matches the connector manifest's `[capabilities.credential].kind`.
        service:
          type: string
          description: Service identifier (e.g. `slack`, `linear`).
        identity:
          type: string
          description: User-chosen handle distinguishing variants of the same kind+service (e.g. `work`, `personal`).
        scope:
          type: string
          description: Optional scope string copied from the connector manifest at setup time.
        connector_fqn:
          type: string
          description: FQN of the connector this binding was created for.
        account:
          type: string
          description: Human-readable account label derived from credential metadata when available.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: Last time the runtime resolved this binding for an action invocation.
        last_refreshed_at:
          type: string
          format: date-time
          nullable: true
          description: Reserved for OAuth refresh tracking (#388); always null for `api_key`.
        refresh_token_present:
          type: boolean
          description: Reserved for OAuth refresh tracking (#388); always false for `api_key`.
        status:
          type: string
          enum: [active, stale, revoked]
          description: Coarse health flag. v1 always reports `active` for present bindings.

    BindingListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Binding"

    BindingSource:
      type: object
      description: |
        Per-binding credential source. v1 supports only `api_key`. Setting
        `kind: oauth2` returns a structured `400` referencing #388.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [api_key, oauth2]
          description: |
            Credential kind. Must match the connector manifest's declared
            `[capabilities.credential].kind` for the requested capability.
        value:
          type: string
          description: |
            Raw credential bytes (e.g. the API key). Required when `kind`
            is `api_key`. The runtime stores this encrypted in the vault.

    BindingSetupRequest:
      type: object
      required: [connector_fqn, bindings]
      properties:
        connector_fqn:
          type: string
          description: |
            Fully-qualified connector name (e.g. `github://aileron/slack`).
            The connector must already be installed.
        bindings:
          type: array
          minItems: 1
          items:
            type: object
            required: [identity, source]
            properties:
              identity:
                type: string
                description: |
                  User-chosen handle for this binding. Combined with the
                  connector's declared kind and service to form the
                  full binding name `<kind>/<service>/<identity>`.
              service:
                type: string
                description: |
                  Optional service override. Defaults to the service
                  segment derived from the connector FQN's host.
              source:
                $ref: "#/components/schemas/BindingSource"
              account:
                type: string
                description: Optional human-readable account label.
        skip_existing:
          type: boolean
          default: true
          description: |
            When true (default), bindings whose name already exists are
            skipped silently and reported in the response's `skipped`
            list. When false, the entire request fails with `409 Conflict`
            on the first existing binding.

    BindingSetupResponse:
      type: object
      required: [created]
      properties:
        created:
          type: array
          items:
            $ref: "#/components/schemas/Binding"
        skipped:
          type: array
          items:
            type: string
          description: Names of bindings that already existed (only populated when `skip_existing` was true).

    RebindRequest:
      type: object
      required: [source]
      properties:
        source:
          $ref: "#/components/schemas/BindingSource"

    OAuth2InitRequest:
      type: object
      required: [connector_fqn, identity]
      properties:
        connector_fqn:
          type: string
          description: |
            Fully-qualified connector name. Connector must be installed
            and must declare `[capabilities.credential] kind = "oauth2"`.
        identity:
          type: string
          description: |
            User-chosen handle for the new binding (e.g. `work`,
            `personal`). Combined with the connector's declared kind
            and service to form the full binding name.
        service:
          type: string
          description: |
            Optional service override. Defaults to the service segment
            derived from the connector FQN's repo segment.
        account:
          type: string
          description: Optional human-readable account label.

    OAuth2InitResponse:
      type: object
      required: [session_id, authorize_url, redirect_uri]
      properties:
        session_id:
          type: string
          description: |
            Opaque token the caller passes back to oauth2/finish.
            Server-side state (PKCE verifier, expected state value)
            is keyed by this id; TTL is 10 minutes.
        authorize_url:
          type: string
          description: |
            URL the caller should direct the user's browser to. Already
            includes client_id, redirect_uri, response_type=code,
            scope, state, code_challenge, and code_challenge_method=S256.
        redirect_uri:
          type: string
          description: |
            Loopback URL the caller must serve to capture the OAuth
            callback (e.g. `http://localhost:54321/callback`). The
            server has already chosen a free port and embedded the
            URI in `authorize_url`.

    OAuth2FinishRequest:
      type: object
      required: [session_id, code, state]
      properties:
        session_id:
          type: string
          description: The session id returned by oauth2/init.
        code:
          type: string
          description: |
            Authorization code captured from the OAuth callback.
        state:
          type: string
          description: |
            State token captured from the OAuth callback. Server
            compares against the session's stored state and rejects
            on mismatch (CSRF protection).

    ExecutionGrant:
      type: object
      required: [grant_id, intent_id, status, expires_at]
      properties:
        grant_id:
          type: string
        intent_id:
          type: string
        connector_id:
          type: string
        status:
          type: string
          enum: [active, consumed, revoked, expired]
        bounded_parameters:
          type: object
          additionalProperties: true
        capability:
          type: object
          additionalProperties: true
          description: Durable signed grant capability issued from the approved grant scope.
        expires_at:
          type: string
          format: date-time
        escrow_policy:
          type: string
          enum: [none, session, escrowed]
          default: none
          description: |
            How credentials are managed for this grant.
            - none: no TEE (credentials decrypted in host process)
            - session: credentials sent to TEE per-execution (real-time only)
            - escrowed: credentials escrowed inside TEE for async/scheduled use

    ExecutionRunRequest:
      type: object
      required: [grant_id]
      properties:
        grant_id:
          type: string
        override_parameters:
          type: object
          additionalProperties: true

    ExecutionRunResponse:
      type: object
      required: [execution_id, status]
      properties:
        execution_id:
          type: string
        status:
          type: string
          enum: [accepted, running]
        accepted_at:
          type: string
          format: date-time

    Execution:
      type: object
      required: [execution_id, intent_id, status, started_at]
      properties:
        execution_id:
          type: string
        intent_id:
          type: string
        connector_id:
          type: string
        status:
          type: string
          enum: [accepted, running, succeeded, failed, cancelled]
        output:
          type: object
          additionalProperties: true
        receipt_ref:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true

    ExecutionCallbackRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [running, succeeded, failed, cancelled]
        output:
          type: object
          additionalProperties: true
        receipt_ref:
          type: string
        error_message:
          type: string

    FundingSource:
      type: object
      required: [funding_source_id, workspace_id, type, name, status]
      properties:
        funding_source_id:
          type: string
        workspace_id:
          type: string
        type:
          type: string
          enum: [virtual_card_pool, budget, fiat_account_ref, lightning_wallet_ref, btc_wallet_ref, stored_balance]
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        currency:
          type: string
        spending_controls:
          type: object
          properties:
            max_single_transaction:
              $ref: "#/components/schemas/Money"
            allowed_merchants:
              type: array
              items:
                type: string
            allowed_categories:
              type: array
              items:
                type: string
        metadata:
          type: object
          additionalProperties: true

    CreateFundingSourceRequest:
      type: object
      required: [workspace_id, type, name]
      properties:
        workspace_id:
          type: string
        type:
          type: string
          enum: [virtual_card_pool, budget, fiat_account_ref, lightning_wallet_ref, btc_wallet_ref, stored_balance]
        name:
          type: string
        currency:
          type: string
        spending_controls:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true

    FundingSourceListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FundingSource"
        pagination:
          $ref: "#/components/schemas/Pagination"

    CredentialReference:
      type: object
      required: [credential_id, workspace_id, type, name, vault_path]
      properties:
        credential_id:
          type: string
        workspace_id:
          type: string
        type:
          type: string
          enum: [api_key, oauth_refresh_token, service_account, webhook_secret, custom]
        name:
          type: string
        vault_path:
          type: string
        environment:
          type: string
        metadata:
          type: object
          additionalProperties: true

    CreateCredentialRequest:
      type: object
      required: [workspace_id, type, name, vault_path]
      properties:
        workspace_id:
          type: string
        type:
          type: string
          enum: [api_key, oauth_refresh_token, service_account, webhook_secret, custom]
        name:
          type: string
        vault_path:
          type: string
        environment:
          type: string
        metadata:
          type: object
          additionalProperties: true

    CredentialListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CredentialReference"
        pagination:
          $ref: "#/components/schemas/Pagination"

    TraceEvent:
      type: object
      required: [event_id, event_type, actor, timestamp]
      properties:
        event_id:
          type: string
        event_type:
          type: string
        actor:
          $ref: "#/components/schemas/ActorRef"
        payload:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time

    Trace:
      type: object
      required: [trace_id, intent_id, events]
      properties:
        trace_id:
          type: string
        intent_id:
          type: string
        workspace_id:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/TraceEvent"

    TraceListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Trace"
        pagination:
          $ref: "#/components/schemas/Pagination"

    AnalyticsSummary:
      type: object
      properties:
        totals:
          type: object
          properties:
            intents: { type: integer }
            approvals_requested: { type: integer }
            approvals_granted: { type: integer }
            denials: { type: integer }
            executions_succeeded: { type: integer }
            executions_failed: { type: integer }
        spend:
          type: object
          properties:
            total_minor_units: { type: integer }
            currency: { type: string }
        approval_latency_ms:
          type: object
          properties:
            p50: { type: integer }
            p95: { type: integer }
        by_risk_level:
          type: object
          additionalProperties:
            type: integer

    # --- Auth & Account schemas ---

    Enterprise:
      type: object
      required: [id, name, slug, plan, billing_email, created_at, updated_at]
      properties:
        id:
          type: string
          examples: [ent_abc123]
        name:
          type: string
        slug:
          type: string
          description: URL-friendly unique identifier
        plan:
          type: string
          enum: [free, pro, enterprise]
        personal:
          type: boolean
          default: false
          description: True for single-user personal accounts (e.g. Gmail sign-in)
        billing_email:
          type: string
          format: email
        sso_required:
          type: boolean
          default: false
        allowed_auth_providers:
          type: array
          items:
            type: string
          description: Restrict sign-in to these providers. Empty means all allowed.
        allowed_email_domains:
          type: array
          items:
            type: string
          description: Restrict sign-in to these email domains. Empty means all allowed.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    User:
      type: object
      description: |
        A user account. The id is an opaque surrogate key (usr_ + UUID). Email is
        the stable logical identity used to deduplicate across OAuth providers.
      required: [id, enterprise_id, email, display_name, role, status, auth_providers, has_password, created_at, updated_at]
      properties:
        id:
          type: string
          description: Opaque surrogate key — immutable, never changes
          examples: [usr_abc123]
        enterprise_id:
          type: string
        email:
          type: string
          format: email
          description: Unique email — the stable identity across OAuth providers
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
        role:
          type: string
          enum: [owner, admin, member]
        status:
          type: string
          enum: [active, pending_verification, invited, suspended]
        auth_providers:
          type: array
          items:
            $ref: "#/components/schemas/UserAuthProviderLink"
          description: Connected identity providers for this user
        has_password:
          type: boolean
          description: Whether the user has a password set for email/password login
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserAuthProviderLink:
      type: object
      required: [provider, connected_at]
      properties:
        provider:
          type: string
          description: "Auth provider name (google, github, okta, saml, etc.)"
        connected_at:
          type: string
          format: date-time

    RefreshTokenRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Refresh token (alternatively sent via httpOnly cookie)

    RefreshTokenResponse:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string

    LogoutResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [logged_out]

    UpdateUserRequest:
      type: object
      properties:
        display_name:
          type: string

    UpdateEnterpriseRequest:
      type: object
      properties:
        name:
          type: string
        billing_email:
          type: string
          format: email
        sso_required:
          type: boolean
        allowed_auth_providers:
          type: array
          items:
            type: string
          description: Restrict sign-in to these providers. Empty array means all allowed.
        allowed_email_domains:
          type: array
          items:
            type: string
          description: Restrict sign-in to these email domains. Empty array means all allowed.

    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        display_name:
          type: string
          description: Defaults to the email username if omitted

    SignupResponse:
      type: object
      required: [user_id, status, message]
      properties:
        user_id:
          type: string
        status:
          type: string
          enum: [pending_verification]
        message:
          type: string

    VerifyEmailRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          description: 6-digit verification code

    VerifyEmailResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [verified]
        message:
          type: string

    EmailLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    ConnectedAccount:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        user_id:
          type: string
          readOnly: true
        provider:
          type: string
          enum: [gmail, google_calendar, outlook, microsoft_calendar]
          readOnly: true
        external_user_id:
          type: string
          readOnly: true
          description: Provider-specific user identifier (e.g. email for Gmail, username for GitHub, user ID for Slack)
        scopes:
          type: array
          items:
            type: string
          readOnly: true
          description: OAuth scopes granted to Aileron
        status:
          type: string
          enum: [active, expired, revoked]
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    SetPassphraseRequest:
      type: object
      required: [salt, kek_verification]
      properties:
        salt:
          type: string
          format: byte
          description: Base64-encoded 16-byte Argon2id salt generated by the client
        kek_verification:
          type: string
          format: byte
          description: Verification constant encrypted with the client-derived KEK (base64)

    PassphraseVerificationResponse:
      type: object
      required: [has_passphrase]
      properties:
        has_passphrase:
          type: boolean
          description: Whether the user has set a vault passphrase
        kek_verification:
          type: string
          format: byte
          description: Encrypted verification blob for client-side decryption (omitted when no passphrase is set)

    PassphraseSaltResponse:
      type: object
      required: [has_passphrase]
      properties:
        has_passphrase:
          type: boolean
          description: Whether the user has set a vault passphrase
        salt:
          type: string
          format: byte
          description: Base64-encoded Argon2id salt (omitted when no passphrase is set)

    UnlockVaultRequest:
      type: object
      required: [kek]
      properties:
        kek:
          type: string
          format: byte
          description: Base64-encoded 32-byte KEK derived from passphrase via Argon2id

    VaultStatusResponse:
      type: object
      required: [locked, has_passphrase]
      properties:
        locked:
          type: boolean
          description: Whether the vault is currently locked (no active KEK session)
        has_passphrase:
          type: boolean
          description: Whether the user has set a vault passphrase
        expires_at:
          type: string
          format: date-time
          description: When the current KEK session expires (omitted when locked)

    TeeStatus:
      type: object
      required: [enabled, provider]
      properties:
        enabled:
          type: boolean
          description: Whether a TEE provider is configured
        provider:
          type: string
          enum: [none, local, confidential-space]
          description: The active TEE provider
        attested:
          type: boolean
          description: Whether the enclave has been attested
        session_active:
          type: boolean
          description: Whether an active session exists with the enclave
        session_expires_at:
          type: string
          format: date-time
          description: When the current session expires
        expected_identity:
          type: object
          description: Expected enclave identity pins configured by the server and intended for browser/client verification
          properties:
            image_digest:
              type: string
              description: Expected container image digest (e.g. "sha256:abc...")
            project_id:
              type: string
              description: Expected GCP project ID that owns the enclave workload
        attestation_claims:
          type: object
          description: Verified attestation claims from the TEE (present only when attested)
          properties:
            image_digest:
              type: string
              description: Container image digest (e.g. "sha256:abc...")
            project_id:
              type: string
              description: GCP project ID that owns the enclave workload
            issuer:
              type: string
              description: Token issuer (e.g. "https://accounts.google.com")
            hwmodel:
              type: string
              description: Hardware security model (e.g. "GCP_AMD_SEV")
            issued_at:
              type: string
              format: date-time
              description: When the attestation token was issued
            expires_at:
              type: string
              format: date-time
              description: When the attestation token expires

    TeeAttestationRequest:
      type: object
      properties:
        audience:
          type: string
          description: Expected audience for the attestation token

    TeeAttestationResponse:
      type: object
      required: [nonce, token, public_key]
      properties:
        nonce:
          type: string
          format: byte
          description: Random nonce used for attestation freshness
        token:
          type: string
          description: Attestation evidence (OIDC JWT for Confidential Space, "dev-ok" for local)
        public_key:
          type: string
          format: byte
          description: Enclave's ephemeral ECDH public key (base64)

    TeeSessionRequest:
      type: object
      required: [encrypted_kek, client_public_key]
      properties:
        encrypted_kek:
          type: string
          format: byte
          description: KEK encrypted with the ECDH-derived shared secret (opaque to server)
        client_public_key:
          type: string
          format: byte
          description: Client's ephemeral ECDH public key for enclave key exchange

    TeeSessionResponse:
      type: object
      required: [session_id]
      properties:
        session_id:
          type: string
          description: Session identifier
        expires_at:
          type: string
          format: date-time
          description: When the session expires
        escrowed_count:
          type: integer
          description: Number of credentials auto-escrowed into TEE

    # --- Gateway: OpenAI Chat Completions shape ---
    #
    # Schemas mirror the OpenAI Chat Completions wire format with
    # additionalProperties: true so unmodelled fields pass through
    # untouched. Only the structurally significant fields (model,
    # messages, tools, tool_calls) are explicitly modelled because they
    # are the seams Aileron operates on (tool augmentation, name
    # collisions, tool-call interception).

    ChatCompletionRequest:
      type: object
      additionalProperties: true
      required: [model, messages]
      properties:
        model:
          type: string
          description: Model identifier passed to the upstream provider.
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatCompletionMessage"
        tools:
          type: array
          description: |
            Agent-declared tools. Aileron preserves these unchanged and
            appends installed actions to the array before forwarding
            upstream.
          items:
            $ref: "#/components/schemas/ChatCompletionTool"
        tool_choice:
          description: Passed through to the upstream provider unchanged.
        stream:
          type: boolean
          description: |
            When true, the response is `text/event-stream`. Aileron
            buffers tool-call deltas for augmented actions until the call
            is structurally complete.

    ChatCompletionMessage:
      type: object
      additionalProperties: true
      required: [role]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool, developer]
        content:
          description: |
            String or array of content parts; shape follows the upstream
            provider's contract. Aileron does not require parsing.
        name:
          type: string
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/ChatCompletionToolCall"
        tool_call_id:
          type: string
          description: Required on `tool` role messages.

    ChatCompletionTool:
      type: object
      additionalProperties: true
      required: [type]
      properties:
        type:
          type: string
          enum: [function]
        function:
          $ref: "#/components/schemas/ChatCompletionFunctionDef"

    ChatCompletionFunctionDef:
      type: object
      additionalProperties: true
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        parameters:
          type: object
          additionalProperties: true
          description: JSON Schema for the function's parameters.

    ChatCompletionToolCall:
      type: object
      additionalProperties: true
      required: [id, type, function]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [function]
        function:
          type: object
          required: [name, arguments]
          properties:
            name:
              type: string
            arguments:
              type: string
              description: JSON-encoded argument object.

    ChatCompletionResponse:
      type: object
      additionalProperties: true
      required: [id, object, choices, model]
      properties:
        id:
          type: string
        object:
          type: string
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ChatCompletionChoice"
        usage:
          type: object
          additionalProperties: true

    ChatCompletionChoice:
      type: object
      additionalProperties: true
      required: [index, message, finish_reason]
      properties:
        index:
          type: integer
        message:
          $ref: "#/components/schemas/ChatCompletionMessage"
        finish_reason:
          type: string

    # --- Gateway: Anthropic Messages shape ---

    MessagesRequest:
      type: object
      additionalProperties: true
      required: [model, messages, max_tokens]
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicMessage"
        max_tokens:
          type: integer
        system:
          description: |
            System prompt; string or array of content blocks (Anthropic
            shape).
        tools:
          type: array
          description: |
            Agent-declared tools. Aileron preserves these unchanged and
            appends installed actions to the array before forwarding
            upstream (Anthropic shape).
          items:
            $ref: "#/components/schemas/AnthropicTool"
        tool_choice:
          description: Passed through to the upstream provider unchanged.
        stream:
          type: boolean

    AnthropicMessage:
      type: object
      additionalProperties: true
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          description: |
            String or array of content blocks (`text`, `tool_use`,
            `tool_result`, `image`, ...). Shape follows Anthropic's
            Messages contract.

    AnthropicTool:
      type: object
      additionalProperties: true
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        input_schema:
          type: object
          additionalProperties: true
          description: JSON Schema for the tool's input.

    MessagesResponse:
      type: object
      additionalProperties: true
      required: [id, type, role, content, model]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [message]
        role:
          type: string
          enum: [assistant]
        content:
          type: array
          items:
            type: object
            additionalProperties: true
        model:
          type: string
        stop_reason:
          type: string
        stop_sequence:
          type: string
        usage:
          type: object
          additionalProperties: true
