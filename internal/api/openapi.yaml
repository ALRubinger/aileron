  /v1/sync:
    post:
      tags: [Sync]
      summary: Reconcile installed actions with their declared connector dependencies
      description: |
        Per ADR-0004 §"sync, check, status": walks every action in
        `~/.aileron/actions/`, collects the unique connector references
        each one declares in `[[requires.connectors]]`, and runs the
        install pipeline for any connector that isn't already in the
        cstore.

        Also enumerates the `[capabilities.credential]` block of every
        installed connector and cross-references it against existing
        bindings — capabilities with no matching binding are surfaced
        as "unbound" so the operator knows what they still need to set
        up with `aileron binding setup <FQN>`.

        Idempotent: re-running with no source changes is a no-op
        (every connector already installed → empty `installed`; every
        capability already bound → empty `unbound`).

        Per-connector install failures (resolver/fetcher/verifier
        errors) are surfaced inside `install_failures` and do not
        abort the sweep — the same "offline-failing per connector"
        contract that `GET /v1/connectors/check` honors.
      operationId: sync
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
      responses:
        "200":
          description: Sync completed (per-connector install failures inside `install_failures`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/connectors/check:
    get:
      tags: [Connectors]
      summary: Check installed connectors for newer versions
      description: |
        Walks every (FQN, version) pair in the cstore index and queries
        each connector's source for newer versions. Read-only — does
        not mutate the store.

        Per the ADR-0004 acceptance test "offline-failing per
        connector", a single source that's unreachable does not abort
        the sweep: that result carries an `error` and the response
        still lists results for every other connector.

        By default pre-release versions (SemVer 2.0
        `<major>.<minor>.<patch>-<suffix>`) are excluded from
        `available_versions` and the `latest_version` selection. Set
        `include_prerelease=true` to include them.

        Today only the `github://` scheme has a wired version lister.
        Connectors using `gitlab://` or `hub://` schemes will surface
        a per-connector "not yet implemented" error until those
        listers ship — they don't break the rest of the check.
      operationId: checkConnectors
      parameters:
        - name: include_prerelease
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include pre-release versions when computing the latest version.
      responses:
        "200":
          description: Check completed (per-connector errors are inside `results[].error`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorsCheckResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/connectors/install:
    post:
      tags: [Connectors]
      summary: Install a connector into the content-addressed store
      description: |
        Runs the install pipeline (per ADR-0004) for the given FQN+version
        reference: resolve fetch URL → download tarball → verify signature
        against keys associated with the FQN authority → compute SHA-256
        of `binary || manifest` → match against `expected_hash` when
        supplied → atomic rename into `~/.aileron/store/connectors/sha256/<hash>/`
        → update the FQN+version → hash index.

        Per ADR-0010, every failure produces a structured error: hash
        mismatch, signature failure, malformed tarball, fetch failure,
        unknown scheme, etc. Nothing is written to the store on failure.
      operationId: installConnector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallConnectorRequest"
      responses:
        "200":
          description: Installation succeeded (the entry was already present)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledConnector"
        "201":
          description: Installation succeeded (new entry written to the store)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledConnector"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Install pipeline failed (hash mismatch, signature failure, malformed tarball, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/actions/install:
    post:
      tags: [Actions]
      summary: Install an action template into the user's actions directory
      description: |
        Runs the action install pipeline (parallels ADR-0004's connector
        install) for the given FQN+version reference: resolve fetch URL →
        download tarball → optionally verify ed25519 signature against the
        publisher's keys → extract `action.md` → parse + validate → confirm
        every `[[requires.connectors]]` entry is already installed in the
        cstore → copy to `~/.aileron/actions/<name>.md`.

        Per ADR-0003 the user owns the file post-install; this endpoint is
        equivalent to `aileron action add <FQN>@<version>`. Refuses to
        clobber an existing action with the same name unless `force: true`.

        v1 makes action signing optional: an action tarball with no
        `signature.sig` installs (with a debug log) so publishers can ship
        templates before signing infrastructure is wired. Mandatory
        signing lands with the install consent flow (#363).

        On any failure the on-disk state is unchanged. Structured failures
        per ADR-0010: `binding_required` is not raised here; signature
        failures bubble as `signature_failure`; missing connector deps
        bubble as `connectors_missing` with `error.details[]` listing the
        FQN, version, and hash of each missing connector. Setting
        `auto_install_connectors: true` on the request transparently
        installs the missing connectors before the action install
        proceeds.
      operationId: installAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallActionRequest"
      responses:
        "200":
          description: Action was already present (no overwrite)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledAction"
        "201":
          description: Action installed (new file written)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstalledAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: |
            Install pipeline failed. `error.code` is one of
            `signature_failure`, `connectors_missing` (with structured
            `MissingConnector` entries in `details[]`), `validation_error`,
            or any other structured class from the underlying connector
            install pipeline (e.g. `hash_mismatch`, `fetch_failed`) when
            `auto_install_connectors: true` triggers an implicit
            connector install that fails.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/actions:
    get:
      tags: [Actions]
      summary: List installed actions
      description: |
        Lists actions installed in the user's `~/.aileron/actions/` directory
        (per ADR-0003). Each entry carries identity and dependency metadata
        without the full Markdown body — use `GET /v1/actions/{name}` for the
        complete manifest.

        Per ADR-0010, files that fail to parse or validate at load time are
        not silently dropped: the `load_errors` field surfaces a structured
        error per offending file with the file path and (when known) the
        line number where parsing failed.
      operationId: listActions
      responses:
        "200":
          description: Installed actions plus any per-file load errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/actions/{name}:
    get:
      tags: [Actions]
      summary: Get an installed action by name
      description: |
        Returns the full parsed manifest of an installed action plus its
        Markdown body. The body is the LLM-facing function description per
        ADR-0001 and ADR-0003.
      operationId: getAction
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Action manifest and body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/actions/{name}/run:
    post:
      tags: [Actions]
      summary: Execute an installed action synchronously
      description: |
        Synchronously executes an installed action by name with the
        supplied arguments. Used by `cmd/aileron-mcp` to route MCP
        `tools/call` invocations to Aileron's action runtime when MCP is
        the canonical surface for action exposure.

        Per ADR-0010 and ADR-0011, the runtime requires an unlocked
        vault before any action can resolve its bound credentials; calls
        against a locked vault fail with `binding_required`.

        Action-side failures (capability denied, binding required,
        connector runtime error, etc.) are returned as a 4xx/5xx
        FailureEnvelope per ADR-0010 — callers should branch on the
        envelope's `class` field to decide how to surface the failure
        to their caller. The 200 response carries a successful Result
        whose `result` is the action's output payload.
      operationId: runAction
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRunRequest"
      responses:
        "200":
          description: Action executed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          description: Vault locked or required binding missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureEnvelope"
        "500":
          description: Connector or runtime error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureEnvelope"
        "502":
          description: Network or external API error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureEnvelope"

  /v1/bindings:
    get:
      tags: [Bindings]
      summary: List capability bindings
      description: |
        Lists every binding the user has created. Per ADR-0011, listing is
        plaintext metadata — the credential bytes are not decrypted and the
        endpoint does not require the vault to be unlocked.

        Optional filters narrow the result by connector or kind. When both
        are supplied, the response identifies which bindings would be
        considered for that connector at execution time (the same set
        `Resolve` walks).
      operationId: listBindings
      parameters:
        - name: connector_fqn
          in: query
          required: false
          schema:
            type: string
          description: Restrict to bindings created for the given connector FQN.
        - name: kind
          in: query
          required: false
          schema:
            type: string
          description: Restrict to bindings of the given credential kind (e.g. `api_key`).
      responses:
        "200":
          description: List of bindings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/bindings/{name}:
    get:
      tags: [Bindings]
      summary: Inspect a single binding
      description: |
        Returns plaintext metadata for the named binding. Does not require
        an unlocked vault. The credential bytes are never returned.
      operationId: getBinding
      parameters:
        - $ref: "#/components/parameters/BindingName"
      responses:
        "200":
          description: Binding metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Binding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Bindings]
      summary: Revoke a binding
      description: |
        Deletes the binding's vault entry. Subsequent action invocations
        that needed this binding will fail with `binding_required` until a
        replacement is created via `POST /v1/bindings/setup`.
      operationId: revokeBinding
      parameters:
        - $ref: "#/components/parameters/BindingName"
      responses:
        "204":
          description: Binding revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/VaultLocked"

  /v1/bindings/setup:
    post:
      tags: [Bindings]
      summary: Create one or more bindings for a connector
      description: |
        Walks the connector's declared `[capabilities.credential]` blocks
        and creates a binding for each requested capability. v1 accepts
        only `api_key` sources; OAuth sources are rejected with `400` per
        the deferral noted in #388 — use the OAuth-binding flow once it
        lands.

        The vault must be unlocked; locked vaults return `423`.
      operationId: setupBindings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindingSetupRequest"
      responses:
        "201":
          description: Bindings created (or already present and skipped)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingSetupResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
          $ref: "#/components/responses/VaultLocked"

  /v1/bindings/setup/oauth2/init:
    post:
      tags: [Bindings]
      summary: Begin an OAuth2 binding flow
      description: |
        Starts the OAuth2 dance for a connector that declares
        `[capabilities.credential] kind = "oauth2"`. The server reads
        the connector's installed manifest, generates a PKCE verifier
        + challenge + state, holds them in an in-memory session keyed
        by an opaque session_id (TTL 10 minutes), and returns the
        authorize URL the caller should direct the user's browser to.

        The PKCE verifier never crosses the wire; only the challenge
        appears in the authorize URL. The session_id is the handle the
        caller uses to complete the flow via `oauth2/finish`.

        The caller is responsible for opening the user's browser to
        `authorize_url` and serving the loopback callback at
        `redirect_uri`. The connector's OAuth app must register
        `http://localhost` as a redirect URI (loopback-only in v1 per
        ADR-0002).
      operationId: initOAuth2Binding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuth2InitRequest"
      responses:
        "200":
          description: OAuth flow initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuth2InitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Connector does not declare an OAuth2 capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/bindings/setup/oauth2/finish:
    post:
      tags: [Bindings]
      summary: Complete an OAuth2 binding flow
      description: |
        Exchanges an authorization code for tokens and persists the
        resulting OAuth2 binding. Looks up the session created by
        `oauth2/init` (verifier + state stored server-side), validates
        the returned `state`, posts a code-exchange request to the
        connector's `token_url`, and writes the resulting tokens as a
        binding in the user's vault.

        Returns the standard `Binding` envelope on success. The
        session is cleared on success, on validation failure, and on
        TTL expiry (10 minutes).

        The vault must be unlocked.
      operationId: finishOAuth2Binding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuth2FinishRequest"
      responses:
        "201":
          description: Binding created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Binding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Session not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Token exchange failed at the provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "423":
          $ref: "#/components/responses/VaultLocked"

  /v1/bindings/{name}/rebind:
    post:
      tags: [Bindings]
      summary: Replace the credential value of an existing binding
      description: |
        Keeps the binding's identity (name, connector, kind, scope) and
        replaces the underlying credential bytes. Used after a key
        rotation. v1 accepts only `api_key` sources.

        The vault must be unlocked; locked vaults return `423`.
      operationId: rebindBinding
      parameters:
        - $ref: "#/components/parameters/BindingName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RebindRequest"
      responses:
        "200":
          description: Binding rebound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Binding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "423":
