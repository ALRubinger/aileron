        "501":
          description: TEE not enabled

  /v1/chat/completions:
    post:
      tags: [Gateway]
      summary: OpenAI-compatible chat completions endpoint
      description: |
        Aileron's transparent dual-protocol LLM gateway. Drop-in replacement
        for `https://api.openai.com/v1/chat/completions`: an agent that
        worked unchanged against OpenAI's endpoint works unchanged when its
        base URL is pointed at this server.

        Behavior, ratified by ADR-0008 (intent matching):

        - **Tool augmentation.** Aileron reads the user's installed actions
          from `~/.aileron/actions/`, derives a function definition for each
          (name, description from the action's Markdown body, parameter
          schema from declared inputs), and appends them to the request's
          `tools` array before forwarding upstream. The agent's declared
          tools are preserved unchanged — augmentation is additive only.
        - **Tool name collisions.** When an installed action's name collides
          with an agent-declared tool, the agent's tool wins; Aileron
          renames its action with the reserved `aileron.` prefix in the
          forwarded request. An agent-declared tool whose name already uses
          the `aileron.` prefix is renamed to `agent.<original-name>` and
          a warning is logged.
        - **Tool-call interception.** When the upstream LLM emits a tool
          call whose name matches an Aileron-augmented action, Aileron
          executes the action deterministically (per ADR-0003), constructs
          a `tool` message containing the result, and injects it back into
          the response. Tool calls for agent-declared tools pass through
          unchanged for the agent's host code to execute.
        - **Streaming preservation.** Both streaming (`stream: true`) and
          non-streaming modes are supported. In streaming mode, intermediate
          tool-call deltas for Aileron-augmented actions are buffered until
          the call is structurally complete; partial frames are never
          emitted to the agent. After Aileron executes the action, the
          stream resumes with a synthetic tool-result frame followed by
          the upstream LLM's continuation.

        Authentication: this endpoint forwards the request's `Authorization`
        header to the upstream provider unchanged; Aileron does not require
        its own bearer token. The upstream provider is selected by runtime
        configuration.
      operationId: postChatCompletions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: |
            Chat completion response. Content-Type is
            `text/event-stream` when the request set `stream: true`,
            otherwise `application/json`. Body shape, status code, and
            response headers are forwarded from the upstream provider
            unchanged other than hop-by-hop headers stripped by the
            proxy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-sent event stream of `ChatCompletionStreamChunk`
                  JSON objects (one per `data:` frame), terminated by
                  `data: [DONE]`.
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "502":
          description: |
            Upstream provider request failed (network error, TLS error,
            or unreachable host). Upstream-returned 4xx/5xx statuses
            propagate with their original status code; this 502 is for
            failures Aileron observed before/around the upstream
            transaction. Body is a `FailureEnvelope` per ADR-0010.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureEnvelope"
        "503":
          description: |
            Gateway upstream is not configured for this protocol. Set
            `AILERON_OPENAI_BASE_URL` (or rely on the default
            `https://api.openai.com`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureEnvelope"

  /v1/messages:
    post:
      tags: [Gateway]
      summary: Anthropic-compatible messages endpoint
      description: |
        Aileron's transparent dual-protocol LLM gateway. Drop-in replacement
        for `https://api.anthropic.com/v1/messages`: an agent that worked
        unchanged against Anthropic's endpoint works unchanged when its
        base URL is pointed at this server.

        Behavior matches `/v1/chat/completions` (tool augmentation,
        collisions, tool-call interception, streaming preservation) —
        see that endpoint's description. Differences are
        provider-specific shapes only:

        - Tools are appended to the Anthropic-shape `tools` array
          (`{ name, description, input_schema }`), not the OpenAI-shape
          function-wrapped form.
        - Tool calls arrive and are emitted as `tool_use` content blocks
          on assistant messages; tool results are injected as
          `tool_result` content blocks on user messages, per Anthropic's
          conversation contract.
        - Streaming uses Anthropic's event types (`message_start`,
          `content_block_start`, `content_block_delta`, etc.); buffering
          for Aileron-augmented `tool_use` blocks holds until the block
          is structurally complete.

        Authentication: this endpoint forwards the request's `x-api-key`
        and `anthropic-version` headers to the upstream provider unchanged.
      operationId: postMessages
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessagesRequest"
      responses:
        "200":
          description: |
            Messages response. Content-Type is `text/event-stream` when
            the request set `stream: true`, otherwise `application/json`.
            Body shape, status code, and response headers are forwarded
            from the upstream provider unchanged other than hop-by-hop
            headers stripped by the proxy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagesResponse"
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-sent event stream of Anthropic Messages stream
                  events (`message_start`, `content_block_start`,
                  `content_block_delta`, `content_block_stop`,
                  `message_delta`, `message_stop`).
        "400":
          $ref: "#/components/responses/Failure"
        "401":
          $ref: "#/components/responses/Failure"
        "502":
          description: |
            Upstream provider request failed (network error, TLS error,
            or unreachable host). Upstream-returned 4xx/5xx statuses
            propagate with their original status code; this 502 is for
            failures Aileron observed before/around the upstream
            transaction. Body is a `FailureEnvelope` per ADR-0010.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureEnvelope"
        "503":
          description: |
            Gateway upstream is not configured for this protocol. Set
            `AILERON_ANTHROPIC_BASE_URL` (or rely on the default
            `https://api.anthropic.com`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureEnvelope"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IntentId:
      name: intent_id
      in: path
      required: true
      schema: { type: string }
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema: { type: string }
    PolicyId:
      name: policy_id
      in: path
      required: true
      schema: { type: string }
    ConnectorId:
      name: connector_id
      in: path
      required: true
      schema: { type: string }
    GrantId:
      name: grant_id
      in: path
      required: true
      schema: { type: string }
    ExecutionId:
      name: execution_id
      in: path
      required: true
      schema: { type: string }
    BindingName:
      name: name
      in: path
      required: true
      schema: { type: string }
      description: |
        Full binding name in `<kind>/<service>/<identity>` form (e.g.
        `api_key/linear/team`). The same string is the vault path the
        runtime resolves at credential-mediation time.
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageToken:
      name: page_token
      in: query
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    VaultLocked:
      description: Vault is locked — unlock with POST /v1/users/me/passphrase/unlock
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict with current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Failure:
      description: |
        Structured failure envelope per ADR-0010 (action-execution and
        gateway responses).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailureEnvelope"

  schemas:
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/Jwk"

    Jwk:
      type: object
      required: [kty, kid]
      properties:
        kty:
          type: string
        kid:
          type: string
        alg:
          type: string
        use:
          type: string
        n:
          type: string
        e:
          type: string
        crv:
          type: string
        x:
          type: string
        "y":
          type: string

    HealthResponse:
      type: object
      required: [status, service, version, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        service:
          type: string
        version:
          type: string
        timestamp:
          type: string
          format: date-time

    StatusResponse:
      type: object
      required: [version, vault_state, action_count, connector_count, binding_count]
      description: |
        Operational snapshot returned by `GET /v1/status`. Surfaced
        through the `aileron status` CLI and the `/aileron status`
        agent slash-command. Read-only; safe to poll.
      properties:
        version:
          type: string
          description: Daemon version string (matches `aileron version`).
        commit:
          type: string
          description: Short git commit the daemon was built from. May be empty for unstamped builds.
        listen_addr:
          type: string
          description: |
            Address the daemon is listening on (e.g. `127.0.0.1:54321`).
            Best-effort; empty when the runtime can't introspect its
            own listener (most embedded contexts).
        action_count:
          type: integer
          description: Number of installed actions in `~/.aileron/actions/`.
        connector_count:
          type: integer
          description: |
            Number of connector tarballs in the content-addressed
            store (`~/.aileron/store/connectors/sha256/`).
        binding_count:
          type: integer
          description: |
            Number of credential bindings in the vault. Surfaced as
            metadata-only — the vault doesn't have to be unlocked
            to count them.
        vault_state:
          type: string
          enum: [missing, locked, unlocked, dev]
          description: |
            `missing` — no vault file at the canonical path.
            `locked` — file exists but the daemon hasn't unlocked it.
            `unlocked` — daemon holds the KEK; bindings are resolvable.
            `dev` — daemon is using the in-memory dev-mode vault
            (random per-process KEK; not the persistent file).
        gateway_url:
          type: string
          description: |
            URL of the embedded gateway, when running under
            `aileron launch`. Empty for standalone-server invocations.
        session_id:
          type: string
          description: |
            Launch session id when the daemon is part of an
            `aileron launch` session. Empty otherwise.

    Error:
      type: object
      required: [error]
      description: |
        Generic error envelope used by CRUD endpoints (intents, approvals,
        policies, accounts, auth). Action-execution and gateway endpoints
        use the structured `FailureEnvelope` instead, per ADR-0010.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                additionalProperties: true
            request_id: { type: string }

    FailureEnvelope:
      type: object
      required: [error]
      description: |
        Structured failure envelope ratified by [ADR-0010][adr10] for
        errors returned to the calling action and through it to the
        agent. Used on the gateway endpoints (`/v1/chat/completions`,
        `/v1/messages`) and on action / connector install responses.

        [adr10]: https://docs.withaileron.ai/adr/0010-failure-handling
      properties:
        error:
          type: object
          required: [class, message, retriable, boundary]
          properties:
            class:
              $ref: "#/components/schemas/FailureClass"
            message:
              type: string
              description: |
                Human-readable description; safe to show end users. Does
                not contain credentials or sensitive payload.
            retriable:
              type: boolean
              description: Whether the failure is safe to retry.
            boundary:
              $ref: "#/components/schemas/FailureBoundary"
            audit_id:
              type: string
              description: |
                Reference into the audit log for full context. Stamped
                by the audit recorder before the response is written.
            details:
              type: object
              additionalProperties: true
              description: Class-specific additional fields.

    FailureClass:
      type: string
      description: |
        Closed taxonomy of failure classes per ADR-0010. Adding a value
        requires an ADR amendment.
      enum:
        - capability_denied
        - binding_required
        - binding_failed
        - resource_limit_exceeded
        - connector_runtime_error
        - network_error
        - external_api_error
        - hash_mismatch
        - signature_failure

    FailureBoundary:
      type: string
      description: |
        Layer that produced the failure. The closed set excludes `user`
        which is reserved for post-MVP per-invocation approval flows.
      enum:
        - sandbox
        - connector_manifest
        - action
        - runtime
        - external

    Pagination:
      type: object
      properties:
        next_page_token:
          type: string
          nullable: true

    IntentStatus:
      type: string
      enum: [pending_policy, pending_approval, approved, denied, executing, succeeded, failed, cancelled, expired]

    ApprovalStatus:
      type: string
      enum: [pending, approved, denied, modified, delegated, expired, cancelled]

    PolicyStatus:
      type: string
      enum: [draft, active, archived]

    ConnectorType:
      type: string
      enum: [payments, source_control, cloud, deployment, email, calendar, ticketing, crm, erp, secret_manager, internal_api, custom]

    RiskLevel:
      type: string
      enum: [low, medium, high, critical]

    DecisionDisposition:
      type: string
      enum: [allow, allow_modified, require_approval, deny, require_more_evidence]

    ActorRef:
      type: object
      required: [id, type]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [agent, human, service, connector_runtime]
        display_name: { type: string }

    ActionTarget:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [vendor, repository, environment, api, secret, calendar, email_recipient, ticket, cloud_resource, custom]
        id: { type: string }
        display_name: { type: string }

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          description: Amount in minor units
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3

    Recipient:
      type: object
      required: [email]
      properties:
        name: { type: string }
        email:
          type: string
          format: email

    AttachmentRef:
      type: object
      properties:
        name: { type: string }
        mime_type: { type: string }
        url: { type: string, format: uri }
        storage_ref: { type: string }

    CalendarAttendee:
      type: object
      required: [email]
      properties:
        name: { type: string }
        email:
          type: string
          format: email
        optional:
          type: boolean
          default: false

    LineItem:
      type: object
      required: [description, quantity, unit_amount]
      properties:
        description:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_amount:
          $ref: "#/components/schemas/Money"
        sku:
          type: string

    GitAction:
      type: object
      properties:
        provider:
          type: string
          enum: [github, gitlab, bitbucket, custom]
        repository:
          type: string
        branch:
          type: string
        base_branch:
          type: string
        commit_shas:
          type: array
          items:
            type: string
        files_changed:
          type: array
          items:
            type: string
        pr_title:
          type: string
        pr_body:
          type: string
        labels:
          type: array
          items:
            type: string
        reviewers:
          type: array
          items:
            type: string
        checks_required:
          type: array
          items:
            type: string
        issue_title:
          type: string
        issue_body:
          type: string
        issue_labels:
          type: array
          items:
            type: string
        issue_assignees:
          type: array
          items:
            type: string

    DeployAction:
      type: object
      properties:
        provider:
          type: string
          enum: [kubernetes, vercel, netlify, aws, gcp, azure, flyio, custom]
        service:
          type: string
        environment:
          type: string
        artifact_ref:
          type: string
        image_ref:
          type: string
        cluster:
          type: string
        namespace:
          type: string
        strategy:
          type: string
          enum: [rolling, blue_green, canary, replace, custom]
        rollback_supported:
          type: boolean
        change_ticket_id:
          type: string
        maintenance_window_id:
          type: string

    CloudAction:
      type: object
      properties:
        provider:
          type: string
          enum: [aws, gcp, azure, cloudflare, custom]
        account_id:
          type: string
        region:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        operation:
          type: string
        estimated_cost:
          $ref: "#/components/schemas/Money"
        tags:
          type: object
          additionalProperties:
            type: string

    EmailAction:
      type: object
      properties:
        from:
          $ref: "#/components/schemas/Recipient"
        to:
          type: array
          items:
            $ref: "#/components/schemas/Recipient"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/Recipient"
        bcc:
          type: array
          items:
            $ref: "#/components/schemas/Recipient"
        subject:
          type: string
        body_text:
          type: string
        body_html:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentRef"
        thread_ref:
          type: string
        send_mode:
          type: string
          enum: [send_now, draft_only]

    CalendarAction:
      type: object
      properties:
        provider:
          type: string
          enum: [google_calendar, outlook, custom]
        title:
          type: string
        description:
          type: string
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/CalendarAttendee"
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        timezone:
          type: string
        location:
          type: string
        conference_type:
          type: string
          enum: [none, google_meet, zoom, teams, custom]
        calendar_id:
          type: string
        visibility:
          type: string
          enum: [default, public, private]

    PaymentBeneficiary:
      type: object
      properties:
        name: { type: string }
        email:
          type: string
          format: email
        department: { type: string }

    PaymentAction:
      type: object
      properties:
        vendor_name:
          type: string
        vendor_id:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        merchant_category:
          type: string
        budget_code:
          type: string
        funding_source_id:
          type: string
        payment_instrument_preference:
          type: string
          enum: [virtual_card, ach, wallet, network_proxy, unspecified]
        beneficiary:
          $ref: "#/components/schemas/PaymentBeneficiary"
        line_items:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
        renewal:
          type: boolean
        contract_term:
          type: string
        recurring_interval:
          type: string
          enum: [none, monthly, quarterly, annual]
        merchant_reference:
          type: string

    ProcurementAction:
      type: object
      properties:
        request_type:
          type: string
          enum: [software, travel, equipment, contractor, services, other]
        vendor_name:
          type: string
        amount_estimate:
          $ref: "#/components/schemas/Money"
        justification:
          type: string
        requestor:
          type: string
        cost_center:
          type: string
        legal_review_required:
          type: boolean
        security_review_required:
          type: boolean
        line_items:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"

    DomainAction:
      type: object
      description: |
        Carries action-type-specific fields. Exactly one field must be populated,
        corresponding to the prefix of ActionIntent.type:
          - git.* → git
          - deploy.* → deploy
          - cloud.* → cloud
          - email.* → email
          - calendar.* → calendar
          - payment.* → payment
          - procurement.* → procurement
        The server rejects requests where the populated domain field does not
        match the action type prefix.
      minProperties: 1
      maxProperties: 1
      properties:
        git:
          $ref: "#/components/schemas/GitAction"
        deploy:
          $ref: "#/components/schemas/DeployAction"
        cloud:
          $ref: "#/components/schemas/CloudAction"
        email:
          $ref: "#/components/schemas/EmailAction"
        calendar:
          $ref: "#/components/schemas/CalendarAction"
        payment:
          $ref: "#/components/schemas/PaymentAction"
        procurement:
          $ref: "#/components/schemas/ProcurementAction"

    ActionIntent:
      type: object
      required: [type, summary]
      properties:
        type:
          type: string
          examples:
            - git.pull_request.create
            - git.issue.create
            - git.issue.comment
            - deploy.release
            - cloud.resource.mutate
            - email.send
            - email.draft
            - calendar.event.create
            - payment.charge
            - procurement.request.submit
        summary:
          type: string
        justification:
          type: string
        target:
          $ref: "#/components/schemas/ActionTarget"
        domain:
          $ref: "#/components/schemas/DomainAction"
        metadata:
          type: object
          additionalProperties: true

    IntentContext:
      type: object
      properties:
        environment:
          type: string
          examples: [development, staging, production]
        source_platform:
          type: string
          examples: [openclaw, claude_code, codex, openhands, goose, cline, continue, langgraph, custom]
        source_session_id:
          type: string
        source_trace_id:
          type: string
        ip_address:
          type: string
        risk_hints:
          type: array
          items:
            type: string
        user_present:
          type: boolean
        temporary_grant_id:
          type: string

    CreateIntentRequest:
      type: object
      required: [idempotency_key, agent_id, workspace_id, action]
      properties:
        idempotency_key:
          type: string
        agent_id:
          type: string
        workspace_id:
          type: string
        action:
          $ref: "#/components/schemas/ActionIntent"
        context:
          $ref: "#/components/schemas/IntentContext"
        callback_url:
          type: string
          format: uri
          description: |
            Optional webhook URL. The control plane will POST status updates
            to this URL as the intent progresses through the lifecycle
            (policy evaluated, approval requested, approved/denied, execution
            started, execution completed). This avoids the need for agents
            to poll the GET /v1/intents/{id} endpoint.

    EvidenceItem:
      type: object
      required: [type, value]
      properties:
        type:
          type: string
          enum: [text, link, diff_summary, screenshot_ref, receipt_ref, test_result, change_ticket, artifact_ref, custom]
        label:
          type: string
        value:
          type: string

    AppendEvidenceRequest:
      type: object
      required: [evidence]
      properties:
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceItem"

    PolicyMatch:
      type: object
      properties:
        policy_id: { type: string }
        policy_version: { type: integer }
        rule_id: { type: string }
        explanation: { type: string }

    Decision:
      type: object
      required: [disposition, risk_level]
      properties:
        disposition:
          $ref: "#/components/schemas/DecisionDisposition"
        risk_level:
          $ref: "#/components/schemas/RiskLevel"
        matched_policies:
          type: array
          items:
            $ref: "#/components/schemas/PolicyMatch"
        requires_approval:
          type: boolean
        approval_id:
          type: string
          nullable: true
        execution_grant_id:
          type: string
          nullable: true
        denial_reason:
          type: string
          nullable: true

    IntentEnvelope:
      type: object
      required: [intent_id, status, workspace_id, agent, action, decision, created_at, updated_at]
      properties:
        intent_id:
          type: string
        workspace_id:
          type: string
        status:
          $ref: "#/components/schemas/IntentStatus"
        agent:
          $ref: "#/components/schemas/ActorRef"
        action:
          $ref: "#/components/schemas/ActionIntent"
        context:
          $ref: "#/components/schemas/IntentContext"
        decision:
          $ref: "#/components/schemas/Decision"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceItem"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    IntentListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IntentEnvelope"
        pagination:
          $ref: "#/components/schemas/Pagination"

    ApprovalActor:
      type: object
      required: [principal_id]
      properties:
        principal_id:
          type: string
        display_name:
          type: string
        role:
          type: string
        status:
          type: string
          enum: [pending, approved, denied, delegated]

    Approval:
      type: object
      required: [approval_id, intent_id, status, requested_at, approvers]
      properties:
        approval_id:
          type: string
        intent_id:
          type: string
        workspace_id:
          type: string
        status:
          $ref: "#/components/schemas/ApprovalStatus"
        rationale:
          type: string
        approvers:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalActor"
        expires_at:
          type: string
          format: date-time
          nullable: true
        requested_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        editable_bounds:
          type: object
          additionalProperties: true

    ApprovalListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
        pagination:
          $ref: "#/components/schemas/Pagination"

    ApproveRequest:
      type: object
      properties:
        comment:
          type: string
        approve_once:
          type: boolean
          default: false
        step_up_auth_assertion:
          type: string

    DenyRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
        comment:
          type: string

    ModifyApprovalRequest:
      type: object
      required: [modifications]
      properties:
        comment:
          type: string
        modifications:
          type: object
          additionalProperties: true

    ApprovalActionResponse:
      type: object
