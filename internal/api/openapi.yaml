      properties:
        approval_id:
          type: string
        status:
          $ref: "#/components/schemas/ApprovalStatus"
        intent_status:
          $ref: "#/components/schemas/IntentStatus"
        execution_grant_id:
          type: string
          nullable: true

    PolicyCondition:
      type: object
      properties:
        field:
          type: string
        operator:
          type: string
          enum: [eq, neq, in, not_in, gt, gte, lt, lte, contains, matches]
        value:
          oneOf:
            - type: string
            - type: number
            - type: integer
            - type: boolean
            - type: array
              items: {}

    ApprovalRequirement:
      type: object
      properties:
        mode:
